<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>חזרות אבולוציה</title>
<meta name="description" content="חזרה מרווחת לקורס מבוא לאבולוציה ואקולוגיה">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="אבולוציה">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>html{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a quiet home dashboard (what is due, exam countdown, how each lecture is going), a focused study view (one card, grading row at the thumb), plus quiz, card list and add-material views. */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --ink:#1B2621; --muted:#5D6B64; --line:#D5DDD7; --soft:#E4EAE5;
  --accent:#1E6B57; --accent-ink:#FFFFFF;
  --again:#B2402F; --hard:#A86A10; --good:#1E6B57; --easy:#2C5F9E;
  --new:#2C5F9E; --learn:#B2402F; --review:#1E6B57; --mature:#14493B; --young:#7FB8A6;
  --blank-bg:#FBE7B0; --blank-ink:#5A4300; --ai:#5B4A9E;
  --display:"Frank Ruhl Libre","David",Georgia,serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211D; --ink:#E2E9E4; --muted:#93A39A; --line:#2C3832; --soft:#222C27;
  --accent:#5DC0A3; --accent-ink:#0D1411;
  --again:#F08A78; --hard:#E5B25C; --good:#5DC0A3; --easy:#86B4F0;
  --new:#86B4F0; --learn:#F08A78; --review:#5DC0A3; --mature:#3E9E84; --young:#2D5C4F;
  --blank-bg:#4A3C12; --blank-ink:#FBE3A0; --ai:#B3A4F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --ink:#E2E9E4; --muted:#93A39A; --line:#2C3832; --soft:#222C27;
  --accent:#5DC0A3; --accent-ink:#0D1411;
  --again:#F08A78; --hard:#E5B25C; --good:#5DC0A3; --easy:#86B4F0;
  --new:#86B4F0; --learn:#F08A78; --review:#5DC0A3; --mature:#3E9E84; --young:#2D5C4F;
  --blank-bg:#4A3C12; --blank-ink:#FBE3A0; --ai:#B3A4F0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;max-width:760px;margin:0 auto;box-sizing:border-box}
h1{font-family:var(--display);font-size:1.7rem;margin:0;text-wrap:balance;line-height:1.2}
h2{font-family:var(--display);font-size:1.2rem;margin:0 0 10px;text-wrap:balance}
p{margin:0}
.sub{color:var(--muted);font-size:.92rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.ai{border-color:var(--ai);color:var(--ai)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;box-sizing:border-box;max-width:100%}
textarea{width:100%;resize:vertical;field-sizing:content;min-height:2.6em}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px;margin-bottom:12px}
.sync{font-size:.8rem;color:var(--muted)}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 9px;font-size:.95rem;font-weight:600;color:var(--muted);white-space:nowrap}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.count{display:flex;flex-direction:column;gap:2px}
.count b{font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1;font-weight:700}
.count span{font-size:.85rem;color:var(--muted)}
.c-new b{color:var(--new)} .c-learn b{color:var(--learn)} .c-rev b{color:var(--review)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:4px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.startrow .primary{padding:12px 22px;font-size:1.05rem}
.exam{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.exam .days{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.lec{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-bottom:12px}
.lec:last-of-type{margin-bottom:0}
.lechead{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.lechead span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.forecast{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:90px}
.fc{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.fc i{display:block;width:70%;background:var(--review);border-radius:3px 3px 0 0;min-height:2px}
.fc.exam-day i{background:var(--again)}
.weak{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.weak li{font-size:.92rem;display:flex;gap:8px;align-items:baseline}
.weak li span:first-child{flex:1;min-width:0}
.weak .lapses{color:var(--again);font-size:.8rem;white-space:nowrap}
.settings{display:flex;flex-direction:column;gap:12px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.95rem}
.settings input[type=number]{width:5.5em}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.danger{color:var(--again)}
.danger.arm{background:var(--again);color:var(--surface);border-color:var(--again)}
details summary{cursor:pointer;font-family:var(--display);font-size:1.1rem;font-weight:700}
details[open] summary{margin-bottom:12px}
/* study */
.study{display:flex;flex-direction:column;gap:14px}
.studybar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.remain{display:flex;gap:12px;font-variant-numeric:tabular-nums;font-weight:700}
.remain .on{text-decoration:underline;text-underline-offset:4px}
.r-new{color:var(--new)} .r-learn{color:var(--learn)} .r-rev{color:var(--review)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 22px;display:flex;flex-direction:column;gap:16px;min-height:200px;min-width:0}
.meta{font-size:.8rem;color:var(--muted);letter-spacing:.03em;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta .sp{flex:1}
.meta button{padding:2px 10px;font-size:.8rem}
.q{font-family:var(--display);font-size:1.45rem;line-height:1.55;font-weight:500;text-wrap:pretty}
.ask{font-size:.85rem;color:var(--muted)}
.blank{display:inline-block;background:var(--blank-bg);color:var(--blank-ink);border-radius:6px;padding:0 10px;font-family:var(--body);font-weight:700;font-size:.9em}
.ans{background:var(--blank-bg);color:var(--blank-ink);border-radius:6px;padding:0 6px;font-weight:700}
.answer{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.answer .a{font-size:1.3rem;font-weight:700;color:var(--accent)}
.note{font-size:1rem;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 14px;line-height:1.6;white-space:pre-line}
.note b{display:block;font-size:.78rem;color:var(--muted);letter-spacing:.04em;font-weight:600;margin-bottom:2px}
.note.ai{border-inline-start:3px solid var(--ai)}
details.note summary{cursor:pointer;font-size:.88rem;color:var(--muted);font-weight:600}
details.note[open] summary{margin-bottom:4px}
.note.mine{border-inline-start:3px solid var(--accent)}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conf button{padding:12px 6px;font-size:1rem}
.conf .lbl{grid-column:1/-1;font-size:.85rem;color:var(--muted);text-align:center}
.opts button.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.terms span{border-radius:999px;padding:3px 10px;font-size:.88rem;border:1px solid var(--line)}
.terms .hit{border-color:var(--good);color:var(--good)}
.terms .miss{border-color:var(--again);color:var(--again)}
.note.ai b{color:var(--ai)}
figure{margin:0;display:flex;flex-direction:column;gap:4px}
figure img{max-width:100%;max-height:340px;object-fit:contain;border-radius:8px;background:#fff;align-self:center}
figcaption{font-size:.82rem;color:var(--muted);text-align:center}
.typed input{width:100%;font-size:1.05rem;padding:10px 12px}
.cmp{font-size:.95rem}
.cmp.ok{color:var(--good)} .cmp.no{color:var(--again)} .cmp.part{color:var(--hard)} .cmp.wait{color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.grades button{display:flex;flex-direction:column;align-items:center;padding:10px 4px;font-weight:700;background:var(--surface)}
.grades button small{font-weight:400;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.grades button.sug{box-shadow:0 0 0 3px var(--soft)}
.g1{border-color:var(--again)!important;color:var(--again)} .g2{border-color:var(--hard)!important;color:var(--hard)}
.g3{border-color:var(--good)!important;color:var(--good)} .g4{border-color:var(--easy)!important;color:var(--easy)}
.reveal{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:14px;font-size:1.05rem}
.keys{font-size:.78rem;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:40px 0}
.done .big{font-family:var(--display);font-size:1.6rem}
/* quiz */
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:start;padding:12px 14px;font-size:1.02rem}
.opts button:disabled{opacity:1;cursor:default}
.opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opts button.wrong{border-color:var(--again);background:color-mix(in srgb,var(--again) 14%,var(--surface))}
.progress{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
/* browse / edit */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item .line{display:flex;gap:10px;align-items:baseline}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item .tag{font-size:.75rem;color:var(--muted);white-space:nowrap}
.editor{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);border-radius:12px;padding:12px;background:var(--surface)}
.editor label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.editor .preview{font-size:.95rem;color:var(--muted)}
.warn{color:var(--again);font-size:.85rem}
.gen{display:flex;flex-direction:column;gap:6px}
.gen label.pick{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gen label.pick span{flex:1;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:480px){.q{font-size:1.25rem}.card{padding:20px 16px}.count b{font-size:1.6rem}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--blank-bg);color:var(--blank-ink);border-radius:12px;padding:10px 14px;font-size:.92rem}
.banner button{padding:6px 12px}
body{-webkit-tap-highlight-color:transparent}
#app{padding-top:max(18px,env(safe-area-inset-top,0px))}
</style>
</head>
<body>

<script type="application/json" id="deck">[{"id": "q7", "k": "qa", "f": "איך קרא דרווין למנגנון שבו מינים משתנים?", "b": "ברירה טבעית", "t": "הרצאה_1_הבנת_האבולוציה", "e": "ברירה טבעית: בכל דור נולדים פרטים שונים זה מזה, ומי שהתכונות שלו מתאימות יותר לסביבה שורד ומעמיד יותר צאצאים. כך, לאורך דורות רבים, התכונות המועילות נעשות נפוצות יותר והמין משתנה."}, {"id": "q8", "k": "qa", "f": "מהו הכינוי הנוסף לברירה טבעית?", "b": "\"הישרדות המותאמים\"", "t": "הרצאה_1_הבנת_האבולוציה", "e": "הביטוי \"הישרדות המותאמים\" (survival of the fittest) לא מתכוון לחזק ביותר, אלא למי שמותאם הכי טוב לסביבה הנוכחית ומצליח להעמיד הכי הרבה צאצאים."}, {"id": "q9", "k": "qa", "f": "מהי כשירות (fitness)?", "b": "מדד יחסי להצלחת גנוטיפ לשרוד ולהעמיד צאצאים פוריים, בהשוואה לגנוטיפים אחרים", "t": "הרצאה_1_הבנת_האבולוציה", "e": "כשירות נמדדת תמיד ביחס לאחרים באותה אוכלוסייה ובאותה סביבה. פרט שחי הרבה זמן אבל לא מתרבה, כשירותו אפס. מה שקובע הוא כמה עותקים של הגנים שלו מגיעים לדור הבא."}, {"id": "q10", "k": "qa", "f": "מהו המקור האולטימטיבי לאללים חדשים באוכלוסייה?", "b": "מוטציה", "t": "הרצאה_1_הבנת_האבולוציה", "e": "מוטציה = שינוי ברצף הדנ\"א. זו הדרך היחידה שבה נוצרת גרסה חדשה של גן. רבייה מינית רק מערבבת אללים שכבר קיימים לצירופים חדשים."}, {"id": "q11", "k": "qa", "f": "מהו פנוטיפ?", "b": "תכונה נראית או נמדדת", "t": "הרצאה_1_הבנת_האבולוציה", "e": "פנוטיפ = מה שרואים או מודדים: צבע, גובה, צורת מקור, ואפילו סוג דם. הוא נקבע מהגנוטיפ ביחד עם השפעת הסביבה. הברירה הטבעית \"רואה\" את הפנוטיפ, לא את הגנים ישירות."}, {"id": "q12", "k": "qa", "f": "מהו גנוטיפ?", "b": "רצף הדנ\"א של פרט מסוים", "t": "הרצאה_1_הבנת_האבולוציה", "e": "גנוטיפ = ההרכב הגנטי של הפרט, כלומר אילו אללים יש לו. שני פרטים יכולים להיראות דומים (אותו פנוטיפ) ועדיין להיות בעלי גנוטיפים שונים."}, {"id": "q13", "k": "qa", "f": "איך נקראת מוטציה שאינה משפיעה על הכשירות?", "b": "מוטציה ניטרלית", "t": "הרצאה_1_הבנת_האבולוציה", "e": "רוב המוטציות ניטרליות: הן לא משנות את החלבון או לא משפיעות על הישרדות ורבייה. תדירות שלהן באוכלוסייה משתנה רק במקריות (סחף גנטי), לא בגלל ברירה."}, {"id": "q14", "k": "qa", "f": "מהי אדפטציה (הסתגלות)?", "b": "תכונה תורשתית שמסייעת להישרדות ולרבייה של אורגניזם בסביבתו הנוכחית", "t": "הרצאה_1_הבנת_האבולוציה", "e": "אדפטציה היא תוצאה של ברירה טבעית. היא תמיד ביחס לסביבה מסוימת: פרווה עבה היא אדפטציה בקור, אבל עלולה להזיק באקלים חם."}, {"id": "q15", "k": "qa", "f": "מהי אבולוציה מתפצלת (divergent evolution)?", "b": "שני מינים שמתפתחים בכיוונים שונים מנקודה משותפת", "t": "הרצאה_1_הבנת_האבולוציה", "e": "אבולוציה מתפצלת: אב קדמון משותף אחד, ושתי אוכלוסיות שהתפתחו כל אחת בסביבה אחרת והתרחקו זו מזו. מכאן נוצרים מבנים הומולוגיים: אותו מבנה בסיסי עם תפקידים שונים."}, {"id": "q16", "k": "qa", "f": "מהי אבולוציה מתכנסת (convergent evolution)?", "b": "תכונות דומות שמתפתחות באופן עצמאי במינים ללא מוצא משותף עדכני", "t": "הרצאה_1_הבנת_האבולוציה", "e": "אבולוציה מתכנסת: מינים לא קרובים שחיים בתנאים דומים מפתחים בנפרד פתרון דומה. התכונות שנוצרות דומות בתפקיד אבל לא במוצא, ולכן הן לא מעידות על קרבה."}, {"id": "q17", "k": "qa", "f": "מהי הדוגמה לאבולוציה מתכנסת שהובאה בהרצאה?", "b": "כנפיים אצל עטלפים וחרקים", "t": "הרצאה_1_הבנת_האבולוציה", "e": "גם לעטלף וגם לחרק יש כנפיים לתעופה, אבל המבנה שלהן שונה לגמרי (עצמות אצבעות עם קרום אצל העטלף, שלד חיצוני אצל החרק). הכנפיים התפתחו בנפרד, ולכן זו אבולוציה מתכנסת."}, {"id": "q18", "k": "qa", "f": "מהי אמבריולוגיה?", "b": "חקר התפתחות האנטומיה של אורגניזם מיצירתו ועד צורתו הבוגרת", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "אמבריולוגיה משווה את התפתחות העובר בין מינים. עוברים של חולייתנים שונים דומים מאוד בשלבים מוקדמים (חריצי זימים, זנב), וזו אחת הראיות למוצא משותף."}, {"id": "q19", "k": "qa", "f": "מהם מבנים הומולוגיים?", "b": "מבנים בעלי אותה פריסה בסיסית בזכות מוצא משותף", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "limbs", "e": "דוגמה: הגפה של אדם, כלב, ציפור ולווייתן בנויה מאותן עצמות באותו סדר, למרות שהיא משמשת להליכה, לתעופה או לשחייה. הדמיון במבנה מעיד על אב קדמון משותף."}, {"id": "q20", "k": "qa", "f": "מהם מבנים שרידיים (vestigial structures)?", "b": "מבנים ללא תפקוד נראה לעין, שרידים מאב קדמון", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "מבנה שרידי היה מתפקד אצל האב הקדמון ונשאר בצורה מצומצמת. דוגמאות: עצמות רגליים אחוריות בלווייתנים, עצם הזנב אצל האדם. הם עדות לכך שמינים השתנו לאורך זמן."}, {"id": "q21", "k": "qa", "f": "מהי התכנסות צורה (convergence of form)?", "b": "דמיון בצורה בין מינים לא קרובים שחולקים סביבה דומה", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "arctic", "e": "התכנסות צורה נובעת מלחצי ברירה דומים, לא מקרבה. דוגמה: השועל הארקטי (יונק) והרוטגן (ציפור) הופכים לבנים בחורף, כי בשניהם הלבן משמש הסוואה בשלג."}, {"id": "q22", "k": "qa", "f": "מהם מינים אנדמיים?", "b": "מינים שלא נמצאים בשום מקום אחר", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "מינים אנדמיים נפוצים במיוחד באיים, כי המים מונעים מהם לנדוד ומאחרים להגיע. כך האוכלוסייה מתפתחת בנפרד ונוצר מין ייחודי למקום, כמו רבים מהמינים בגלפאגוס."}, {"id": "q23", "k": "qa", "f": "מהי סחיפה (סחף גנטי)?", "b": "שינויים במאגר הגנים של אוכלוסייה שנובעים ממקריות", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "בסחף גנטי תדירות האללים משתנה במקרה ולא בגלל שאלל מסוים מועיל. ההשפעה חזקה במיוחד באוכלוסיות קטנות, שבהן מוות מקרי של כמה פרטים יכול להעלים אלל לגמרי."}, {"id": "q24", "k": "qa", "f": "מה פירוש \"תיאוריה\" במדע?", "b": "גוף של הסברים בדוקים ומאומתים למערכת של תצפיות", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "תיאוריה מדעית היא הדרגה הגבוהה ביותר של הסבר במדע, לא ניחוש. היא נבדקה שוב ושוב ומסבירה הרבה תצפיות. ניחוש שעוד לא נבדק נקרא השערה."}, {"id": "q25", "k": "qa", "f": "מהי אבולוציה?", "b": "שינוי בהרכב הגנטי של אוכלוסייה לאורך דורות", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "אבולוציה מתרחשת ברמת האוכלוסייה, לא ברמת הפרט. היא נמדדת בשינוי בתדירות האללים או בערך הממוצע של תכונה מדור לדור."}, {"id": "q26", "k": "qa", "f": "איך נקרא שינוי של פרט במהלך חייו?", "b": "התפתחות (ולא אבולוציה)", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "פרט לא עובר אבולוציה. ראשן שהופך לצפרדע או אדם שגדל עוברים התפתחות. אבולוציה היא שינוי בהרכב הגנטי של אוכלוסייה לאורך דורות."}, {"id": "q27", "k": "qa", "f": "איזו יבשת על התפרקה לפני כ-200 מיליון שנה?", "b": "פנגיאה", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "פנגיאה הייתה יבשת על אחת שכללה כמעט את כל היבשות. כשהתפרקה, אוכלוסיות שחיו יחד הופרדו והתפתחו בנפרד, וזה מסביר חלק מהתפוצה של מינים היום."}, {"id": "q28", "k": "qa", "f": "מאיזו יבשת על נוצרו היבשות הצפוניות?", "b": "לורסיה", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "פנגיאה התפצלה תחילה לשתי יבשות על: לורסיה בצפון (ממנה צפון אמריקה, אירופה ורוב אסיה) וגונדוואנה בדרום."}, {"id": "q29", "k": "qa", "f": "מאיזו יבשת על נוצרו היבשות הדרומיות?", "b": "גונדוואנה", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "מגונדוואנה נוצרו אפריקה, דרום אמריקה, אוסטרליה, אנטארקטיקה והודו. לכן מוצאים מאובנים זהים ביבשות הדרומיות, שהיום רחוקות זו מזו."}, {"id": "q30", "k": "qa", "f": "האם תורת האבולוציה מסבירה את מקור החיים?", "b": "לא. היא מסבירה כיצד אוכלוסיות משתנות עם הזמן", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "שאלת מקור החיים (אביוגנזה) נפרדת מתורת האבולוציה. האבולוציה מתחילה מהרגע שיש יצורים שמתרבים ויש ביניהם שונות, ומסבירה איך הם משתנים עם הזמן."}, {"id": "q31", "k": "qa", "f": "האם האבולוציה מכוונת מטרה?", "b": "לא", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "לאבולוציה אין מטרה או כיוון של \"שיפור\". הברירה פועלת רק על השונות שכבר קיימת, ומעדיפה את מה שמתאים לסביבה כרגע. כשהסביבה משתנה, הכיוון יכול להתהפך."}, {"id": "q32", "k": "qa", "f": "מהו מין?", "b": "קבוצת פרטים שמתרבים זה עם זה ומייצרים צאצאים פוריים וברי קיימא", "t": "הרצאה_3_מינים_והתמיינות", "e": "זו ההגדרה הביולוגית של מין, והיא נשענת על יכולת רבייה ולא על מראה. לכן כלבים שנראים שונים מאוד הם מין אחד, וסוס וחמור (שהצאצא שלהם עקר) הם שני מינים."}, {"id": "q33", "k": "qa", "f": "מה נוצר מהכלאה של פודל וקוקר ספנייל?", "b": "קוקאפו", "t": "הרצאה_3_מינים_והתמיינות", "e": "קוקאפו הוא צאצא פורה של שני גזעי כלבים. זו ההוכחה שפודל וקוקר ספנייל הם אותו מין, למרות ההבדלים הגדולים במראה."}, {"id": "q34", "k": "qa", "f": "איך נקרא צאצא של הכלאה בין שני מינים?", "b": "מכלוא (היבריד)", "t": "הרצאה_3_מינים_והתמיינות", "e": "מכלוא נוצר מהכלאה בין שני מינים קרובים, כמו פרד (סוס וחמור) או לייגר (אריה ונמר). בדרך כלל המכלוא עקר, וזה מחסום פוסט-זיגוטי ששומר על ההפרדה בין המינים."}, {"id": "q35", "k": "qa", "f": "מהו מאגר גנים (gene pool)?", "b": "אוסף כל גרסאות הגנים (האללים) במין", "t": "הרצאה_3_מינים_והתמיינות", "e": "מאגר הגנים כולל את כל האללים של כל הפרטים במין או באוכלוסייה. אבולוציה היא בעצם שינוי בהרכב של מאגר הגנים לאורך זמן."}, {"id": "q36", "k": "qa", "f": "מהי התמיינות (speciation)?", "b": "היווצרות שני מינים ממין מקורי אחד", "t": "הרצאה_3_מינים_והתמיינות", "e": "בהתמיינות אוכלוסיות של מין אחד מפסיקות להחליף גנים, צוברות הבדלים, ובסוף כבר לא יכולות להתרבות זו עם זו. כך נוצרים מינים חדשים."}, {"id": "q37", "k": "qa", "f": "מהי התמיינות אלופטרית?", "b": "התמיינות בעקבות הפרדה גיאוגרפית של אוכלוסיות ואבולוציה נפרדת", "t": "הרצאה_3_מינים_והתמיינות", "e": "אלופטרית = \"מולדת אחרת\". מחסום גיאוגרפי (הר, נהר, ים) עוצר את זרימת הגנים, וכל אוכלוסייה מתפתחת בנפרד. דוגמה: הינשוף המנוקד הצפוני והינשוף המקסיקני."}, {"id": "q38", "k": "qa", "f": "מהי התמיינות סימפטרית?", "b": "התמיינות בתוך מין אב שנשאר באותו מיקום", "t": "הרצאה_3_מינים_והתמיינות", "e": "סימפטרית = \"אותה מולדת\". המין החדש נוצר בלי הפרדה גיאוגרפית, למשל דרך פוליפלואידיה בצמחים או ניצול מקור מזון אחר, כמו בדגי הציקלידים."}, {"id": "q39", "k": "qa", "f": "מהי זרימת גנים?", "b": "תנועת אללים על פני תחום התפוצה של המין", "t": "הרצאה_3_מינים_והתמיינות", "e": "זרימת גנים קורית כשפרטים נודדים בין אוכלוסיות ומזדווגים שם. היא שומרת על האוכלוסיות דומות זו לזו. כשהיא נעצרת, האוכלוסיות מתרחקות גנטית ועלולות להפוך למינים נפרדים."}, {"id": "q40", "k": "qa", "f": "מהי התפצלות סתגלנית (adaptive radiation)?", "b": "אירועי התמיינות מרובים ממין יחיד, כשכל אוכלוסייה מתאימה לגומחה אחרת", "t": "הרצאה_3_מינים_והתמיינות", "img": "honeycreepers", "e": "בהתפצלות סתגלנית מין מייסד אחד מגיע לאזור עם הרבה גומחות פנויות, ומתפצל למינים רבים שכל אחד מותאם לגומחה אחרת. דוגמאות: החוחיות של דרווין ויונקי הדבש של הוואי."}, {"id": "q41", "k": "qa", "f": "איך נקרא המין המקורי שממנו התפתחו כל המינים בהתפצלות סתגלנית?", "b": "המין המייסד", "t": "הרצאה_3_מינים_והתמיינות", "e": "המין המייסד הוא האב הקדמון שהגיע לאזור החדש, למשל חוחית אחת מהיבשת שהגיעה לגלפאגוס. ממנו התפתחו כל המינים בהתפצלות."}, {"id": "q42", "k": "qa", "f": "מהי אנופלואידיה?", "b": "יותר מדי או מעט מדי כרומוזומים בודדים בתא", "t": "הרצאה_3_מינים_והתמיינות", "e": "אנופלואידיה נוצרת מאי-ניתוק במיוזה, וגורמת לתא להיות 2n+1 או 2n-1. בדרך כלל זה מזיק (דוגמה בבני אדם: תסמונת דאון, שלושה עותקים של כרומוזום 21)."}, {"id": "q43", "k": "qa", "f": "מהי פוליפלואידיה?", "b": "קבוצה נוספת (או קבוצות) שלמה של כרומוזומים", "t": "הרצאה_3_מינים_והתמיינות", "e": "בפוליפלואידיה מתווספת מערכת שלמה של כרומוזומים (למשל 3n או 4n), ולא כרומוזום בודד. זה נפוץ בעיקר בצמחים, ויכול ליצור מין חדש בדור אחד."}, {"id": "q44", "k": "qa", "f": "מהי אוטופוליפלואידיה?", "b": "ריבוי קבוצות כרומוזומים מהמין עצמו", "t": "הרצאה_3_מינים_והתמיינות", "img": "autopoly", "e": "\"אוטו\" = עצמי. אוטופוליפלואיד נוצר כשמיוזה לא מסתיימת בחלוקת התא, ונוצרת גמטה 2n במקום n. הצאצא (4n) כבר לא יכול להתרבות עם ההורים (2n), וכך נוצר מין חדש."}, {"id": "q45", "k": "qa", "f": "מהו אלופוליפלואיד?", "b": "צאצא בר-קיימא מגמטות של שני מינים שונים", "t": "הרצאה_3_מינים_והתמיינות", "img": "allopoly", "e": "\"אלו\" = אחר. אלופוליפלואיד נוצר מהכלאה בין שני מינים שונים, ומחזיק מערכות כרומוזומים משניהם. דוגמאות: חיטה, כותנה וטבק תרבותיים."}, {"id": "q46", "k": "qa", "f": "מהי זיגוטה?", "b": "ביצית מופרית", "t": "הרצאה_3_מינים_והתמיינות", "e": "זיגוטה נוצרת כשזרע מפרה ביצית. היא התא הראשון של הצאצא. לפי הזיגוטה מחלקים את מחסומי הרבייה: לפני היווצרותה (פרה-זיגוטי) או אחריה (פוסט-זיגוטי)."}, {"id": "q47", "k": "qa", "f": "מהו מחסום פרה-זיגוטי?", "b": "מנגנון שמונע הזדווגות או הפריה", "t": "הרצאה_3_מינים_והתמיינות", "e": "מחסום פרה-זיגוטי פועל לפני ההפריה. סוגים: בידוד זמנים, בידוד בית גידול, בידוד התנהגותי, בידוד מכני (אי-התאמה של איברי רבייה) ומחסום גמטי."}, {"id": "q48", "k": "qa", "f": "מהו מחסום פוסט-זיגוטי?", "b": "מחסום שפועל אחרי היווצרות זיגוטה (העובר לא שורד או שהצאצא עקר)", "t": "הרצאה_3_מינים_והתמיינות", "e": "מחסום פוסט-זיגוטי פועל אחרי שכבר נוצרה ביצית מופרית: העובר לא מתפתח, הצאצא חלש, או שהוא עקר. הדוגמה הקלאסית היא הפרד."}, {"id": "q49", "k": "qa", "f": "מהו בידוד זמנים?", "b": "הבדלים בלוחות הזמנים של הרבייה", "t": "הרצאה_3_מינים_והתמיינות", "e": "בבידוד זמנים שני המינים יכולים לחיות באותו מקום, אבל מתרבים בזמנים שונים (עונה או שעה ביום), ולכן לא נפגשים להזדווגות. דוגמה: שני מיני צפרדעים שמתרבים בחודשים שונים."}, {"id": "q50", "k": "qa", "f": "מהו בידוד בית גידול?", "b": "אוכלוסיות שחיות בבתי גידול שאינם חופפים", "t": "הרצאה_3_מינים_והתמיינות", "e": "בבידוד בית גידול כל מין מעדיף סביבה אחרת, ולכן הם כמעט לא נפגשים, גם אם הם גרים קרוב. דוגמה: שני מיני צרצרים שמעדיפים קרקע חולית או חרסית."}, {"id": "q51", "k": "qa", "f": "מהו בידוד התנהגותי?", "b": "התנהגות ספציפית (או היעדרה) שמונעת רבייה", "t": "הרצאה_3_מינים_והתמיינות", "e": "בבידוד התנהגותי בני הזוג לא מזהים זה את זה כמתאימים, כי טקסי החיזור שונים: שיר, ריקוד או אות. דוגמה: גחליליות עם דפוס הבהוב ייחודי לכל מין."}, {"id": "q52", "k": "qa", "f": "מהו מחסום גמטי?", "b": "הבדלים בביציות ובזרע שמונעים הפריה", "t": "הרצאה_3_מינים_והתמיינות", "e": "במחסום גמטי ההזדווגות יכולה לקרות, אבל הזרע לא מצליח להפרות את הביצית, למשל כי חלבוני הזיהוי על פני התאים לא מתאימים. זה נפוץ ביצורים שמשחררים תאי מין למים."}, {"id": "q53", "k": "qa", "f": "מהי עקרות היברידית?", "b": "מכלואים שנולדים וגדלים אך אינם מסוגלים להתרבות", "t": "הרצאה_3_מינים_והתמיינות", "e": "עקרות היברידית היא מחסום פוסט-זיגוטי: המכלוא נולד, גדל ונראה בריא, אבל לא יכול להעמיד צאצאים. לכן הגנים של שני המינים לא מתערבבים לאורך זמן. דוגמה: הפרד."}, {"id": "q54", "k": "qa", "f": "מהי היברידיזציה?", "b": "רבייה בין פרטים משני מינים שונים אך קרובים", "t": "הרצאה_3_מינים_והתמיינות", "e": "היברידיזציה מראה שמחסומי הרבייה לא תמיד מוחלטים. כשהיא קורית בטבע, ייתכן שתהליך ההתמיינות בין שני המינים עוד לא הושלם."}, {"id": "q55", "k": "qa", "f": "מדוע הפרד עקר?", "b": "הכרומוזומים שלו אינם הומולוגיים ולא מסתדרים בזוגות במיוזה", "t": "הרצאה_3_מינים_והתמיינות", "e": "לפרד 63 כרומוזומים: 32 מהסוסה ו-31 מהחמור. הכרומוזומים של הסוס ושל החמור לא תואמים, ולכן במיוזה הם לא מצליחים להתזווג ולהיפרד כראוי, ולא נוצרות גמטות תקינות."}, {"id": "q56", "k": "qa", "f": "מהי סיסטמטיקה?", "b": "המדע שמסווג אורגניזמים לפי הקרבה האבולוציונית ביניהם", "t": "הרצאה_3_מינים_והתמיינות", "e": "סיסטמטיקה מסדרת את היצורים בקבוצות (מין, סוג, משפחה וכו') לפי קרבה אבולוציונית, ובונה עצים פילוגנטיים. היום היא נשענת בעיקר על השוואת רצפי DNA."}, {"id": "q57", "k": "qa", "f": "מה נוצר מהכלאה של אריה ונמר בשבי?", "b": "לייגר", "t": "הרצאה_3_מינים_והתמיינות", "e": "לייגר הוא מכלוא של אריה ונמרה. ההכלאה אפשרית כי שני המינים שייכים לאותו סוג (Panthera), אבל בטבע זה לא קורה כי הם חיים באזורים שונים."}, {"id": "q58", "k": "qa", "f": "מה פירוש MRCA?", "b": "האב הקדמון המשותף המאוחר ביותר (Most Recent Common Ancestor)", "t": "הרצאה_3_מינים_והתמיינות", "e": "MRCA הוא הצומת המשותף האחרון של שני מינים בעץ הפילוגנטי. ככל שהוא קרוב יותר להווה, המינים התפצלו לאחרונה ולכן קרובים יותר."}, {"id": "q59", "k": "qa", "f": "מה פירוש LUCA?", "b": "Last Universal Common Ancestor, האב הקדמון המשותף האוניברסלי", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "LUCA הוא האב הקדמון המשותף של כל היצורים החיים היום: חיידקים, ארכאונים ואאוקריוטים. הראיה לקיומו: כולם משתמשים ב-DNA ובאותו קוד גנטי."}, {"id": "q60", "k": "qa", "f": "מהי אביוגנזה?", "b": "היווצרות חיים מחומר דומם", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "אביוגנזה היא השאלה איך נוצרו החיים הראשונים, לפני כ-4 מיליארד שנה. ההשערות המרכזיות: המרק הקדמון, הנביעות ההידרותרמיות ועולם ה-RNA."}, {"id": "q61", "k": "qa", "f": "למה הפך החיידק שנבלע באנדוסימביוזה?", "b": "לאברון המיטוכונדריה", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "לפי תיאוריית האנדוסימביוזה, ארכאון בלע חיידק ולא עיכל אותו. החיידק המשיך לחיות בתוכו והפך למיטוכונדריה, אברון הפקת האנרגיה. לכן למיטוכונדריה יש DNA משלה."}, {"id": "q62", "k": "qa", "f": "אילו יצורים שחררו את החמצן באירוע החמצון הגדול?", "b": "ציאנובקטריה פוטוסינתטיים", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "ציאנובקטריה הם חיידקים שעושים פוטוסינתזה ומשחררים חמצן. לפני כ-2.4 מיליארד שנה הם העלו את רמת החמצן באטמוספירה. זה גרם להכחדה של יצורים אנאירוביים, אבל אפשר נשימה אירובית."}, {"id": "q63", "k": "qa", "f": "מהו פולימורפיזם?", "b": "קיום של פנוטיפים או אללים שונים באוכלוסייה", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "kittens", "e": "פולימורפיזם = \"צורות רבות\". דוגמה: גורים מאותה המלטה עם צבעי פרווה שונים. השונות הזו היא חומר הגלם שעליו פועלת הברירה הטבעית."}, {"id": "q64", "k": "qa", "f": "מהי תורשתיות?", "b": "החלק מהשונות הפנוטיפית שניתן לייחס להבדלים גנטיים", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "שונות פנוטיפית = שונות גנטית + שונות סביבתית. תורשתיות מודדת כמה מתוכה גנטית. ככל שהיא גבוהה יותר, הברירה יכולה לשנות את הדור הבא מהר יותר."}, {"id": "q65", "k": "qa", "f": "מהי ברירה כיוונית?", "b": "ברירה שבה תכונה בקצה אחד של הטווח מועדפת (עש הפלפל, צוואר הג'ירפה)", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "בברירה כיוונית הממוצע של התכונה זז לכיוון אחד מדור לדור. דוגמה: עש הפלפל, שבו העשים הכהים הועדפו על עצים שהשחירו מפיח, ושיעורם עלה מכ-2% לכ-95%."}, {"id": "q66", "k": "qa", "f": "מהי ברירה מייצבת?", "b": "ברירה שבה הקצוות נבררים לרעה והממוצע מועדף", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "בברירה מייצבת הממוצע נשאר במקום והשונות קטנה. דוגמה: משקל לידה, שבו תינוקות קלים מדי או כבדים מדי שורדים פחות."}, {"id": "q67", "k": "qa", "f": "מהי ברירה מפצלת?", "b": "ברירה שבה שני הקצוות מועדפים על פני הממוצע", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "בברירה מפצלת הפרטים הבינוניים שורדים פחות משני הקצוות. האוכלוסייה מתפצלת לשתי קבוצות, ולאורך זמן זה יכול להוביל להתמיינות."}, {"id": "q68", "k": "qa", "f": "מהי ברירה מלאכותית?", "b": "ברירה שבני אדם מפעילים בגידול צמחים ובעלי חיים", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "בברירה מלאכותית בני אדם בוחרים אילו פרטים יתרבו, לפי תכונה שהם רוצים. דוגמאות: גזעי כלבים וזני תירס. דרווין השתמש בה כדי להסביר איך ברירה טבעית עובדת."}, {"id": "c3", "k": "cz", "x": "רעיון ההשתנות ההדרגתית של כדור הארץ (לייל) נתן לדרווין השראה לרעיון של {{c1::שינוי הדרגתי גם במינים}}.", "e": "צ'ארלס לייל, גיאולוג וחברו של דרווין, הפיץ את רעיונו של ג'יימס האטון: כדור הארץ משתנה בהדרגה, מהצטברות שינויים קטנים לאורך זמן רב. דרווין החיל את אותו היגיון על מינים.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c11", "k": "cz", "x": "מיני חוחיות הקרקע בגלפאגוס נבדלו זה מזה בעיקר ב{{c1::צורת המקור}}.", "e": "כל צורת מקור מותאמת למזון אחר שזמין באי: מקור עבה וחזק לשבירת זרעים, ומקור דק דמוי חנית לדקירת חרקים.", "t": "הרצאה_1_הבנת_האבולוציה", "img": "finches"}, {"id": "c13", "k": "cz", "x": "דרווין שיער שמיני החוחיות באיים {{c1::השתנו מאחד המינים היבשתיים המקוריים}}.", "e": "החוחיות בגלפאגוס דמו למין חוחית בדרום אמריקה. דרווין הסיק שהן צאצאים של אב יבשתי משותף, שהשתנו בכל אי בנפרד.", "t": "הרצאה_1_הבנת_האבולוציה", "img": "finches"}, {"id": "c16", "k": "cz", "x": "לפי הברירה הטבעית, {{c1::רבייה גדולה יותר}} של פרטים בעלי תכונות חיוביות מובילה לשינוי אבולוציוני.", "e": "ברירה טבעית (\"הישרדות המותאמים\"): פרטים שהתכונות שלהם מתאימות לסביבה שורדים ומעמידים יותר צאצאים. כך התכונות האלה נעשות נפוצות יותר באוכלוסייה.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c18", "k": "cz", "x": "ברירה טבעית יכולה להתרחש רק כשיש {{c1::שונות גנטית}} בין פרטים.", "e": "שונות גנטית = הבדלים ברצף הדנ\"א בין פרטים. בלי הבדלים אין בין מה \"לבחור\", והברירה לא יכולה לשנות דבר.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c19", "k": "cz", "x": "כדי שהברירה תשנה את הדור הבא, ההבדלים בין הפרטים חייבים להיות בעלי {{c1::בסיס גנטי (הבדלים ברצף הדנ\"א)}}.", "e": "שונות שנגרמת מהסביבה (למשל אדם גבוה בזכות תזונה טובה) לא עוברת לצאצאים. לכן היא לא משנה את הדור הבא.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c21", "k": "cz", "x": "כשירות איננה מדד לבריאות כללית אלא ל{{c1::תרומה הגנטית לדורות הבאים}}.", "e": "כשירות (fitness) = מדד יחסי לכמה גנוטיפ מצליח לשרוד ולהעמיד צאצאים פוריים, לעומת גנוטיפים אחרים באותה אוכלוסייה. פרט בריא שלא מתרבה תורם 0 לדורות הבאים.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c22", "k": "cz", "x": "כשירות {{c1::תלויה בסביבה}}: תכונה שמעלה כשירות במקום אחד יכולה להפחית אותה במקום אחר.", "e": "דוגמה: עלים גדולים מועילים באקלים לח (יותר אנרגיה מהשמש), אבל מזיקים באקלים יבש כי הם מאבדים הרבה מים.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c23", "k": "cz", "x": "אללים שמגבירים כשירות נעשים {{c1::נפוצים יותר}} עם הזמן.", "e": "אלל = גרסה של גן. אלל שמגביר כשירות עובר ליותר צאצאים, ולכן התדירות שלו באוכלוסייה עולה מדור לדור.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c24", "k": "cz", "x": "שני המנגנונים העיקריים שיוצרים מגוון גנטי: {{c1::מוטציה}} ו{{c2::רבייה מינית}}.", "e": "מוטציה = שינוי ברצף הדנ\"א, והיא המקור האולטימטיבי לאללים חדשים. רבייה מינית לא יוצרת אללים חדשים, אלא מערבבת אללים קיימים לצירופים חדשים בכל צאצא.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c31", "k": "cz", "x": "האם תכונה היא \"טובה\" תלוי ב{{c1::תנאי הסביבה באותו זמן}}.", "e": "אין תכונה שהיא \"טובה\" תמיד. כשהסביבה משתנה, כיוון הברירה יכול להתהפך, ותכונה שהועילה יכולה להפוך למזיקה.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c36", "k": "cz", "x": "הברירה הטבעית פועלת על {{c1::אורגניזמים בודדים}}, ודרכם מעצבת מין שלם.", "e": "הברירה \"מחליטה\" על פרטים (מי שורד ומתרבה), אבל השינוי האבולוציוני עצמו נמדד ברמת האוכלוסייה, ולוקח דורות רבים.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c39", "k": "cz", "x": "שתי הדוגמאות הקלאסיות לרצף מאובנים שמראה התפתחות צורה: {{c1::בני אדם (הומינידים) וסוסים}}.", "e": "תיעוד המאובנים מראה שאורגניזמים מהעבר שונים מאלה של היום. אצל ההומינידים השתנתה צורת הגולגולת, ואצל אבות הסוס בעיקר הגודל.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "fossils"}, {"id": "c42", "k": "cz", "x": "התפתחות העובר נשמרת בין מינים כי למוטציות בעובר יש השלכות {{c1::גדולות ולרוב קטלניות}}.", "e": "שינוי מוקדם בהתפתחות העובר משפיע על כל מה שנבנה אחריו, ולכן לרוב הוא קטלני. התוצאה: שלבי התפתחות העובר נשמרים דומים גם בין מינים רחוקים, וזו עדות למוצא משותף.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "embryos"}, {"id": "c43", "k": "cz", "x": "כל עוברי החולייתנים, כולל האדם, מציגים בשלב מוקדם {{c1::חריצי זימים וזנב}}.", "e": "אצל יצורים יבשתיים חריצי הזימים והזנב נעלמים בהמשך ההתפתחות, אבל אצל דגים הם נשמרים בבוגר. זה מראה שלכל החולייתנים יש אב קדמון משותף.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "embryos"}, {"id": "c46", "k": "cz", "x": "דוגמה למבנים הומולוגיים: עצמות הגפה של {{c1::אדם, כלב, ציפור ולווייתן}}.", "e": "מבנים הומולוגיים = מבנים עם אותה פריסת עצמות בסיסית, שמקורם באב קדמון משותף, גם אם התפקיד שלהם שונה (הליכה, תעופה, שחייה). אל תבלבל עם מבנים מקבילים, שדומים בתפקיד בלי מוצא משותף.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "limbs"}, {"id": "c49", "k": "cz", "x": "מבנה שרידי בלווייתנים: {{c1::עצמות רגליים אחוריות}}.", "e": "מבנה שרידי = מבנה ללא תפקוד נראה לעין, שנשאר מאב קדמון שבו הוא כן תפקד. אבות הלווייתנים היו יונקים יבשתיים עם רגליים.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c51", "k": "cz", "x": "הלבן החורפי של השועל הארקטי והרוטגן נובע מ{{c1::לחצי סלקציה דומים}}, לא ממוצא משותף.", "e": "התכנסות צורה = דמיון שנוצר בגלל סביבה דומה ולא בגלל קרבה. השועל (יונק) והרוטגן (ציפור) לא קרובים, אבל בשניהם הלבן נבחר כהסוואה בשלג.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "arctic"}, {"id": "c52", "k": "cz", "x": "את התפוצה הגיאוגרפית של אורגניזמים מסבירים אבולוציה ו{{c1::תנועת הלוחות הטקטוניים}}.", "e": "ביוגיאוגרפיה = חקר התפוצה הגיאוגרפית של אורגניזמים. כשהיבשות התפרקו ונדדו, קבוצות שהיו יחד הופרדו והתפתחו בנפרד.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "gondwana"}, {"id": "c56", "k": "cz", "x": "הגיוון הגדול של חיות הכיס באוסטרליה והיעדר יונקים אחרים משקפים את {{c1::הבידוד הארוך}} של היבשת.", "e": "אוסטרליה מבודדת מזמן, ולכן חיות הכיס התגוונו שם בלי תחרות מיונקי שליה שהתפתחו ביבשות אחרות.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c57", "k": "cz", "x": "מינים אנדמיים אופייניים במיוחד ל{{c1::איים}}, שבהם המים מונעים נדידה.", "e": "מינים אנדמיים = מינים שלא נמצאים בשום מקום אחר. באי מבודד מינים לא יכולים לנדוד, ולכן הם מתפתחים למינים ייחודיים.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c58", "k": "cz", "x": "עדות מולקולרית לאב קדמון משותף: {{c1::האוניברסליות}} של DNA, של הקוד הגנטי ושל מנגנוני השכפול והביטוי.", "e": "כל היצורים, מחיידק ועד אדם, משתמשים ב-DNA כחומר תורשתי ובאותו קוד גנטי. ההסבר הפשוט ביותר: כולם צאצאים של אב קדמון משותף אחד.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c59", "k": "cz", "x": "הקרבה בין קבוצות אורגניזמים מתבטאת ב{{c1::דמיון ברצפי ה-DNA}} שלהן.", "e": "ככל ששתי קבוצות התפצלו מאב משותף מאוחר יותר, היה פחות זמן להצטברות הבדלים, ולכן הרצפים שלהן דומים יותר.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c60", "k": "cz", "x": "פונקציות חדשות לחלבונים מתפתחות בדרך כלל לאחר {{c1::שכפול גנים}}.", "e": "כשגן משוכפל יש שני עותקים. אחד ממשיך לייצר את החלבון המקורי, והשני חופשי להשתנות (במוטציה, בברירה או בסחף) ולקבל תפקיד חדש.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c64", "k": "cz", "x": "\"תיאוריה\" בשפת היומיום קרובה יותר למושג המדעי {{c1::השערה}}.", "e": "תיאוריה מדעית = גוף הסברים שנבדקו ואומתו שוב ושוב (כמו תורת הכבידה). השערה = הסבר מוצע שעדיין לא נבדק. לכן \"רק תיאוריה\" הוא אפיון מוטעה של האבולוציה.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c65", "k": "cz", "x": "אבולוציה של מאפיין = שינוי ב{{c1::ערך הממוצע}} שלו באוכלוסייה לאורך זמן.", "e": "דוגמה: מקור החוחית הבודדת לא משתנה בחייה. מה שמשתנה הוא גודל המקור הממוצע באוכלוסייה, כי בכל דור נולדים פרטים חדשים בהרכב אחר.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c69", "k": "cz", "x": "\"אורגניזמים מתפתחים בתגובה לסביבה\" הוא קיצור של \"{{c1::אוכלוסייה}} מתפתחת בתגובה לסביבה משתנה\".", "e": "אבולוציה היא שינוי באוכלוסייה. פרט שמשתנה במהלך חייו עובר התפתחות, לא אבולוציה.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c70", "k": "cz", "x": "השונות שעליה פועלת הברירה {{c1::כבר קיימת באוכלוסייה}}, ואינה נוצרת בתגובה לשינוי בסביבה.", "e": "הסביבה לא \"יוצרת\" את התכונה הדרושה. היא רק מעדיפה פרטים שכבר נושאים אותה. לכן האבולוציה אינה מכוונת מטרה.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c72", "k": "cz", "x": "האנטיביוטיקה אינה יוצרת מוטציות עמידות אלא {{c1::בוררת}} את החיידקים העמידים.", "e": "גן העמידות כבר היה קיים בכמה חיידקים, בתדירות נמוכה. האנטיביוטיקה הורגת את הרגישים, ונשארים העמידים שמתרבים. ניסויים הראו שהאנטיביוטיקה לא גורמת למוטציות העמידות.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c73", "k": "cz", "x": "מינים אינם נעשים \"טובים יותר\" עם הזמן; הם {{c1::עוקבים אחר הסביבה המשתנה}}.", "e": "לאבולוציה אין כיוון של \"שיפור\", מורכבות או חוכמה. תכונה מתאימה רק ביחס לסביבה הנוכחית, ויכולה להפוך למזיקה כשהסביבה משתנה.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c75", "k": "cz", "x": "כלבי בית שונים מאוד במראה, אבל הם מין אחד כי {{c1::יכולים להתרבות ולהעמיד צאצאים פוריים}}.", "e": "ההגדרה הביולוגית של מין נשענת על יכולת רבייה, לא על מראה. פודל וקוקר ספנייל נראים שונים מאוד, אבל הצאצא שלהם (קוקאפו) פורה. לעומת זאת, שני עיטים שנראים דומים יכולים להיות מינים שונים.", "t": "הרצאה_3_מינים_והתמיינות", "img": "dogs"}, {"id": "c78", "k": "cz", "x": "ברבייה מינית, שינוי גנטי יעבור לדור הבא רק אם הוא נמצא ב{{c1::גמטה (זרע או ביצית)}}.", "e": "גמטה = תא מין (זרע או ביצית). מוטציה בתא גוף רגיל (למשל בעור) נעלמת עם הפרט ולא מגיעה לצאצאים.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c79", "k": "cz", "x": "רק תכונות {{c1::תורשתיות}} יכולות להתפתח אבולוציונית.", "e": "תכונה תורשתית = תכונה שיש לה בסיס גנטי ועוברת לצאצאים. תכונה נרכשת (כמו שרירים מאימון) לא עוברת, ולכן הברירה לא יכולה לפעול עליה לאורך דורות.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c81", "k": "cz", "x": "הכלאות בטבע בין מינים דומים עשויות להעיד ש{{c1::תהליך ההתמיינות טרם הושלם}}.", "e": "התמיינות = היווצרות שני מינים ממין אחד. אם שתי אוכלוסיות עדיין מצליחות להעמיד מכלואים, ייתכן שהן בדרך להיפרד אבל עוד לא הגיעו לבידוד רבייתי מלא.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c89", "k": "cz", "x": "הפרדה גיאוגרפית {{c1::מונעת זרימת גנים}}, ולכן תדירויות האללים מתבדלות.", "e": "זרימת גנים = מעבר אללים בין אוכלוסיות כשפרטים נודדים ומזדווגים. כשהיא נעצרת, כל אוכלוסייה צוברת מוטציות משלה ונבררת לפי הסביבה שלה, וכך הן מתרחקות גנטית.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c94", "k": "cz", "x": "דוגמה להתמיינות אלופטרית בחוף המערבי של ארה\"ב: {{c1::הינשוף המנוקד הצפוני והינשוף המקסיקני}}.", "e": "התמיינות אלופטרית (\"מולדת אחרת\") = היווצרות מינים בעקבות הפרדה גיאוגרפית. הינשופים חיים באזורים שונים, באקלים שונה ועם טרף שונה, וצברו הבדלים גנטיים ופנוטיפיים.", "t": "הרצאה_3_מינים_והתמיינות", "img": "owls"}, {"id": "c95", "k": "cz", "x": "ככל שהמרחק בין שתי קבוצות גדל, הסיכוי להתמיינות {{c1::גדל}}.", "e": "ככל שהמרחק גדל, תנאי הסביבה (אקלים, טרף, טורפים) שונים יותר, ולכן הברירה דוחפת כל קבוצה לכיוון אחר.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c97", "k": "cz", "x": "דוגמה להתפצלות סתגלנית באיי הוואי: {{c1::יונקי הדבש של הוואי (honeycreepers)}}.", "e": "התפצלות סתגלנית = מין מייסד אחד מתפצל למינים רבים, וכל אחד מותאם לגומחה אחרת. ביונקי הדבש של הוואי המקורים התאימו למזון: מקור ארוך לצוף, מקור דמוי חרב לחרקים, ומקור עבה לזרעים.", "t": "הרצאה_3_מינים_והתמיינות", "img": "honeycreepers"}, {"id": "c100", "k": "cz", "x": "דוגמה נוספת להתפצלות סתגלנית: {{c1::החוחיות של דרווין}}.", "e": "החוחיות של דרווין בגלפאגוס: מין מייסד יחיד שהגיע מהיבשת התפצל למינים רבים, כל אחד עם מקור שמותאם למזון אחר באיים.", "t": "הרצאה_3_מינים_והתמיינות", "img": "finches"}, {"id": "c102", "k": "cz", "x": "אנופלואידיה נוצרת עקב {{c1::אי-ניתוק}} כרומוזומים במיוזה.", "e": "אי-ניתוק = הכרומוזומים לא נפרדים כראוי במיוזה. נוצרות גמטות עם כרומוזום עודף (n+1) או חסר (n-1), והזיגוטה תהיה 2n+1 או 2n-1. זו אנופלואידיה.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c104", "k": "cz", "x": "אוטופוליפלואידיה נוצרת כשמיוזה אינה מלווה ב{{c1::ציטוקינזיס}}.", "e": "ציטוקינזיס = חלוקת הציטופלזמה לשני תאים בסוף החלוקה. כשהיא לא קורית, כל הכרומוזומים נשארים בתא אחד, ונוצרת גמטה עם שתי מערכות (2n) במקום אחת (n).", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c106", "k": "cz", "x": "פרט טטרפלואיד יכול להתרבות {{c1::רק עם טטרפלואידים אחרים}}, ולכן ההתמיינות מהירה.", "e": "טטרפלואיד (4n) = ארבע מערכות כרומוזומים. ההכלאה שלו עם ההורה הדיפלואידי (2n) לא מצליחה, ולכן הוא מבודד רבייתית כבר מהדור הראשון. זו התמיינות סימפטרית מהירה, בלי הפרדה גיאוגרפית.", "t": "הרצאה_3_מינים_והתמיינות", "img": "autopoly"}, {"id": "c108", "k": "cz", "x": "חיטה, כותנה וטבק תרבותיים הם {{c1::אלופוליפלואידים}}.", "e": "אלופוליפלואיד = פוליפלואיד שנוצר מהכלאה בין שני מינים שונים (\"אלו\" = אחר). לעומתו, אוטופוליפלואיד נוצר בתוך מין אחד (\"אוטו\" = עצמי).", "t": "הרצאה_3_מינים_והתמיינות", "img": "allopoly"}, {"id": "c109", "k": "cz", "x": "פוליפלואידיה נפוצה בעיקר ב{{c1::צמחים}}.", "e": "בבעלי חיים שינויים כאלה במספר הכרומוזומים בדרך כלל לא שורדים. יותר ממחצית ממיני הצמחים שנחקרו קשורים למין שנוצר בפוליפלואידיזציה.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c111", "k": "cz", "x": "שני מיני צפרדעים: אחד מתרבה בינואר–מרץ והשני במרץ–מאי. זהו {{c1::בידוד זמנים}}.", "e": "בידוד זמנים הוא מחסום פרה-זיגוטי, כלומר מונע את ההזדווגות עוד לפני שנוצרת ביצית מופרית. המינים חיים באותו מקום, אבל לא מתרבים באותו זמן.", "t": "הרצאה_3_מינים_והתמיינות", "img": "frogs"}, {"id": "c112", "k": "cz", "x": "הצרצרים G. pennsylvanicus ו-G. firmus מבודדים בגלל העדפת {{c1::סוג קרקע}} (חולית או חרסית).", "e": "בידוד בית גידול (מחסום פרה-זיגוטי): שני המינים יכולים לחיות קרוב, אבל כל אחד מעדיף קרקע אחרת, ולכן הם כמעט לא נפגשים להזדווגות.", "t": "הרצאה_3_מינים_והתמיינות", "img": "crickets"}, {"id": "c113", "k": "cz", "x": "דוגמה לבידוד התנהגותי: {{c1::גחליליות}} עם דפוסי אור ייחודיים לכל מין.", "e": "בידוד התנהגותי (מחסום פרה-זיגוטי): הנקבה מזהה רק את דפוס האור של זכר מהמין שלה, ולא תזדווג עם זכר שמהבהב בדפוס אחר.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c114", "k": "cz", "x": "דוגמה לאי-התאמה של איברי רבייה: זכרי {{c1::שפיריות}} ממינים שונים.", "e": "בידוד מכני (מחסום פרה-זיגוטי): לכל מין צורה שונה של איבר הרבייה, שמתאימה רק לנקבה מאותו מין.", "t": "הרצאה_3_מינים_והתמיינות", "img": "damselfly"}, {"id": "c115", "k": "cz", "x": "בצמחים, מבנה הפרח (למשל מנהרת הצוף) מותאם ל{{c1::מאביק מסוים}}.", "e": "דוגמאות: פרח האצבעונית בצורת פעמון מותאם לדבורים, ופרח החצוצרה הארוך מותאם ליונקי דבש. כך האבקה הוא לא מגיע למין צמח אחר.", "t": "הרצאה_3_מינים_והתמיינות", "img": "pollinators"}, {"id": "c118", "k": "cz", "x": "דוגמה להתמיינות סימפטרית בלי פוליפלואידיה: דגים שמנצלים {{c1::מקור מזון בעומק אחר}} באגם.", "e": "התמיינות סימפטרית (\"אותה מולדת\") = היווצרות מין חדש בלי הפרדה גיאוגרפית. הדגים שאוכלים בעומק אחר מזדווגים בעיקר זה עם זה, ובהדרגה נפרדים מהאוכלוסייה המקורית.", "t": "הרצאה_3_מינים_והתמיינות", "img": "cichlids"}, {"id": "c119", "k": "cz", "x": "באגם {{c1::ויקטוריה}} באפריקה נמצאו מאות אירועי התמיינות סימפטרית בדגי ציקלידים.", "e": "דגי הציקלידים באגם ויקטוריה הם דוגמה להתמיינות סימפטרית מהירה ורבה. דוגמה נוספת היא אגם אפויאק בניקרגואה: שתי אוכלוסיות עם שפתיים ותזונה שונות נוצרו בתוך כ-100 שנה.", "t": "הרצאה_3_מינים_והתמיינות", "img": "cichlids"}, {"id": "c123", "k": "cz", "x": "הכלאה בין מינים מראה ש{{c1::מחסומי הרבייה}} אינם תמיד מוחלטים.", "e": "היברידיזציה = רבייה בין שני מינים קרובים. היא אפשרית רק כשהמחסומים הפרה-זיגוטיים לא מונעים אותה לגמרי, אבל לרוב מחסום פוסט-זיגוטי (צאצא עקר) עדיין שומר על ההפרדה.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c127", "k": "cz", "x": "לפרד יש {{c1::63}} כרומוזומים.", "e": "לסוס 64 כרומוזומים ולחמור 62. מכל הורה הפרד מקבל חצי: 32 מהסוסה ועוד 31 מהחמור. מספר אי-זוגי הוא סימן לכך שלא כל הכרומוזומים יכולים להסתדר בזוגות.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c128", "k": "cz", "x": "עקרות הפרד היא דוגמה למחסום {{c1::פוסט-זיגוטי}}.", "e": "מחסום פוסט-זיגוטי = מחסום שפועל אחרי ההפריה. הפרד נולד וגדל, אבל הכרומוזומים שלו אינם הומולוגיים (לא זוגות תואמים), ולכן המיוזה משתבשת ואין לו תאי מין תקינים.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c129", "k": "cz", "x": "יכולת להעמיד צאצא (אפילו עקר) מעידה ששני המינים שייכים לאותו {{c1::סוג (Genus)}}.", "e": "סוג (Genus) = הדרגה הטקסונומית שמעל מין, שמאגדת מינים עם אב קדמון משותף קרוב. סוס וחמור מהסוג Equus, ואריה ונמר מהסוג Panthera (יוצרים \"לייגר\").", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c132", "k": "cz", "x": "בעץ פילוגנטי, בסיס העץ מייצג {{c1::אב קדמון משותף}}.", "e": "עץ פילוגנטי = תרשים מסתעף של קרבה אבולוציונית. הבסיס הוא האב הקדמון, כל צומת הוא נקודת התפצלות, והקצוות הם המינים של היום.", "t": "הרצאה_3_מינים_והתמיינות", "img": "darwin-tree"}, {"id": "c134", "k": "cz", "x": "ככל שה-MRCA של שני מינים קרוב יותר להווה, המינים {{c1::קרובים יותר}} אבולוציונית.", "e": "MRCA = האב הקדמון המשותף המאוחר ביותר. אם הצומת המשותף לשני מינים קרוב לקצות העץ, הם התפצלו לאחרונה ולכן קרובים.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c137", "k": "cz", "x": "כיום עצים פילוגנטיים נבנים בעיקר על סמך נתונים {{c1::מולקולריים}} (רצפי DNA, RNA או חלבון).", "e": "פעם הסתמכו על נתונים מורפולוגיים (שלד, אנטומיה, מאובנים). היום משווים רצפים: ככל שאחוז הזהות ברצפים גבוה יותר, המינים קרובים יותר.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c139", "k": "cz", "x": "השערת {{c1::המרק הקדמון}}: חיים נוצרו במים רדודים, בעזרת אנרגיה מברקים וקרינת UV.", "e": "אביוגנזה = היווצרות חיים מחומר דומם, לפני כ-4 מיליארד שנה. לפי השערה זו, הברקים והקרינה יצרו מולקולות אורגניות פשוטות (כמו סוכרים) ששימשו מקור אנרגיה.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c140", "k": "cz", "x": "השערת {{c1::הנביעות ההידרותרמיות}}: החיים התפתחו במעמקי האוקיינוס.", "e": "סביב הנביעות יצורים קדומים פיתחו כמוסינתזה: הפקת אנרגיה מתגובות כימיות עם חומרים אנאורגניים (כמו תרכובות גופרית), במקום מאור השמש.", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "vents"}, {"id": "c143", "k": "cz", "x": "{{c1::השערת עולם ה-RNA}}: מולקולות RNA שיכלו לשכפל את עצמן היו שלב מוקדם בהתפתחות החיים.", "e": "RNA יכול גם לשאת מידע תורשתי וגם לזרז תגובות, ולכן ייתכן שהוא קדם ל-DNA ולחלבונים. אחריו נוצרו ממברנות שומניות, ואיתן התאים הראשונים.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c145", "k": "cz", "x": "שלוש העל-ממלכות (Domains): {{c1::חיידקים}}, {{c2::ארכאונים}} ו{{c3::אאוקריוטים}}.", "e": "על-ממלכה (Domain) = הענף הרחב ביותר בעץ החיים. חיידקים וארכאונים הם פרוקריוטים (בלי גרעין), ואאוקריוטים הם בעלי גרעין (צמחים, פטריות, בעלי חיים ועוד).", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "tree-of-life"}, {"id": "c146", "k": "cz", "x": "חיידקים וארכאונים הם {{c1::פרוקריוטים}} (חסרי גרעין תא).", "e": "פרוקריוט = יצור בלי גרעין תא מוגדר. ארכאונים נבדלים מחיידקים במבנה התא ובביוכימיה, ורבים מהם חיים בסביבות קיצוניות.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c149", "k": "cz", "x": "אאוקריוטים = יצורים בעלי {{c1::גרעין תא מוגדר}}.", "e": "גרעין תא = אברון שעטוף בממברנה ומכיל את ה-DNA. לאאוקריוטים שייכים גם חד-תאיים (אמבה, שמרים) וגם פטריות, צמחים ובעלי חיים.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c150", "k": "cz", "x": "האאוקריוטים התפתחו מאירוע {{c1::אנדוסימביוזה}}.", "e": "אנדוסימביוזה = יצור אחד חי בתוך יצור אחר, לטובת שניהם. חיידק קדום נבלע בתוך ארכאון ולא עוכל, אלא הפך לאברון המיטוכונדריה.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c151", "k": "cz", "x": "באנדוסימביוזה, {{c1::חיידק}} קדום נבלע על ידי {{c2::ארכאון}} קדום.", "e": "החיידק הבלוע הפך למיטוכונדריה, האברון שמפיק אנרגיה בתא האאוקריוטי.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c152", "k": "cz", "x": "אירוע החמצון הגדול התרחש לפני כ-{{c1::2.4 מיליארד}} שנה.", "e": "ציאנובקטריה פוטוסינתטיים שחררו כמויות אדירות של חמצן לאטמוספירה.", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "oxygen"}, {"id": "c153", "k": "cz", "x": "החמצן היה רעיל ליצורים {{c1::אנאירוביים}} וגרם להכחדה ההמונית הראשונה.", "e": "אנאירובי = חי בלי חמצן. רוב היצורים אז היו אנאירוביים, ולכן החמצן גרם להכחדה ההמונית הראשונה, \"גיזום\" ענק של עץ החיים.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c154", "k": "cz", "x": "אירוע החמצון הגדול אפשר את התפתחות {{c1::הנשימה האירובית}}.", "e": "נשימה אירובית = הפקת אנרגיה בעזרת חמצן. היא יעילה הרבה יותר מהפקת אנרגיה בלי חמצן, ואיפשרה התפתחות של יצורים מורכבים.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c155", "k": "cz", "x": "הפיצוץ הקמבריוני התרחש לפני כ-{{c1::541}} מיליון שנה.", "e": "\"פיצוץ\" כי בזמן קצר יחסית במונחים גיאולוגיים הופיעו כמעט כל המערכות של בעלי החיים. הסיבות המשוערות: עלייה ברמות החמצן, שינויים אקולוגיים והתפתחות יחסי טורף-נטרף.", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "oxygen"}, {"id": "c156", "k": "cz", "x": "בפיצוץ הקמבריוני הופיעו כמעט כל ה{{c1::מערכות (Phyla)}} של בעלי החיים.", "e": "מערכה (Phylum) = דרגה טקסונומית רחבה מאוד, שמאגדת קבוצות עם תוכנית גוף בסיסית משותפת (למשל פרוקי רגליים או רכיכות).", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c159", "k": "cz", "x": "אחרי הכחדה המונית, {{c1::גומחות אקולוגיות שהתפנו}} מאפשרות לשורדים להתגוון במהירות.", "e": "גומחה אקולוגית = \"התפקיד\" של מין בסביבה: מה הוא אוכל, איפה הוא חי וכו'. אחרי הכחדה (כמו זו של הדינוזאורים לפני 66 מיליון שנה) נוצרים \"מקומות פנויים\", והשורדים מתפצלים כדי למלא אותם.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c160", "k": "cz", "x": "שונות פנוטיפית = {{c1::שונות גנטית}} + {{c2::שונות סביבתית}}.", "e": "דוגמה: עץ אלון אחד גדול מאחר בגלל אללים טובים יותר לקצב גידול (שונות גנטית) ובגלל אדמה עמוקה יותר ופחות שכנים (שונות סביבתית). רק החלק הגנטי עובר לצאצאים.", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "oaks"}, {"id": "c161", "k": "cz", "x": "תכונות נרכשות (כמו שרירים מאימון) בדרך כלל {{c1::אינן עוברות}} בתורשה.", "e": "ספורטאי שבונה שרירים לא מוריש אותם לילדיו. רק תכונות שיש להן בסיס גנטי עוברות. זו הסיבה שהרעיון של למארק (תורשת תכונות נרכשות) נפסל.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c162", "k": "cz", "x": "ככל שהתורשתיות גבוהה יותר, האוכלוסייה {{c1::רגישה יותר}} לכוחות אבולוציוניים.", "e": "תורשתיות = החלק מהשונות הפנוטיפית שנובע מהבדלים גנטיים. אם רוב השונות גנטית, הברירה \"רואה\" אותה ומשנה את הדור הבא. אם רובה סביבתית, לברירה כמעט אין על מה לפעול.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c163", "k": "cz", "x": "עש הפלפל: במהפכה התעשייתית הפיח {{c1::הכהה את העצים}}, והעשים הבהירים נטרפו בקלות.", "e": "דוגמה קלאסית לברירה כיוונית: על עצים כהים העשים הכהים הוסוו טוב יותר, ולכן שרדו והתרבו. שיעור העשים הכהים עלה מכ-2% לכ-95%.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c169", "k": "cz", "x": "עיקרון הברירה הטבעית שלפיו לפרטים באוכלוסייה יש פנוטיפים שונים: {{c1::שונות}}.", "e": "ארבעת העקרונות של הברירה הטבעית: 1. שונות, 2. תורשתיות, 3. מאבק הישרדות, 4. הישרדות והתרבות דיפרנציאליות.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c170", "k": "cz", "x": "עיקרון הברירה הטבעית שלפיו חלק מההבדלים עוברים לצאצאים: {{c1::תורשתיות}}.", "e": "ארבעת העקרונות של הברירה הטבעית: 1. שונות, 2. תורשתיות, 3. מאבק הישרדות, 4. הישרדות והתרבות דיפרנציאליות.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c171", "k": "cz", "x": "עיקרון הברירה הטבעית שלפיו נולדים יותר צאצאים ממה שהמשאבים מאפשרים: {{c1::מאבק הישרדות}}.", "e": "ארבעת העקרונות של הברירה הטבעית: 1. שונות, 2. תורשתיות, 3. מאבק הישרדות, 4. הישרדות והתרבות דיפרנציאליות. את הרעיון של מאבק הישרדות דרווין שאב מתומאס מלתוס.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c173", "k": "cz", "x": "עיקרון הברירה הטבעית שלפיו תכונות תורשתיות גורמות להבדלים בהישרדות וברבייה: {{c1::הישרדות והתרבות דיפרנציאליות}}.", "e": "\"דיפרנציאלי\" = שונה בין פרטים. פרטים עם תכונות מסוימות שורדים ומתרבים יותר מאחרים. ארבעת העקרונות: 1. שונות, 2. תורשתיות, 3. מאבק הישרדות, 4. הישרדות והתרבות דיפרנציאליות.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c174", "k": "cz", "x": "ברמה הגנטית, תוצאת הברירה הטבעית היא שינוי ב{{c1::תדירות האללים}} באוכלוסייה.", "e": "המסר המרכזי: פרטים לא מתפתחים. מה שמשתנה הוא השכיחות של כל אלל באוכלוסייה, מדור לדור.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c177", "k": "cz", "x": "דוגמה לברירה מייצבת: {{c1::משקל לידה של תינוקות}}.", "e": "ברירה מייצבת = הקצוות נבררים לרעה, והממוצע מועדף. תינוקות קלים מדי או כבדים מדי שורדים פחות. להשוואה: בברירה כיוונית קצה אחד מועדף, ובברירה מפצלת שני הקצוות מועדפים על פני הממוצע.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c179", "k": "cz", "x": "שתי האסטרטגיות של ברירה מינית: {{c1::משיכת בני המין השני}} ו{{c2::תחרות עם בני אותו מין}}.", "e": "ברירה מינית = ברירה על תכונות שמשפרות את ההצלחה בהשגת בן זוג, גם אם הן לא עוזרות להישרדות. דוגמה למשיכה: זנב הטווס. דוגמה לתחרות: מאבקים בין זכרים, שמעדיפים פרטים גדולים וחזקים.", "t": "הרצאה_4_עץ_החיים_ושונות"}]</script>

const IMG={finches:"ארבעה מיני חוחיות מגלפאגוס: צורת מקור שונה למזון שונה",fossils:"(א) גולגולות הומינידים, מהישנה לחדשה. (ב) מינים נכחדים מהסוג Equus",embryos:"עוברים של דג, סלמנדרה, צב, תרנגול, ארנב ואדם בשלבי התפתחות שונים",limbs:"אותן עצמות בגפה של אדם, כלב, ציפור ולווייתן: מבנים הומולוגיים",arctic:"שועל ארקטי ורוטגן: לבנים בחורף בלי מוצא משותף קרוב",gondwana:"מאובנים זהים ביבשות הדרומיות, שהיו מחוברות בגונדוואנה",dogs:"פודל, קוקר ספנייל והצאצא שלהם, קוקאפו",owls:"תפוצת הינשוף המנוקד הצפוני והינשוף המקסיקני",honeycreepers:"יונקי הדבש של הוואי: מין מייסד אחד והמינים שהתפתחו ממנו",autopoly:"אוטופוליפלואידיה: הורה דיפלואידי (2n) וצאצא פוליפלואידי (4n)",allopoly:"אלופוליפלואידיה: שתי הזדווגויות בין שני מינים יוצרות צאצא בר-קיימא",frogs:"שני מיני צפרדעים שמתרבים בעונות שונות",crickets:"G. pennsylvanicus מעדיף קרקע חולית, ו-G. firmus קרקע חרסית",damselfly:"צורות שונות של איבר הרבייה בזכרי שפיריות ממינים שונים",pollinators:"(א) דבורה בפרח אצבעונית. (ב) יונק דבש בפרח חצוצרה",cichlids:"ציקלידים עם שפתיים דקות ועם שפתיים עבות, אגם אפויאק","darwin-tree":"(א) האיור היחיד ב\"על מוצא המינים\". (ב) התפתחות הפילים מהפליאומסטודון","tree-of-life":"עץ החיים: חיידקים, ארכאונים ואאוקריוטים",vents:"נביעה הידרותרמית במעמקי האוקיינוס",oxygen:"רמת החמצן באטמוספירה לאורך 4 מיליארד שנה",oaks:"שני עצי אלון: ההבדל ביניהם נובע מגנים ומסביבה",kittens:"שונות בצבע הפרווה בהמלטה אחת"};

function pad(n){return String(n).padStart(2,'0')}

function daysToExam(){const e=P.settings.examDate;if(!e)return null;const [y,m,d]=e.split('-').map(Number);const ex=new Date(y,m-1,d);const t=new Date(Date.now()-ROLL*HOUR);t.setHours(0,0,0,0);return Math.round((ex-t)/DAY)}

// ---------- deck model ----------
function rebuild(){
  LECS=[...CUR_LECTURES,...(D.lectures||[]).map(l=>[l.key,l.name])];
  if(!LECS.length)LECS=[['general','כללי']];
  const notes=[];
  for(const b of BASE){const e=D.edits[b.id];if(e&&e.del)continue;notes.push(Object.assign({},b,e||{}))}

      const ns=[...new Set([...(n.x||'').matchAll(/\{\{c(\d+)::/g)].map(m=>+m[1]))].sort((a,b)=>a-b);

async function api(body,url){
  const r=await fetch(url||SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});
  if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();if(j&&j.error)throw new Error(j.error);return j;
}
async function flush(which){
  if(!SYNC_URL)return;
  if(busy[which]){again[which]=true;return}
  busy[which]=true;pend[which]=false;clearTimeout(timers[which]);
  const data=JSON.parse(JSON.stringify(which==='progress'?P:D));
  const crs=COURSE;const body={action:'put',which:which+sfx(),data};if(which==='progress')body.summary=remindSummary();
  try{
    const j=await api(body);
    if(j.stale&&j.data&&crs===COURSE){ // another device saved something newer
      if(which==='progress'){P=normP(j.data);lsSave(LS_P,P)}else{D=normD(j.data);lsSave(LS_D,D)}
      rebuild();if(view!=='study')render();
    }
    syncState='synced';
  }catch(e){syncState='error';pend[which]=true}
  busy[which]=false;updateSync();
  if(again[which]){again[which]=false;flush(which)}
}
function flushPending(){for(const w of ['progress','deck'])if(pend[w])flush(w)}
async function pull(){
  if(!SYNC_URL){syncState='local';updateSync();return}
  syncState='loading';updateSync();
  try{
    const crs=COURSE;const j=await api({action:'get',course:COURSE});if(crs!==COURSE)return;let changed=false;
    if(j.progress){const r=normP(j.progress);if(r.updatedAt>P.updatedAt){P=r;lsSave(LS_P,P);changed=true}else if(r.updatedAt<P.updatedAt)flush('progress')}else if(P.updatedAt)flush('progress');

    syncState='synced';if(changed){rebuild();if(view!=='study')render()}

}

// ---------- answer check (on the device, no AI) ----------
const STOP=new Set(['של','את','על','עם','או','גם','לא','כי','זה','זו','זהו','זוהי','שלו','שלה','שלהם','כל','בין','אך','אבל','הם','הן','הוא','היא','אשר','רק','עוד','כמו','מתוך','אל','לפי','יש','אין','אחד','אחת','ו','ה','ב','ל','מ','ש']);
function words(s){return norm(s).split(' ').filter(w=>w.length>=2&&!STOP.has(w))}
function stripPre(w){return w.length>=4?w.replace(/^[והבלמשכ]{1,2}/,''):w}
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 2;const m=a.length,n=b.length;let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
function wordMatch(a,b){if(a===b)return true;const a2=stripPre(a),b2=stripPre(b);if(a2===b||a===b2||a2===b2)return true;
  const L=Math.min(a.length,b.length);return L>=4&&(lev(a,b)<=1||lev(a2,b2)<=1)}
function overlap(typedW,ans){const k=words(ans);if(!k.length)return 0;let hit=0;for(const w of k)if(typedW.some(t=>wordMatch(t,w)))hit++;return hit/k.length}
function localCheck(c){
  const q=cardQA(c);const mine=typed.trim();if(!mine||!q.answer){check=null;return}
  const ans=String(q.answer);const tw=words(mine);
  const alts=[ans,ans.replace(/\(.*?\)/g,' '),...(ans.match(/\((.*?)\)/g)||[]).map(s=>s.slice(1,-1)),...ans.split(/\s*\/\s*|\.\s+/)].filter(s=>s&&s.trim());
  if(alts.some(a=>norm(a)===norm(mine))){check={state:'ok',text:'נכון'};return}
  const sc=Math.max(...alts.map(a=>overlap(tw,a)));
  check=sc>=0.75?{state:'ok',text:'נכון'}:sc>=0.4?{state:'part',text:'חלקית. השווה לתשובה המלאה'}:{state:'no',text:'לא תואם לתשובה. שווה לבדוק אם התכוונת לאותו דבר'};
}

function importText(raw){
  let o;try{o=JSON.parse(String(raw).trim().replace(/^```(?:json)?|```$/g,''))}catch(e){return {ok:false,msg:'הטקסט לא נקרא. ודא שהעתקת את כולו.'}}
  if(o&&o.type==='evo-backup'&&o.progress){
    P=normP(o.progress);D=normD(o.deck||{});const now=Date.now();P.updatedAt=now;D.updatedAt=now;
    lsSave(LS_P,P);lsSave(LS_D,D);rebuild();persist('progress');persist('deck');
    return {ok:true,msg:'ההתקדמות יובאה: '+Object.keys(P.cards).length+' כרטיסים שכבר למדת.'};
  }
  if(o&&o.type==='evo-cards'&&Array.isArray(o.cards)){
    let key=o.lecture&&o.lecture.key;
    if(o.lecture&&o.lecture.name){
      const ex=LECS.find(l=>l[1]===o.lecture.name||l[0]===key);
      if(ex)key=ex[0];else{key=key||('L'+Date.now().toString(36));D.lectures.push({key,name:o.lecture.name})}
    }
    if(!key)key=LECS[LECS.length-1][0];
    if(key==='general'&&!D.lectures.some(l=>l.key==='general'))D.lectures.push({key:'general',name:'כללי'});
    const have=new Set([...BASE.map(b=>b.id),...D.added.map(a=>a.id)]);let n=0,i=0;
    for(const x of o.cards){i++;
      const id=x.id||('u'+Date.now().toString(36)+i);if(have.has(id))continue;
      if((x.type==='qa'||x.k==='qa')&&(x.front||x.f)&&(x.back||x.b)){D.added.push({id,k:'qa',f:x.front||x.f,b:x.back||x.b,e:x.extra||x.e||'',t:key,img:x.img});n++}
      else if((x.type==='cloze'||x.k==='cz')&&clozeOk(x.text||x.x||'')){D.added.push({id,k:'cz',x:x.text||x.x,e:x.extra||x.e||'',t:key,img:x.img});n++}
    }
    rebuild();persist('deck');lecFilter='all';
    return {ok:true,msg:n?n+' כרטיסים חדשים נוספו.':'כל הכרטיסים האלה כבר קיימים.'};
  }
  return {ok:false,msg:'זה לא נראה כמו גיבוי או חבילת כרטיסים.'};
}

const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function retr(t,S){return Math.pow(1+FACTOR*t/S,DECAY)}
function ivlFor(S){const r=P.settings.retention||0.9;return Math.max(1,Math.round(S/FACTOR*(Math.pow(r,1/DECAY)-1)))}
function d0(g){return clamp(W[4]-W[5]*(g-3),1,10)}
function nextD(Dv,g){const d=Dv-W[6]*(g-3);return clamp(W[7]*d0(4)+(1-W[7])*d,1,10)}
function sRecall(Dv,S,R,g){const hp=g===2?W[15]:1, eb=g===4?W[16]:1;return S*(Math.exp(W[8])*(11-Dv)*Math.pow(S,-W[9])*(Math.exp(W[10]*(1-R))-1)*hp*eb+1)}
function sForget(Dv,S,R){return Math.min(S,W[11]*Math.pow(Dv,-W[12])*(Math.pow(S+1,W[13])-1)*Math.exp(W[14]*(1-R)))}
function migrate(s,now){ // from the earlier SM-2 version
  if(s.S!=null)return s;
  if(s.q==='review'||s.q==='relearn'){s.S=Math.max(1,s.ivl||1);s.lr=s.q==='review'?(s.due-(s.ivl||1)*DAY):now}
  s.D=clamp(5+(2.5-(s.ease||2.5))*3.3,1,10);return s;
}
function capForExam(ivl){const dl=daysToExam();if(dl!=null&&dl>=2&&ivl>dl-1)return dl-1;return ivl}
function fuzz(ivl){if(ivl<3)return ivl;const f=Math.max(1,Math.round(ivl*0.05));return ivl-f+Math.floor(Math.random()*(2*f+1))}
function toReview(s,now,preview){let iv=ivlFor(s.S);if(!preview)iv=fuzz(iv);iv=capForExam(iv);s.q='review';s.ivl=iv;s.due=nextBoundary(now)+(iv-1)*DAY;return s}
function schedule(id,g,now,preview){
  let s=P.cards[id]?migrate(JSON.parse(JSON.stringify(P.cards[id])),now):{q:'new',step:0,reps:0,lapses:0};
  if(!preview)s.reps=(s.reps||0)+1;
  if(s.q==='new'||s.S==null){s.S=W[g-1];s.D=d0(g);if(s.q==='new'){s.q='learn';s.step=0}}
  if(s.q==='learn'||s.q==='relearn'){
    const re=s.q==='relearn';
    if(g===1){s.step=0;s.due=now+(re?LEARN_STEPS[1]:LEARN_STEPS[0])*MIN}
    else if(g===2){s.due=now+(re?LEARN_STEPS[1]:(s.step===0?(LEARN_STEPS[0]+LEARN_STEPS[1])/2:LEARN_STEPS[1]))*MIN}
    else if(g===3&&!re&&s.step+1<LEARN_STEPS.length){s.step++;s.due=now+LEARN_STEPS[s.step]*MIN}
    else{if(g===4)s.S=Math.max(s.S,W[3]*(re?0.5:1));toReview(s,now,preview)}
  }else{
    const t=Math.max(0,(now-(s.lr||now))/DAY);const R=retr(t,s.S);const Dold=s.D;
    s.D=nextD(Dold,g);
    if(g===1){s.S=sForget(Dold,s.S,R);if(!preview)s.lapses=(s.lapses||0)+1;s.q='relearn';s.step=0;s.due=now+LEARN_STEPS[1]*MIN}
    else{s.S=sRecall(Dold,s.S,R,g);toReview(s,now,preview)}
  }
  s.lr=now;return s;
}
function fmtIvl(ms){
  if(ms<HOUR)return Math.max(1,Math.round(ms/MIN))+' דק׳';
  if(ms<DAY)return Math.round(ms/HOUR)+' שע׳';
  const d=Math.round(ms/DAY);
  if(d<31)return d===1?'יום':d+' ימים';
  if(d<365)return (d/30).toFixed(1).replace('.0','')+' חוד׳';
  return (d/365).toFixed(1).replace('.0','')+' שנים';
}
function previewLabel(id,g){const now=Date.now();const s=schedule(id,g,now,true);return s.q==='review'?fmtIvl(s.ivl*DAY):fmtIvl(s.due-now)}
function st(id){return P.cards[id]||null}
function isNew(id){return !P.cards[id]}

// ---------- queues ----------
function inFilter(c){return lecFilter==='all'||c.t===lecFilter}
function newRemaining(){return CARDS.filter(c=>isNew(c.id)).length}
function pacedNewPerDay(){
  const base=P.settings.newPerDay;const dl=daysToExam();
  if(dl==null||dl<1||!P.settings.autoPace)return base;
  const need=Math.ceil(newRemaining()/Math.max(1,dl-2));return Math.max(base,Math.min(need,200));
}
function counts(){
  const now=Date.now(),end=nextBoundary(now);let n=0,l=0,r=0;
  for(const c of CARDS){if(!inFilter(c))continue;const s=st(c.id);
    if(!s)n++;else if(s.q==='learn'||s.q==='relearn'){if(s.due<end)l++}else if(s.due<end)r++}
  const left=Math.max(0,pacedNewPerDay()-(P.log[today()]?.n||0));
  return {newAvail:Math.min(n,left),newTotal:n,learn:l,review:r};
}
function startSession(){
  undoStack=[];
  const c=counts();
  const byL={};for(const x of CARDS)if(inFilter(x)&&isNew(x.id))(byL[x.t]=byL[x.t]||[]).push(x.id);
  // keep sibling cards of the same note apart: all first blanks, then all second blanks, and so on
  for(const k in byL){const l=byL[k];const pos=new Map(l.map((id,i)=>[id,i]));const rk=id=>Math.max(0,(BYID[id].n||1)-1);l.sort((a,b)=>(rk(a)-rk(b))||(pos.get(a)-pos.get(b)))}
  // reverse cards wait until the forward card is known
  const rr=[];const lists=LECS.map(l=>byL[l[0]]||[]);let k=0;const total=lists.reduce((a,b)=>a+b.length,0);
  while(rr.length<total){for(const a of lists)if(a[k])rr.push(a[k]);k++}
  const ordered=rr.filter(id=>BYID[id].k!=='rev'||!isNew(BYID[id].nid));
  session={mode:'srs',newQueue:ordered.slice(0,c.newAvail),done:0,again:0,cur:null};
  view='study';nextCard();
}
function startCram(scope){
  undoStack=[];
  let ids=scope==='weak'?weakCards().map(c=>c.id):CARDS.filter(c=>inFilter(c)&&!isNew(c.id)).map(c=>c.id);
  ids=shuffle(ids);
  session={mode:'cram',queue:ids,done:0,again:0,total:ids.length,cur:null};view='study';nextCard();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function resetCardUI(){revealed=false;typed='';check=null;editing=null;conf=null}
function nextCard(){
  resetCardUI();
  if(session.mode==='cram'){session.cur=session.queue[0]||null;render();return}
  const now=Date.now(),end=nextBoundary(now);
  const learnDue=[],rev=[];let ahead=null;
  for(const c of CARDS){if(!inFilter(c))continue;const s=st(c.id);if(!s)continue;
    if(s.q==='learn'||s.q==='relearn'){if(s.due<=now)learnDue.push(c.id);else if(s.due<end&&(!ahead||s.due<st(ahead).due))ahead=c.id}
    else if(s.due<end)rev.push(c.id)}
  learnDue.sort((a,b)=>st(a).due-st(b).due);rev.sort((a,b)=>st(a).due-st(b).due);
  session.newQueue=session.newQueue.filter(id=>BYID[id]&&isNew(id));
  let pick=null;
  if(learnDue.length)pick=learnDue[0];
  else{const useNew=session.newQueue.length&&(!rev.length||session.done%4===3);
    if(useNew)pick=session.newQueue[0];else if(rev.length)pick=rev[0];else if(session.newQueue.length)pick=session.newQueue[0];
    else if(ahead&&st(ahead).due-now<=20*MIN)pick=ahead}
  session.cur=pick;session.waitUntil=(!pick&&ahead)?st(ahead).due:null;render();
}
function answer(g){
  const id=session.cur;if(!id||!revealed)return;const now=Date.now();
  if(session.mode==='cram'){session.queue.shift();session.done++;if(g===1){session.again++;session.queue.splice(Math.min(3,session.queue.length),0,id)}nextCard();return}
  const prev=P.cards[id]?JSON.parse(JSON.stringify(P.cards[id])):null;
  const lg=logToday();const prevLog=Object.assign({},lg);
  const wasNew=!prev, wasReview=prev&&prev.q==='review';
  P.cards[id]=schedule(id,g,now,false);
  // metacognition: how well did the prediction before the reveal match the result?
  if(conf){P.cards[id].cf=conf;lg['c_'+conf]=(lg['c_'+conf]||0)+1;if(g>1)lg['k_'+conf]=(lg['k_'+conf]||0)+1;if(conf==='sure'&&g===1)P.cards[id].ill=(P.cards[id].ill||0)+1}
  lg.t++;if(wasNew)lg.n++;if(wasReview){lg.r++;if(g>1)lg.ok++}
  if(wasNew)session.newQueue=session.newQueue.filter(x=>x!==id);
  undoStack.push({id,prev,prevLog,day:today(),wasNew});if(undoStack.length>20)undoStack.shift();
  session.done++;if(g===1)session.again++;
  persist('progress');nextCard();
}
function undo(){
  const u=undoStack.pop();if(!u)return;
  if(u.prev)P.cards[u.id]=u.prev;else delete P.cards[u.id];
  P.log[u.day]=u.prevLog;if(u.wasNew)session.newQueue.unshift(u.id);
  session.done=Math.max(0,session.done-1);persist('progress');resetCardUI();session.cur=u.id;render();toast('התשובה האחרונה בוטלה');
}

// ---------- stats ----------
function weakCards(){return CARDS.filter(c=>{const s=st(c.id);return s&&((s.lapses||0)>=2||(s.ill||0)>=1||(s.D!=null&&s.D>=8.5))}).sort((a,b)=>((st(b.id).lapses||0)+(st(b.id).ill||0))-((st(a.id).lapses||0)+(st(a.id).ill||0)))}
function calib(){const cut=dayKey(Date.now()-30*DAY);const o={sure:[0,0],unsure:[0,0],none:[0,0]};for(const [k,v] of Object.entries(P.log))if(k>=cut)for(const c in o){o[c][0]+=v['c_'+c]||0;o[c][1]+=v['k_'+c]||0}return o}
function advance(ids){let n=0;const now=Date.now();for(const id of new Set(ids)){const s=P.cards[id];if(s&&s.q==='review'&&s.due>now){s.due=now;n++}}if(n)persist('progress');return n}
function streak(){let n=0;const t=new Date(Date.now()-ROLL*HOUR);if(!(P.log[dayKeyOf(t)]?.t))t.setDate(t.getDate()-1);
  for(;;){if(P.log[dayKeyOf(t)]?.t){n++;t.setDate(t.getDate()-1)}else break}return n}
function retention(){let r=0,ok=0;const cut=dayKey(Date.now()-30*DAY);for(const [k,v] of Object.entries(P.log))if(k>=cut){r+=v.r||0;ok+=v.ok||0}return r?Math.round(100*ok/r):null}
function lecStats(L){let n=0,l=0,y=0,m=0;for(const c of CARDS){if(c.t!==L)continue;const s=st(c.id);if(!s)n++;else if(s.q!=='review')l++;else if(s.ivl>=21)m++;else y++}return {n,l,y,m,tot:n+l+y+m}}
function forecast(){const b=nextBoundary(Date.now());const out=Array(7).fill(0);
  for(const c of CARDS){const s=st(c.id);if(!s||s.q!=='review')continue;const i=s.due<b?0:Math.floor((s.due-b)/DAY)+1;if(i<7)out[i]++}return out}

// ---------- text helpers ----------
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const CZ=/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g;
function plain(x){return String(x||'').replace(CZ,'$2')}
function clozeFront(x,n){return esc(x).replace(CZ,(m,k,a,h)=>+k===n?'<span class="blank">'+(h?esc(h):'[ … ]')+'</span>':a)}
function clozeBack(x,n){return esc(x).replace(CZ,(m,k,a)=>+k===n?'<span class="ans">'+a+'</span>':a)}
function clozeAnswer(x,n){const a=[];String(x).replace(CZ,(m,k,v)=>{if(+k===n)a.push(v)});return a.join(' / ')}
function clozeOk(t){return /\{\{c\d+::.+?\}\}/.test(t)&&(t.match(/\{\{/g)||[]).length===(t.match(/\}\}/g)||[]).length}
function norm(s){return String(s).replace(/[֑-ׇ]/g,'').replace(/["'׳״().,;:!?\-–—]/g,' ').replace(/\s+/g,' ').trim().toLowerCase()}
function cardQA(c){ // {promptHtml, backHtml, answer, extra, note}
  const n=NBYID[c.nid];
  if(c.k==='qa')return {ask:'שאלה',front:esc(n.f),back:esc(n.f),answer:n.b,extra:n.e||'',n};
  if(c.k==='rev')return {ask:'איזה מושג מתאים להגדרה?',front:esc(n.b),back:esc(n.b),answer:termOf(n),extra:n.e||'',n};
  return {ask:'השלם את החסר',front:clozeFront(n.x,c.n),back:clozeBack(n.x,c.n),answer:clozeAnswer(n.x,c.n),extra:n.e||'',n};
}
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(k==='on')for(const [ev,fn] of Object.entries(v))e.addEventListener(ev,fn);else if(k==='html')e.innerHTML=v;else if(k==='value')e.value=v;else if(k==='checked')e.checked=!!v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e}
function toast(m){const t=h('div',{class:'toast',role:'status'},m);document.body.append(t);setTimeout(()=>t.remove(),2800)}
// ---------- editing ----------
function saveNote(id,fields){
  const base=BASE.find(b=>b.id===id);
  if(base){D.edits[id]=Object.assign({},D.edits[id]||{},fields)}
  else{const a=D.added.find(x=>x.id===id);if(a)Object.assign(a,fields)}
  persist('deck');rebuild();
}
function deleteNote(id){
  if(BASE.some(b=>b.id===id))D.edits[id]={del:true};else D.added=D.added.filter(x=>x.id!==id);
  persist('deck');rebuild();
}
function addNote(n){n.id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);D.added.push(n);persist('deck');rebuild();return n.id}
function editorEl(note,onDone){
  const f={k:note.k,f:note.f||'',b:note.b||'',x:note.x||'',e:note.e||'',t:note.t};
  const isNewNote=!note.id;
  const box=h('div',{class:'editor'});
  const lecSel=h('select',{id:'ed-lec','aria-label':'הרצאה',on:{change:e=>f.t=e.target.value}},...LECS.map(([k],i)=>h('option',{value:k,selected:k===f.t},lecName(k))));
  let typeSel=null;
  if(isNewNote)typeSel=h('select',{id:'ed-type','aria-label':'סוג',on:{change:e=>{f.k=e.target.value;draw()}}},h('option',{value:'qa',selected:f.k==='qa'},'שאלה ותשובה'),h('option',{value:'cz',selected:f.k==='cz'},'השלמת חסר'));
  const fields=h('div',{class:'stack',style:'gap:8px'});
  function ta(label,key,id,onIn){const t=h('textarea',{id,dir:'auto',rows:'1',value:f[key],on:{input:e=>{f[key]=e.target.value;onIn&&onIn()}}});return [h('label',{for:id},label,t),t]}
  function draw(){
    fields.innerHTML='';
    if(f.k==='qa'){fields.append(ta('שאלה','f','ed-f')[0],ta('תשובה','b','ed-b')[0],ta('הסבר (מופיע בגב הכרטיס)','e','ed-e')[0])}
    else{
      const pv=h('div',{class:'preview'}),warn=h('div',{class:'warn'});
      const upd=()=>{pv.innerHTML=esc(f.x).replace(CZ,(m,k,a)=>'<span class="ans">'+a+'<sup>'+k+'</sup></span>');warn.textContent=clozeOk(f.x)?'':'סמן לפחות ביטוי אחד להסתרה'};
      const [lab,t]=ta('טקסט','x','ed-x',upd);
      const wrapSel=sep=>{const a=t.selectionStart,b=t.selectionEnd;if(a===b){toast('סמן קודם את המילים שיוסתרו');t.focus();return}
        const nums=[...f.x.matchAll(/\{\{c(\d+)::/g)].map(m=>+m[1]);const max=nums.length?Math.max(...nums):0;const k=sep?max+1:(max||1);
        f.x=f.x.slice(0,a)+'{{c'+k+'::'+f.x.slice(a,b)+'}}'+f.x.slice(b);t.value=f.x;upd();t.focus()};
      fields.append(lab,h('div',{class:'row'},h('button',{type:'button',on:{click:()=>wrapSel(false)}},'הסתר את הטקסט המסומן'),h('button',{type:'button',on:{click:()=>wrapSel(true)}},'הסתר בכרטיס נפרד')),pv,warn,ta('הסבר (מופיע בגב הכרטיס)','e','ed-e')[0]);upd();
    }
  }
  draw();
  const del=isNewNote?null:h('button',{class:'danger',type:'button',on:{click:()=>{if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='בטוח? לחץ שוב';setTimeout(()=>{del.classList.remove('arm');del.textContent='מחק כרטיס'},3000);return}deleteNote(note.id);onDone('deleted')}}},'מחק כרטיס');
  box.append(h('div',{class:'row'},typeSel,lecSel),fields,h('div',{class:'row'},
    h('button',{class:'primary',type:'button',on:{click:()=>{
      if(f.k==='qa'&&(!f.f.trim()||!f.b.trim())){toast('צריך גם שאלה וגם תשובה');return}
      if(f.k==='cz'&&!clozeOk(f.x)){toast('סמן לפחות ביטוי אחד להסתרה');return}
      const data=f.k==='qa'?{k:'qa',f:f.f,b:f.b,e:f.e,t:f.t}:{k:'cz',x:f.x,e:f.e,t:f.t};
      if(isNewNote){addNote(data);onDone('added')}else{saveNote(note.id,data);onDone('saved')}}}},isNewNote?'הוסף':'שמור'),
    h('button',{type:'button',on:{click:()=>onDone('cancel')}},'ביטול'),h('span',{style:'flex:1'}),del));
  return box;
}

// ---------- quiz (multiple choice) ----------
function buildQuiz(count){
  const pool=[];
  const defs=NOTES.filter(n=>n.k==='qa'&&termOf(n));
  for(const n of defs){if(lecFilter!=='all'&&n.t!==lecFilter)continue;pool.push({kind:'def',n,answer:termOf(n),prompt:n.b,ask:'איזה מושג מתאים להגדרה?'})}
  for(const c of CARDS){if(c.k!=='cz'||!inFilter(c))continue;const n=NBYID[c.nid];const a=clozeAnswer(n.x,c.n);if(a.length>40)continue;pool.push({kind:'cz',n,c,answer:a,promptHtml:clozeFront(n.x,c.n),ask:'השלם את החסר'})}
  const qs=shuffle(pool).slice(0,count||10).map(item=>{
    const same=item.kind==='def'?defs.map(d=>termOf(d)):CARDS.filter(x=>x.k==='cz').map(x=>clozeAnswer(NBYID[x.nid].x,x.n)).filter(a=>a.length<=40);
    const lecOf=item.kind==='def'?defs.filter(d=>d.t===item.n.t).map(d=>termOf(d)):CARDS.filter(x=>x.k==='cz'&&x.t===item.n.t).map(x=>clozeAnswer(NBYID[x.nid].x,x.n));
    const ok=a=>norm(a)!==norm(item.answer)&&!norm(item.answer).includes(norm(a))&&!norm(a).includes(norm(item.answer));
    const byLen=arr=>[...new Set(arr)].filter(ok).sort((a,b)=>Math.abs(a.length-item.answer.length)-Math.abs(b.length-item.answer.length));
    let distract=shuffle(byLen(lecOf).slice(0,6)).slice(0,3);
    if(distract.length<3)distract=distract.concat(byLen(same).filter(a=>!distract.includes(a)).slice(0,3-distract.length));
    return Object.assign(item,{opts:shuffle([item.answer,...distract]),picked:null});
  });
  return {qs,i:0,score:0};
}

  const y=window.scrollY;app.innerHTML='';
  app.append(h('div',{class:'top'},h('div',{},h('h1',{},courseObj().name),h('div',{class:'sub'},CARDS.length+' כרטיסים · חזרה מרווחת')),h('div',{class:'sync',id:'sync'})));

  }

}
function switchCourse(id){
  if(id===COURSE)return;
  lsSave(LS_P,P);lsSave(LS_D,D);flushPending();
  COURSE=id;try{localStorage.setItem(LS_COURSE,id)}catch(e){}
  applyCourse();P=blankProgress();D=blankDeck();
  lecFilter='all';session=null;quiz=null;editing=null;browseQ='';undoStack=[];if(view==='study')view='home';
  const lp=lsLoad(LS_P);if(lp)P=normP(lp);const ld=lsLoad(LS_D);if(ld)D=normD(ld);
  rebuild();render();window.scrollTo(0,0);pull();
}
function lecChips(){return h('div',{class:'chips'},[['all','כל ההרצאות'],...LECS.map(([k])=>[k,lecShort(k)])].map(([k,v])=>h('button',{class:'chip','aria-pressed':String(lecFilter===k),on:{click:()=>{lecFilter=k;if(view==='quiz'){quiz=null;exam=null;recall=null}render()}}},v)))}

function renderHome(){
  const c=counts();const total=c.newAvail+c.learn+c.review;

  const add=(term,ids,ctx)=>{term=String(term||'').trim();if(!term||term.length>30||words(term).length>4||!words(term).length)return;const k=norm(term);
    if(!map.has(k))map.set(k,{term,ids:[],ctx});map.get(k).ids.push(...ids)};
  for(const n of NOTES){if(L!=='all'&&n.t!==L)continue;const ids=CARDS.filter(c=>c.nid===n.id).map(c=>c.id);
    if(n.k==='qa'){add(termOf(n)||n.b,ids,n.f)}
    else{const ns=[...new Set([...(n.x||'').matchAll(/\{\{c(\d+)::/g)].map(m=>+m[1]))];for(const k of ns)add(clozeAnswer(n.x,k),ids.filter(id=>id===n.id+'-'+k),plain(n.x))}}
  return [...map.values()];
}
