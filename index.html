<script type="application/json" id="deck">[{"id": "q7", "k": "qa", "f": "איך קרא דרווין למנגנון שבו מינים משתנים?", "b": "ברירה טבעית", "t": "הרצאה_1_הבנת_האבולוציה", "e": "ברירה טבעית: בכל דור נולדים פרטים שונים זה מזה, ומי שהתכונות שלו מתאימות יותר לסביבה שורד ומעמיד יותר צאצאים. כך, לאורך דורות רבים, התכונות המועילות נעשות נפוצות יותר והמין משתנה."}, {"id": "q8", "k": "qa", "f": "למה \"הישרדות החזק\" הוא פירוש מוטעה ל-survival of the fittest?", "b": "fittest = המותאם ביותר לסביבה הנוכחית, ומה שקובע הוא כמה צאצאים הוא מעמיד, לא כמה הוא חזק", "t": "הרצאה_1_הבנת_האבולוציה", "e": "\"הישרדות המותאמים\" הוא כינוי נוסף לברירה טבעית. פרט קטן וחלש שמעמיד הרבה צאצאים מצליח יותר, מבחינה אבולוציונית, מפרט חזק שלא מתרבה."}, {"id": "q9", "k": "qa", "f": "מהי כשירות (fitness)?", "b": "מדד יחסי להצלחת גנוטיפ לשרוד ולהעמיד צאצאים פוריים, בהשוואה לגנוטיפים אחרים", "t": "הרצאה_1_הבנת_האבולוציה", "e": "כשירות נמדדת תמיד ביחס לאחרים באותה אוכלוסייה ובאותה סביבה. פרט שחי הרבה זמן אבל לא מתרבה, כשירותו אפס. מה שקובע הוא כמה עותקים של הגנים שלו מגיעים לדור הבא."}, {"id": "q69", "k": "qa", "f": "מהו אלל?", "b": "גרסה של גן: רצף מעט שונה של אותו גן", "t": "הרצאה_1_הבנת_האבולוציה", "e": "לגן אחד יכולות להיות כמה גרסאות. למשל, בגן לצבע עיניים יש אלל לעיניים כחולות ואלל לעיניים חומות. לכל פרט יש שני עותקים של כל גן, אחד מכל הורה, והם יכולים להיות אותו אלל או שני אללים שונים."}, {"id": "q10", "k": "qa", "f": "מהו המקור האולטימטיבי לאללים חדשים באוכלוסייה?", "b": "מוטציה", "t": "הרצאה_1_הבנת_האבולוציה", "e": "מוטציה = שינוי ברצף הדנ\"א. זו הדרך היחידה שבה נוצרת גרסה חדשה של גן. רבייה מינית רק מערבבת אללים שכבר קיימים לצירופים חדשים."}, {"id": "q11", "k": "qa", "f": "מהו פנוטיפ?", "b": "תכונה נראית או נמדדת", "t": "הרצאה_1_הבנת_האבולוציה", "e": "פנוטיפ = מה שרואים או מודדים: צבע, גובה, צורת מקור, ואפילו סוג דם. הוא נקבע מהגנים ביחד עם השפעת הסביבה. הברירה הטבעית \"רואה\" את הפנוטיפ, לא את הגנים ישירות."}, {"id": "q12", "k": "qa", "f": "מהו גנוטיפ?", "b": "ההרכב הגנטי של הפרט: אילו אללים יש לו, בגן מסוים או בכלל", "t": "הרצאה_1_הבנת_האבולוציה", "e": "שני פרטים יכולים להיראות דומים (אותו פנוטיפ) ועדיין להיות בעלי גנוטיפים שונים: למשל לאחד שני עותקים של אותו אלל, ולשני שני אללים שונים."}, {"id": "q13", "k": "qa", "f": "איך נקראת מוטציה שאינה משפיעה על הכשירות?", "b": "מוטציה ניטרלית", "t": "הרצאה_1_הבנת_האבולוציה", "e": "רוב המוטציות ניטרליות: הן לא משנות את החלבון, או שהשינוי לא משפיע על ההישרדות והרבייה. לכן הברירה הטבעית לא מעדיפה אותן וגם לא מסלקת אותן."}, {"id": "q14", "k": "qa", "f": "מהי אדפטציה (הסתגלות)?", "b": "תכונה תורשתית שמסייעת להישרדות ולרבייה של אורגניזם בסביבתו הנוכחית", "t": "הרצאה_1_הבנת_האבולוציה", "e": "אדפטציה היא תוצאה של ברירה טבעית. היא תמיד ביחס לסביבה מסוימת: פרווה עבה היא אדפטציה בקור, אבל עלולה להזיק באקלים חם."}, {"id": "q15", "k": "qa", "f": "מהי אבולוציה מתפצלת (divergent evolution)?", "b": "שני מינים שמתפתחים בכיוונים שונים מנקודה משותפת", "t": "הרצאה_1_הבנת_האבולוציה", "e": "אבולוציה מתפצלת: אב קדמון משותף אחד, ושתי אוכלוסיות שהתפתחו כל אחת בסביבה אחרת והתרחקו זו מזו. התוצאה: אותו מבנה בסיסי שמשמש לתפקידים שונים, כמו הגפה הקדמית של אדם ושל ציפור."}, {"id": "q16", "k": "qa", "f": "מהי אבולוציה מתכנסת (convergent evolution)?", "b": "תכונות דומות שמתפתחות באופן עצמאי במינים ללא מוצא משותף עדכני", "t": "הרצאה_1_הבנת_האבולוציה", "e": "אבולוציה מתכנסת: מינים לא קרובים שחיים בתנאים דומים מפתחים בנפרד פתרון דומה. התכונות שנוצרות דומות בתפקיד אבל לא במוצא, ולכן הן לא מעידות על קרבה."}, {"id": "q17", "k": "qa", "f": "למה הכנפיים של עטלף ושל חרק לא מעידות על קרבה ביניהם?", "b": "הן דומות בתפקיד (תעופה) אבל בנויות אחרת לגמרי, כלומר התפתחו בנפרד: אבולוציה מתכנסת", "t": "הרצאה_1_הבנת_האבולוציה", "e": "כנף העטלף בנויה מעצמות אצבעות עם קרום, וכנף החרק היא חלק מהשלד החיצוני. דמיון בתפקיד בלי דמיון במבנה הוא סימן להתפתחות עצמאית, לא למוצא משותף."}, {"id": "q18", "k": "qa", "f": "מהי אמבריולוגיה?", "b": "חקר התפתחות האנטומיה של אורגניזם מיצירתו ועד צורתו הבוגרת", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "אמבריולוגיה משווה את התפתחות העובר בין מינים. עוברים של חולייתנים שונים דומים מאוד בשלבים מוקדמים (חריצי זימים, זנב), וזו אחת הראיות למוצא משותף."}, {"id": "q19", "k": "qa", "f": "מהם מבנים הומולוגיים?", "b": "מבנים בעלי אותה פריסה בסיסית בזכות מוצא משותף", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "limbs", "e": "דוגמה: הגפה של אדם, כלב, ציפור ולווייתן בנויה מאותן עצמות באותו סדר, למרות שהיא משמשת להליכה, לתעופה או לשחייה. הדמיון במבנה מעיד על אב קדמון משותף."}, {"id": "q20", "k": "qa", "f": "מהם מבנים שרידיים (vestigial structures)?", "b": "מבנים ללא תפקוד נראה לעין, שרידים מאב קדמון", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "מבנה שרידי היה מתפקד אצל האב הקדמון ונשאר בצורה מצומצמת. דוגמאות: עצמות רגליים אחוריות בלווייתנים, עצם הזנב אצל האדם. הם עדות לכך שמינים השתנו לאורך זמן."}, {"id": "q21", "k": "qa", "f": "מהי התכנסות צורה (convergence of form)?", "b": "דמיון בצורה בין מינים לא קרובים שחולקים סביבה דומה", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "arctic", "e": "התכנסות צורה נובעת מלחצי ברירה דומים, לא מקרבה. דוגמה: השועל הארקטי (יונק) והרוטגן (ציפור) הופכים לבנים בחורף, כי בשניהם הלבן משמש הסוואה בשלג."}, {"id": "q22", "k": "qa", "f": "מהם מינים אנדמיים?", "b": "מינים שלא נמצאים בשום מקום אחר", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "מינים אנדמיים נפוצים במיוחד באיים, כי המים מונעים מהם לנדוד ומאחרים להגיע. כך האוכלוסייה מתפתחת בנפרד ונוצר מין ייחודי למקום, כמו רבים מהמינים בגלפאגוס."}, {"id": "q23", "k": "qa", "f": "מהי סחיפה (סחף גנטי)?", "b": "שינוי מקרי בתדירות האללים באוכלוסייה, לא בגלל שאלל מסוים מועיל", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "בסחף גנטי תדירות האללים משתנה במקרה: מי שמת או מתרבה לא נקבע לפי התכונות שלו. ההשפעה חזקה במיוחד באוכלוסיות קטנות, שבהן מוות מקרי של כמה פרטים יכול להעלים אלל לגמרי."}, {"id": "q24", "k": "qa", "f": "מה פירוש \"תיאוריה\" במדע?", "b": "גוף של הסברים בדוקים ומאומתים למערכת של תצפיות", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "תיאוריה מדעית היא הדרגה הגבוהה ביותר של הסבר במדע, לא ניחוש. היא נבדקה שוב ושוב ומסבירה הרבה תצפיות. ניחוש שעוד לא נבדק נקרא השערה."}, {"id": "q25", "k": "qa", "f": "מהי אבולוציה?", "b": "שינוי בהרכב הגנטי של אוכלוסייה לאורך דורות", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "אבולוציה מתרחשת ברמת האוכלוסייה, לא ברמת הפרט. היא נמדדת בשינוי בתדירות האללים או בערך הממוצע של תכונה מדור לדור."}, {"id": "q26", "k": "qa", "f": "איך נקרא שינוי של פרט במהלך חייו?", "b": "התפתחות (ולא אבולוציה)", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "פרט לא עובר אבולוציה. ראשן שהופך לצפרדע או אדם שגדל עוברים התפתחות. אבולוציה היא שינוי בהרכב הגנטי של אוכלוסייה לאורך דורות."}, {"id": "q27", "k": "qa", "f": "איזו יבשת על התפרקה לפני כ-200 מיליון שנה?", "b": "פנגיאה", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "פנגיאה הייתה יבשת על אחת שכללה כמעט את כל היבשות. כשהתפרקה, אוכלוסיות שחיו יחד הופרדו והתפתחו בנפרד, וזה מסביר חלק מהתפוצה של מינים היום."}, {"id": "q28", "k": "qa", "f": "מאיזו יבשת על נוצרו היבשות הצפוניות?", "b": "לורסיה", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "פנגיאה התפצלה תחילה לשתי יבשות על: לורסיה בצפון (ממנה צפון אמריקה, אירופה ורוב אסיה) וגונדוואנה בדרום."}, {"id": "q29", "k": "qa", "f": "מאיזו יבשת על נוצרו היבשות הדרומיות?", "b": "גונדוואנה", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "מגונדוואנה נוצרו אפריקה, דרום אמריקה, אוסטרליה, אנטארקטיקה והודו. לכן מוצאים מאובנים זהים ביבשות הדרומיות, שהיום רחוקות זו מזו."}, {"id": "q30", "k": "qa", "f": "מה תורת האבולוציה מסבירה, ומה היא לא מסבירה?", "b": "היא מסבירה איך אוכלוסיות משתנות לאורך דורות; היא לא מסבירה איך נוצרו החיים הראשונים", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "איך נוצרו החיים הראשונים היא שאלה נפרדת. האבולוציה מתחילה מהרגע שיש יצורים שמתרבים ויש ביניהם שונות, ומסבירה איך הם משתנים עם הזמן."}, {"id": "q31", "k": "qa", "f": "סטודנט כתב: \"לג'ירפות התארך הצוואר כדי להגיע לעלים גבוהים\". מה הטעות?", "b": "לאבולוציה אין מטרה: ג'ירפות עם צוואר ארוך יותר כבר היו באוכלוסייה, הן שרדו והתרבו יותר, ולכן התכונה נעשתה נפוצה", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "הסביבה לא יוצרת את התכונה שצריך. היא רק מעדיפה פרטים שכבר נושאים אותה. וגם אם צוואר של ג'ירפה התארך במהלך חייה, השינוי הזה לא היה עובר לצאצאים."}, {"id": "q32", "k": "qa", "f": "מהו מין?", "b": "קבוצת פרטים שמתרבים זה עם זה ומייצרים צאצאים פוריים וברי קיימא", "t": "הרצאה_3_מינים_והתמיינות", "e": "זו ההגדרה הביולוגית של מין, והיא נשענת על יכולת רבייה ולא על מראה. לכן כלבים שנראים שונים מאוד הם מין אחד, וסוס וחמור (שהצאצא שלהם עקר) הם שני מינים."}, {"id": "q33", "k": "qa", "f": "פודל × קוקר ספנייל נותנים צאצא פורה; אריה × נמר נותנים לייגר, לרוב עקר. מה אפשר להסיק על כל זוג?", "b": "פודל וקוקר הם מין אחד. אריה ונמר הם שני מינים, אבל קרובים מאוד", "t": "הרצאה_3_מינים_והתמיינות", "e": "לפי ההגדרה הביולוגית, מי שמעמידים יחד צאצאים פוריים הם מין אחד, גם אם הם נראים שונים מאוד. צאצא עקר מראה שאלה שני מינים, ועצם ההכלאה מראה שהם קרובים (אריה ונמר שייכים לאותו סוג, Panthera)."}, {"id": "q34", "k": "qa", "f": "איך נקרא צאצא של הכלאה בין שני מינים?", "b": "מכלוא (היבריד)", "t": "הרצאה_3_מינים_והתמיינות", "e": "מכלוא נוצר מהכלאה בין שני מינים קרובים, כמו פרד (סוס וחמור) או לייגר (אריה ונמר). בדרך כלל המכלוא עקר, וזה מחסום פוסט-זיגוטי ששומר על ההפרדה בין המינים."}, {"id": "q35", "k": "qa", "f": "מהו מאגר גנים (gene pool)?", "b": "אוסף כל גרסאות הגנים (האללים) במין", "t": "הרצאה_3_מינים_והתמיינות", "e": "מאגר הגנים כולל את כל האללים של כל הפרטים במין או באוכלוסייה. אבולוציה היא בעצם שינוי בהרכב של מאגר הגנים לאורך זמן."}, {"id": "q36", "k": "qa", "f": "מהי התמיינות (speciation)?", "b": "היווצרות שני מינים ממין מקורי אחד", "t": "הרצאה_3_מינים_והתמיינות", "e": "בהתמיינות אוכלוסיות של מין אחד מפסיקות להחליף גנים, צוברות הבדלים, ובסוף כבר לא יכולות להתרבות זו עם זו. כך נוצרים מינים חדשים."}, {"id": "q37", "k": "qa", "f": "מהי התמיינות אלופטרית?", "b": "התמיינות בעקבות הפרדה גיאוגרפית של אוכלוסיות ואבולוציה נפרדת", "t": "הרצאה_3_מינים_והתמיינות", "e": "אלופטרית = \"מולדת אחרת\". מחסום גיאוגרפי (הר, נהר, ים) עוצר את זרימת הגנים, וכל אוכלוסייה מתפתחת בנפרד. דוגמה: הינשוף המנוקד הצפוני והינשוף המקסיקני."}, {"id": "q38", "k": "qa", "f": "מהי התמיינות סימפטרית?", "b": "התמיינות בלי הפרדה גיאוגרפית: האוכלוסיות ממשיכות לחיות באותו אזור", "t": "הרצאה_3_מינים_והתמיינות", "e": "סימפטרית = \"אותה מולדת\". המין החדש נוצר בלי מחסום גיאוגרפי, למשל כשחלק מהאוכלוסייה מנצל מקור מזון אחר ומזדווג בעיקר בתוך הקבוצה שלו, כמו בדגי הציקלידים."}, {"id": "q39", "k": "qa", "f": "מהי זרימת גנים?", "b": "מעבר אללים מאוכלוסייה לאוכלוסייה, כשפרטים נודדים ומתרבים שם", "t": "הרצאה_3_מינים_והתמיינות", "e": "זרימת גנים קורית כשפרטים נודדים בין אוכלוסיות ומזדווגים שם. היא שומרת על האוכלוסיות דומות זו לזו. כשהיא נעצרת, האוכלוסיות מתרחקות גנטית ועלולות להפוך למינים נפרדים."}, {"id": "q70", "k": "qa", "f": "מהי גומחה אקולוגית?", "b": "התפקיד של מין בסביבה: מה הוא אוכל, איפה הוא חי ואיך הוא מנצל את המשאבים", "t": "הרצאה_3_מינים_והתמיינות", "e": "גומחה היא לא רק מקום אלא דרך חיים. על אותו עץ ציפור אחת יכולה לאכול זרעים ואחרת חרקים: הן חיות באותו מקום, אבל בגומחות שונות."}, {"id": "q40", "k": "qa", "f": "מהי התפצלות סתגלנית (adaptive radiation)?", "b": "אירועי התמיינות מרובים ממין יחיד, כשכל אוכלוסייה מתאימה לגומחה אחרת", "t": "הרצאה_3_מינים_והתמיינות", "img": "honeycreepers", "e": "בהתפצלות סתגלנית מין מייסד אחד מגיע לאזור עם הרבה גומחות פנויות, ומתפצל למינים רבים שכל אחד מותאם לגומחה אחרת. דוגמאות: החוחיות של דרווין ויונקי הדבש של הוואי."}, {"id": "q41", "k": "qa", "f": "איך נקרא המין המקורי שממנו התפתחו כל המינים בהתפצלות סתגלנית?", "b": "המין המייסד", "t": "הרצאה_3_מינים_והתמיינות", "e": "המין המייסד הוא האב הקדמון שהגיע לאזור החדש, למשל חוחית אחת מהיבשת שהגיעה לגלפאגוס. ממנו התפתחו כל המינים בהתפצלות."}, {"id": "q71", "k": "qa", "f": "מהי מיוזה?", "b": "חלוקת תא שיוצרת תאי מין: מתא עם שתי מערכות כרומוזומים (2n) נוצרים תאים עם מערכת אחת (n)", "t": "הרצאה_3_מינים_והתמיינות", "e": "במיוזה הכרומוזומים מסתדרים בזוגות תואמים (הומולוגיים, אחד מכל הורה) ונפרדים זה מזה, כך שכל תא מין מקבל עותק אחד מכל זוג. בהפריה שני תאי מין n מתאחדים שוב לתא 2n."}, {"id": "q42", "k": "qa", "f": "מהי אנופלואידיה?", "b": "יותר מדי או מעט מדי כרומוזומים בודדים בתא", "t": "הרצאה_3_מינים_והתמיינות", "e": "אנופלואידיה נוצרת מאי-ניתוק במיוזה, וגורמת לתא להיות 2n+1 או 2n-1. בדרך כלל זה מזיק (דוגמה בבני אדם: תסמונת דאון, שלושה עותקים של כרומוזום 21)."}, {"id": "q43", "k": "qa", "f": "מהי פוליפלואידיה?", "b": "קבוצה נוספת (או קבוצות) שלמה של כרומוזומים", "t": "הרצאה_3_מינים_והתמיינות", "e": "בפוליפלואידיה מתווספת מערכת שלמה של כרומוזומים (למשל 3n או 4n), ולא כרומוזום בודד. זה נפוץ בעיקר בצמחים, ויכול ליצור מין חדש בדור אחד."}, {"id": "q44", "k": "qa", "f": "מהי אוטופוליפלואידיה?", "b": "ריבוי קבוצות כרומוזומים מהמין עצמו", "t": "הרצאה_3_מינים_והתמיינות", "img": "autopoly", "e": "\"אוטו\" = עצמי. אוטופוליפלואיד נוצר כשמיוזה לא מסתיימת בחלוקת התא, ונוצרת גמטה 2n במקום n. הצאצא (4n) כבר לא יכול להתרבות עם ההורים (2n), וכך נוצר מין חדש."}, {"id": "q45", "k": "qa", "f": "מהו אלופוליפלואיד?", "b": "פוליפלואיד שנוצר מהכלאה בין שני מינים: יש בו מערכות כרומוזומים שלמות משני ההורים, ולכן הוא פורה", "t": "הרצאה_3_מינים_והתמיינות", "img": "allopoly", "e": "\"אלו\" = אחר. מכלוא רגיל של שני מינים לרוב עקר, כי לכרומוזומים שלו אין בן זוג תואם במיוזה. כשמספר הכרומוזומים מוכפל, לכל כרומוזום יש בן זוג, הצאצא פורה, והוא מבודד רבייתית מההורים. דוגמאות: חיטה, כותנה וטבק תרבותיים."}, {"id": "q46", "k": "qa", "f": "מהי זיגוטה?", "b": "ביצית מופרית", "t": "הרצאה_3_מינים_והתמיינות", "e": "זיגוטה נוצרת כשזרע מפרה ביצית. היא התא הראשון של הצאצא. לפי הזיגוטה מחלקים את מחסומי הרבייה: לפני היווצרותה (פרה-זיגוטי) או אחריה (פוסט-זיגוטי)."}, {"id": "q47", "k": "qa", "f": "מהו מחסום פרה-זיגוטי?", "b": "מנגנון שמונע הזדווגות או הפריה", "t": "הרצאה_3_מינים_והתמיינות", "e": "מחסום פרה-זיגוטי פועל לפני ההפריה. סוגים: בידוד זמנים, בידוד בית גידול, בידוד התנהגותי, בידוד מכני (אי-התאמה של איברי רבייה) ומחסום גמטי."}, {"id": "q48", "k": "qa", "f": "מהו מחסום פוסט-זיגוטי?", "b": "מחסום שפועל אחרי היווצרות זיגוטה (העובר לא שורד או שהצאצא עקר)", "t": "הרצאה_3_מינים_והתמיינות", "e": "מחסום פוסט-זיגוטי פועל אחרי שכבר נוצרה ביצית מופרית: העובר לא מתפתח, הצאצא חלש, או שהוא עקר. הדוגמה הקלאסית היא הפרד."}, {"id": "q49", "k": "qa", "f": "מהו בידוד זמנים?", "b": "הבדלים בלוחות הזמנים של הרבייה", "t": "הרצאה_3_מינים_והתמיינות", "e": "בבידוד זמנים שני המינים יכולים לחיות באותו מקום, אבל מתרבים בזמנים שונים (עונה או שעה ביום), ולכן לא נפגשים להזדווגות. דוגמה: שני מיני צפרדעים שמתרבים בחודשים שונים."}, {"id": "q50", "k": "qa", "f": "מהו בידוד בית גידול?", "b": "אוכלוסיות שחיות בבתי גידול שאינם חופפים", "t": "הרצאה_3_מינים_והתמיינות", "e": "בבידוד בית גידול כל מין מעדיף סביבה אחרת, ולכן הם כמעט לא נפגשים, גם אם הם גרים קרוב. דוגמה: שני מיני צרצרים שמעדיפים קרקע חולית או חרסית."}, {"id": "q51", "k": "qa", "f": "מהו בידוד התנהגותי?", "b": "התנהגות ספציפית (או היעדרה) שמונעת רבייה", "t": "הרצאה_3_מינים_והתמיינות", "e": "בבידוד התנהגותי בני הזוג לא מזהים זה את זה כמתאימים, כי טקסי החיזור שונים: שיר, ריקוד או אות. דוגמה: גחליליות עם דפוס הבהוב ייחודי לכל מין."}, {"id": "q52", "k": "qa", "f": "מהו מחסום גמטי?", "b": "הבדלים בביציות ובזרע שמונעים הפריה", "t": "הרצאה_3_מינים_והתמיינות", "e": "במחסום גמטי ההזדווגות יכולה לקרות, אבל הזרע לא מצליח להפרות את הביצית, למשל כי חלבוני הזיהוי על פני התאים לא מתאימים. זה נפוץ ביצורים שמשחררים תאי מין למים."}, {"id": "q53", "k": "qa", "f": "מהי עקרות היברידית?", "b": "מכלואים שנולדים וגדלים אך אינם מסוגלים להתרבות", "t": "הרצאה_3_מינים_והתמיינות", "e": "עקרות היברידית היא מחסום פוסט-זיגוטי: המכלוא נולד, גדל ונראה בריא, אבל לא יכול להעמיד צאצאים. לכן הגנים של שני המינים לא מתערבבים לאורך זמן. דוגמה: הפרד."}, {"id": "q54", "k": "qa", "f": "מהי היברידיזציה?", "b": "רבייה בין פרטים משני מינים שונים אך קרובים", "t": "הרצאה_3_מינים_והתמיינות", "e": "היברידיזציה מראה שמחסומי הרבייה לא תמיד מוחלטים. כשהיא קורית בטבע, ייתכן שתהליך ההתמיינות בין שני המינים עוד לא הושלם."}, {"id": "q55", "k": "qa", "f": "מדוע הפרד עקר?", "b": "הכרומוזומים שלו אינם הומולוגיים ולא מסתדרים בזוגות במיוזה", "t": "הרצאה_3_מינים_והתמיינות", "e": "לפרד 63 כרומוזומים: 32 מהסוסה ו-31 מהחמור. הכרומוזומים של הסוס ושל החמור לא תואמים, ולכן במיוזה הם לא מצליחים להתזווג ולהיפרד כראוי, ולא נוצרות גמטות תקינות."}, {"id": "q56", "k": "qa", "f": "מהי סיסטמטיקה?", "b": "המדע שמסווג אורגניזמים לפי הקרבה האבולוציונית ביניהם", "t": "הרצאה_3_מינים_והתמיינות", "e": "סיסטמטיקה מסדרת את היצורים בקבוצות (מין, סוג, משפחה וכו') לפי קרבה אבולוציונית, ובונה עצים פילוגנטיים. היום היא נשענת בעיקר על השוואת רצפי DNA."}, {"id": "q58", "k": "qa", "f": "מה פירוש MRCA?", "b": "האב הקדמון המשותף המאוחר ביותר (Most Recent Common Ancestor)", "t": "הרצאה_3_מינים_והתמיינות", "e": "MRCA הוא הצומת המשותף האחרון של שני מינים בעץ הפילוגנטי. ככל שהוא קרוב יותר להווה, המינים התפצלו לאחרונה ולכן קרובים יותר."}, {"id": "q59", "k": "qa", "f": "מה פירוש LUCA?", "b": "Last Universal Common Ancestor, האב הקדמון המשותף האוניברסלי", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "LUCA הוא האב הקדמון המשותף של כל היצורים החיים היום: חיידקים, ארכאונים ואאוקריוטים. הראיה לקיומו: כולם משתמשים ב-DNA ובאותו קוד גנטי."}, {"id": "q60", "k": "qa", "f": "מהי אביוגנזה?", "b": "היווצרות חיים מחומר דומם", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "אביוגנזה היא השאלה איך נוצרו החיים הראשונים, לפני כ-4 מיליארד שנה. ההשערות המרכזיות: המרק הקדמון, הנביעות ההידרותרמיות ועולם ה-RNA."}, {"id": "q61", "k": "qa", "f": "למה הפך החיידק שנבלע באנדוסימביוזה?", "b": "לאברון המיטוכונדריה", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "לפי תיאוריית האנדוסימביוזה, ארכאון בלע חיידק ולא עיכל אותו. החיידק המשיך לחיות בתוכו והפך למיטוכונדריה, אברון הפקת האנרגיה. לכן למיטוכונדריה יש DNA משלה."}, {"id": "q62", "k": "qa", "f": "אילו יצורים שחררו את החמצן באירוע החמצון הגדול?", "b": "ציאנובקטריה פוטוסינתטיים", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "ציאנובקטריה הם חיידקים שעושים פוטוסינתזה ומשחררים חמצן. לפני כ-2.4 מיליארד שנה הם העלו את רמת החמצן באטמוספירה. זה גרם להכחדה של יצורים אנאירוביים, אבל אפשר נשימה אירובית."}, {"id": "q63", "k": "qa", "f": "מהו פולימורפיזם?", "b": "קיום של פנוטיפים או אללים שונים באוכלוסייה", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "kittens", "e": "פולימורפיזם = \"צורות רבות\". דוגמה: גורים מאותה המלטה עם צבעי פרווה שונים. השונות הזו היא חומר הגלם שעליו פועלת הברירה הטבעית."}, {"id": "q64", "k": "qa", "f": "מהי תורשתיות?", "b": "החלק מהשונות הפנוטיפית שניתן לייחס להבדלים גנטיים", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "שונות פנוטיפית = שונות גנטית + שונות סביבתית. תורשתיות מודדת כמה מתוכה גנטית. ככל שהיא גבוהה יותר, הברירה יכולה לשנות את הדור הבא מהר יותר."}, {"id": "q65", "k": "qa", "f": "מהי ברירה כיוונית?", "b": "ברירה שבה תכונה בקצה אחד של הטווח מועדפת (עש הפלפל, צוואר הג'ירפה)", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "בברירה כיוונית הממוצע של התכונה זז לכיוון אחד מדור לדור. דוגמה: עש הפלפל, שבו העשים הכהים הועדפו על עצים שהשחירו מפיח, ושיעורם עלה מכ-2% לכ-95%."}, {"id": "q66", "k": "qa", "f": "מהי ברירה מייצבת?", "b": "ברירה שבה הקצוות נבררים לרעה והממוצע מועדף", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "בברירה מייצבת הממוצע נשאר במקום והשונות קטנה. דוגמה: משקל לידה, שבו תינוקות קלים מדי או כבדים מדי שורדים פחות."}, {"id": "q67", "k": "qa", "f": "מהי ברירה מפצלת?", "b": "ברירה שבה שני הקצוות מועדפים על פני הממוצע", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "בברירה מפצלת הפרטים הבינוניים שורדים פחות משני הקצוות. האוכלוסייה מתפצלת לשתי קבוצות, ולאורך זמן זה יכול להוביל להתמיינות."}, {"id": "q68", "k": "qa", "f": "מהי ברירה מלאכותית?", "b": "ברירה שבני אדם מפעילים בגידול צמחים ובעלי חיים", "t": "הרצאה_4_עץ_החיים_ושונות", "e": "בברירה מלאכותית בני אדם בוחרים אילו פרטים יתרבו, לפי תכונה שהם רוצים. דוגמאות: גזעי כלבים וזני תירס. דרווין השתמש בה כדי להסביר איך ברירה טבעית עובדת."}, {"id": "c3", "k": "cz", "x": "רעיון ההשתנות ההדרגתית של כדור הארץ (לייל) נתן לדרווין השראה לרעיון של {{c1::שינוי הדרגתי גם במינים}}.", "e": "צ'ארלס לייל, גיאולוג וחברו של דרווין, הפיץ את רעיונו של ג'יימס האטון: כדור הארץ משתנה בהדרגה, מהצטברות שינויים קטנים לאורך זמן רב. דרווין החיל את אותו היגיון על מינים.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c11", "k": "cz", "x": "מיני חוחיות הקרקע בגלפאגוס נבדלו זה מזה בעיקר ב{{c1::צורת המקור}}.", "e": "כל צורת מקור מותאמת למזון אחר שזמין באי: מקור עבה וחזק לשבירת זרעים, ומקור דק דמוי חנית לדקירת חרקים.", "t": "הרצאה_1_הבנת_האבולוציה", "img": "finches"}, {"id": "c13", "k": "qa", "f": "למה דרווין חשב שמיני החוחיות בגלפאגוס הם צאצאים של מין אחד מהיבשת?", "b": "הן דמו מאוד למין חוחית מדרום אמריקה, אבל בכל אי חי מין קצת אחר: ההסבר הפשוט הוא אב יבשתי משותף שהשתנה בכל אי בנפרד", "t": "הרצאה_1_הבנת_האבולוציה", "e": "זה היה אחד הרמזים הראשונים של דרווין לכך שמינים משתנים: מינים קרובים במקומות סמוכים, כל אחד מותאם לאי שלו (למשל בצורת המקור)."}, {"id": "c18", "k": "cz", "x": "ברירה טבעית יכולה להתרחש רק כשיש {{c1::שונות גנטית}} בין פרטים.", "e": "שונות גנטית = הבדלים ברצף הדנ\"א בין פרטים. בלי הבדלים אין בין מה \"לבחור\", והברירה לא יכולה לשנות דבר.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c19", "k": "cz", "x": "כדי שהברירה תשנה את הדור הבא, ההבדלים בין הפרטים חייבים להיות בעלי {{c1::בסיס גנטי (הבדלים ברצף הדנ\"א)}}.", "e": "שונות שנגרמת מהסביבה (למשל אדם גבוה בזכות תזונה טובה) לא עוברת לצאצאים. לכן היא לא משנה את הדור הבא.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c16", "k": "qa", "f": "בשלושה צעדים, איך ברירה טבעית משנה אוכלוסייה?", "b": "1. יש בין הפרטים הבדלים שעוברים בתורשה. 2. בעלי התכונות המתאימות לסביבה שורדים ומעמידים יותר צאצאים. 3. לכן התכונות האלה נעשות נפוצות יותר בדורות הבאים", "t": "הרצאה_1_הבנת_האבולוציה", "e": "אם חסר אחד הצעדים האוכלוסייה לא משתנה: בלי הבדלים אין בין מה לבחור, בלי הבדל בהצלחת הרבייה אין העדפה, ובלי תורשה ההבדל לא מגיע לדור הבא."}, {"id": "c21", "k": "cz", "x": "כשירות איננה מדד לבריאות כללית אלא ל{{c1::תרומה הגנטית לדורות הבאים}}.", "e": "כשירות (fitness) = מדד יחסי לכמה גנוטיפ מצליח לשרוד ולהעמיד צאצאים פוריים, לעומת גנוטיפים אחרים באותה אוכלוסייה. פרט בריא שלא מתרבה תורם 0 לדורות הבאים.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c22", "k": "cz", "x": "כשירות {{c1::תלויה בסביבה}}: תכונה שמעלה כשירות במקום אחד יכולה להפחית אותה במקום אחר.", "e": "דוגמה: עלים גדולים מועילים באקלים לח (יותר אנרגיה מהשמש), אבל מזיקים באקלים יבש כי הם מאבדים הרבה מים.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c23", "k": "cz", "x": "אללים שמגבירים כשירות נעשים {{c1::נפוצים יותר}} עם הזמן.", "e": "אלל = גרסה של גן. אלל שמגביר כשירות עובר ליותר צאצאים, ולכן התדירות שלו באוכלוסייה עולה מדור לדור.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c24", "k": "cz", "x": "שני המנגנונים העיקריים שיוצרים מגוון גנטי: {{c1::מוטציה}} ו{{c2::רבייה מינית}}.", "e": "מוטציה = שינוי ברצף הדנ\"א, והיא המקור האולטימטיבי לאללים חדשים. רבייה מינית לא יוצרת אללים חדשים, אלא מערבבת אללים קיימים לצירופים חדשים בכל צאצא.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c31", "k": "qa", "f": "למה אי אפשר לומר על תכונה שהיא \"טובה\" בלי לציין סביבה?", "b": "כי הערך של תכונה תלוי בתנאי הסביבה באותו זמן ומקום: אותה תכונה יכולה להועיל בסביבה אחת ולהזיק באחרת", "t": "הרצאה_1_הבנת_האבולוציה", "e": "דוגמה: פרווה עבה מועילה בקור ומזיקה בחום. כשהסביבה משתנה, כיוון הברירה יכול להתהפך, ותכונה שהועילה יכולה להפוך למזיקה."}, {"id": "c36", "k": "cz", "x": "הברירה הטבעית פועלת על {{c1::אורגניזמים בודדים}}, ודרכם מעצבת מין שלם.", "e": "הברירה \"מחליטה\" על פרטים (מי שורד ומתרבה), אבל השינוי האבולוציוני עצמו נמדד ברמת האוכלוסייה, ולוקח דורות רבים.", "t": "הרצאה_1_הבנת_האבולוציה"}, {"id": "c39", "k": "cz", "x": "שתי הדוגמאות הקלאסיות לרצף מאובנים שמראה התפתחות צורה: {{c1::בני אדם (הומינידים) וסוסים}}.", "e": "תיעוד המאובנים מראה שאורגניזמים מהעבר שונים מאלה של היום. אצל ההומינידים השתנתה צורת הגולגולת, ואצל אבות הסוס בעיקר הגודל.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "fossils"}, {"id": "c42", "k": "cz", "x": "התפתחות העובר נשמרת בין מינים כי למוטציות בעובר יש השלכות {{c1::גדולות ולרוב קטלניות}}.", "e": "שינוי מוקדם בהתפתחות העובר משפיע על כל מה שנבנה אחריו, ולכן לרוב הוא קטלני. התוצאה: שלבי התפתחות העובר נשמרים דומים גם בין מינים רחוקים, וזו עדות למוצא משותף.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "embryos"}, {"id": "c43", "k": "cz", "x": "כל עוברי החולייתנים, כולל האדם, מציגים בשלב מוקדם {{c1::חריצי זימים וזנב}}.", "e": "אצל יצורים יבשתיים חריצי הזימים והזנב נעלמים בהמשך ההתפתחות, אבל אצל דגים הם נשמרים בבוגר. זה מראה שלכל החולייתנים יש אב קדמון משותף.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "embryos"}, {"id": "c46", "k": "cz", "x": "דוגמה למבנים הומולוגיים: עצמות הגפה של {{c1::אדם, כלב, ציפור ולווייתן}}.", "e": "מבנים הומולוגיים = מבנים עם אותה פריסת עצמות בסיסית, שמקורם באב קדמון משותף, גם אם התפקיד שלהם שונה (הליכה, תעופה, שחייה). אל תבלבל עם אבולוציה מתכנסת, שבה הדמיון הוא בתפקיד, בלי מוצא משותף.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "limbs"}, {"id": "c49", "k": "cz", "x": "מבנה שרידי בלווייתנים: {{c1::עצמות רגליים אחוריות}}.", "e": "מבנה שרידי = מבנה ללא תפקוד נראה לעין, שנשאר מאב קדמון שבו הוא כן תפקד. אבות הלווייתנים היו יונקים יבשתיים עם רגליים.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c51", "k": "cz", "x": "הלבן החורפי של השועל הארקטי והרוטגן נובע מ{{c1::לחצי סלקציה דומים}}, לא ממוצא משותף.", "e": "התכנסות צורה = דמיון שנוצר בגלל סביבה דומה ולא בגלל קרבה. השועל (יונק) והרוטגן (ציפור) לא קרובים, אבל בשניהם הלבן נבחר כהסוואה בשלג.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "arctic"}, {"id": "c52", "k": "cz", "x": "את התפוצה הגיאוגרפית של אורגניזמים מסבירים אבולוציה ו{{c1::תנועת הלוחות הטקטוניים}}.", "e": "ביוגיאוגרפיה = חקר התפוצה הגיאוגרפית של אורגניזמים. כשהיבשות התפרקו ונדדו, קבוצות שהיו יחד הופרדו והתפתחו בנפרד.", "t": "הרצאה_2_ראיות_לאבולוציה", "img": "gondwana"}, {"id": "c56", "k": "cz", "x": "הגיוון הגדול של חיות הכיס באוסטרליה והיעדר יונקים אחרים משקפים את {{c1::הבידוד הארוך}} של היבשת.", "e": "אוסטרליה מבודדת מזמן, ולכן חיות הכיס התגוונו שם בלי תחרות מיונקי שליה שהתפתחו ביבשות אחרות.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c57", "k": "cz", "x": "מינים אנדמיים אופייניים במיוחד ל{{c1::איים}}, שבהם המים מונעים נדידה.", "e": "מינים אנדמיים = מינים שלא נמצאים בשום מקום אחר. באי מבודד מינים לא יכולים לנדוד, ולכן הם מתפתחים למינים ייחודיים.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c58", "k": "cz", "x": "עדות מולקולרית לאב קדמון משותף: {{c1::האוניברסליות}} של DNA, של הקוד הגנטי ושל מנגנוני השכפול והביטוי.", "e": "כל היצורים, מחיידק ועד אדם, משתמשים ב-DNA כחומר תורשתי ובאותו קוד גנטי. ההסבר הפשוט ביותר: כולם צאצאים של אב קדמון משותף אחד.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c59", "k": "cz", "x": "הקרבה בין קבוצות אורגניזמים מתבטאת ב{{c1::דמיון ברצפי ה-DNA}} שלהן.", "e": "ככל ששתי קבוצות התפצלו מאב משותף מאוחר יותר, היה פחות זמן להצטברות הבדלים, ולכן הרצפים שלהן דומים יותר.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c60", "k": "cz", "x": "פונקציות חדשות לחלבונים מתפתחות בדרך כלל לאחר {{c1::שכפול גנים}}.", "e": "כשגן משוכפל יש שני עותקים. אחד ממשיך לייצר את החלבון המקורי, והשני חופשי להשתנות (במוטציה, בברירה או בסחף) ולקבל תפקיד חדש.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c64", "k": "cz", "x": "\"תיאוריה\" בשפת היומיום קרובה יותר למושג המדעי {{c1::השערה}}.", "e": "תיאוריה מדעית = גוף הסברים שנבדקו ואומתו שוב ושוב (כמו תורת הכבידה). השערה = הסבר מוצע שעדיין לא נבדק. לכן \"רק תיאוריה\" הוא אפיון מוטעה של האבולוציה.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c65", "k": "cz", "x": "אבולוציה של מאפיין = שינוי ב{{c1::ערך הממוצע}} שלו באוכלוסייה לאורך זמן.", "e": "דוגמה: מקור החוחית הבודדת לא משתנה בחייה. מה שמשתנה הוא גודל המקור הממוצע באוכלוסייה, כי בכל דור נולדים פרטים חדשים בהרכב אחר.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c69", "k": "cz", "x": "\"אורגניזמים מתפתחים בתגובה לסביבה\" הוא קיצור של \"{{c1::אוכלוסייה}} מתפתחת בתגובה לסביבה משתנה\".", "e": "אבולוציה היא שינוי באוכלוסייה. פרט שמשתנה במהלך חייו עובר התפתחות, לא אבולוציה.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c70", "k": "cz", "x": "השונות שעליה פועלת הברירה {{c1::כבר קיימת באוכלוסייה}}, ואינה נוצרת בתגובה לשינוי בסביבה.", "e": "הסביבה לא \"יוצרת\" את התכונה הדרושה. היא רק מעדיפה פרטים שכבר נושאים אותה. לכן האבולוציה אינה מכוונת מטרה.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c72", "k": "cz", "x": "האנטיביוטיקה אינה יוצרת מוטציות עמידות אלא {{c1::בוררת}} את החיידקים העמידים.", "e": "גן העמידות כבר היה קיים בכמה חיידקים, בתדירות נמוכה. האנטיביוטיקה הורגת את הרגישים, ונשארים העמידים שמתרבים. ניסויים הראו שהאנטיביוטיקה לא גורמת למוטציות העמידות.", "t": "הרצאה_2_ראיות_לאבולוציה"}, {"id": "c73", "k": "qa", "f": "למה לא נכון לומר שמינים נעשים \"טובים יותר\" עם הזמן?", "b": "כי אין לאבולוציה כיוון של שיפור: מינים רק עוקבים אחר סביבה משתנה, ומה שהועיל היום יכול להזיק מחר", "t": "הרצאה_2_ראיות_לאבולוציה", "e": "לאבולוציה אין יעד של מורכבות, כוח או חוכמה. תכונה מתאימה רק ביחס לסביבה הנוכחית, ויכולה להפוך למזיקה כשהסביבה משתנה."}, {"id": "c75", "k": "cz", "x": "כלבי בית שונים מאוד במראה, אבל הם מין אחד כי {{c1::יכולים להתרבות ולהעמיד צאצאים פוריים}}.", "e": "ההגדרה הביולוגית של מין נשענת על יכולת רבייה, לא על מראה. פודל וקוקר ספנייל נראים שונים מאוד, אבל הצאצא שלהם (קוקאפו) פורה. לעומת זאת, שני עיטים שנראים דומים יכולים להיות מינים שונים.", "t": "הרצאה_3_מינים_והתמיינות", "img": "dogs"}, {"id": "c78", "k": "cz", "x": "ברבייה מינית, שינוי גנטי יעבור לדור הבא רק אם הוא נמצא ב{{c1::גמטה (זרע או ביצית)}}.", "e": "גמטה = תא מין (זרע או ביצית). מוטציה בתא גוף רגיל (למשל בעור) נעלמת עם הפרט ולא מגיעה לצאצאים.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c79", "k": "cz", "x": "רק תכונה {{c1::תורשתית}} יכולה להתפתח אבולוציונית.", "e": "תכונה תורשתית = תכונה שיש לה בסיס גנטי ועוברת לצאצאים. תכונה נרכשת (כמו שרירים מאימון) לא עוברת, ולכן הברירה לא יכולה לפעול עליה לאורך דורות.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c81", "k": "cz", "x": "הכלאות בטבע בין מינים דומים עשויות להעיד ש{{c1::תהליך ההתמיינות טרם הושלם}}.", "e": "התמיינות = היווצרות שני מינים ממין אחד. אם שתי אוכלוסיות עדיין מצליחות להעמיד מכלואים, ייתכן שהן בדרך להיפרד אבל עוד לא הגיעו לבידוד רבייתי מלא.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c89", "k": "cz", "x": "הפרדה גיאוגרפית {{c1::מונעת זרימת גנים}}, ולכן תדירויות האללים מתבדלות.", "e": "זרימת גנים = מעבר אללים בין אוכלוסיות כשפרטים נודדים ומזדווגים. כשהיא נעצרת, כל אוכלוסייה צוברת מוטציות משלה ונבררת לפי הסביבה שלה, וכך הן מתרחקות גנטית.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c94", "k": "cz", "x": "דוגמה להתמיינות אלופטרית בחוף המערבי של ארה\"ב: {{c1::הינשוף המנוקד הצפוני והינשוף המקסיקני}}.", "e": "התמיינות אלופטרית (\"מולדת אחרת\") = היווצרות מינים בעקבות הפרדה גיאוגרפית. הינשופים חיים באזורים שונים, באקלים שונה ועם טרף שונה, וצברו הבדלים גנטיים ופנוטיפיים.", "t": "הרצאה_3_מינים_והתמיינות", "img": "owls"}, {"id": "c95", "k": "cz", "x": "ככל שהמרחק בין שתי קבוצות גדל, הסיכוי להתמיינות {{c1::גדל}}.", "e": "ככל שהמרחק גדל, תנאי הסביבה (אקלים, טרף, טורפים) שונים יותר, ולכן הברירה דוחפת כל קבוצה לכיוון אחר.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c97", "k": "cz", "x": "דוגמה להתפצלות סתגלנית באיי הוואי: {{c1::יונקי הדבש של הוואי (honeycreepers)}}.", "e": "התפצלות סתגלנית = מין מייסד אחד מתפצל למינים רבים, וכל אחד מותאם לגומחה אחרת. ביונקי הדבש של הוואי המקורים התאימו למזון: מקור ארוך לצוף, מקור דמוי חרב לחרקים, ומקור עבה לזרעים.", "t": "הרצאה_3_מינים_והתמיינות", "img": "honeycreepers"}, {"id": "c100", "k": "cz", "x": "דוגמה נוספת להתפצלות סתגלנית: {{c1::החוחיות של דרווין}}.", "e": "החוחיות של דרווין בגלפאגוס: מין מייסד יחיד שהגיע מהיבשת התפצל למינים רבים, כל אחד עם מקור שמותאם למזון אחר באיים.", "t": "הרצאה_3_מינים_והתמיינות", "img": "finches"}, {"id": "c102", "k": "cz", "x": "אנופלואידיה נוצרת עקב {{c1::אי-ניתוק}} כרומוזומים במיוזה.", "e": "אי-ניתוק = הכרומוזומים לא נפרדים כראוי במיוזה. נוצרות גמטות עם כרומוזום עודף (n+1) או חסר (n-1), והזיגוטה תהיה 2n+1 או 2n-1. זו אנופלואידיה.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c104", "k": "cz", "x": "אוטופוליפלואידיה נוצרת כשמיוזה אינה מלווה ב{{c1::ציטוקינזיס}}.", "e": "ציטוקינזיס = חלוקת הציטופלזמה לשני תאים בסוף החלוקה. כשהיא לא קורית, כל הכרומוזומים נשארים בתא אחד, ונוצרת גמטה עם שתי מערכות (2n) במקום אחת (n).", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c106", "k": "cz", "x": "פרט טטרפלואיד יכול להתרבות {{c1::רק עם טטרפלואידים אחרים}}, ולכן ההתמיינות מהירה.", "e": "טטרפלואיד (4n) = ארבע מערכות כרומוזומים. ההכלאה שלו עם ההורה הדיפלואידי (2n) לא מצליחה, ולכן הוא מבודד רבייתית כבר מהדור הראשון. זו התמיינות סימפטרית מהירה, בלי הפרדה גיאוגרפית.", "t": "הרצאה_3_מינים_והתמיינות", "img": "autopoly"}, {"id": "c108", "k": "cz", "x": "חיטה, כותנה וטבק תרבותיים הם {{c1::אלופוליפלואידים}}.", "e": "אלופוליפלואיד = פוליפלואיד שנוצר מהכלאה בין שני מינים שונים (\"אלו\" = אחר). לעומתו, אוטופוליפלואיד נוצר בתוך מין אחד (\"אוטו\" = עצמי).", "t": "הרצאה_3_מינים_והתמיינות", "img": "allopoly"}, {"id": "c109", "k": "cz", "x": "פוליפלואידיה נפוצה בעיקר ב{{c1::צמחים}}.", "e": "בבעלי חיים שינויים כאלה במספר הכרומוזומים בדרך כלל לא שורדים. יותר ממחצית ממיני הצמחים שנחקרו קשורים למין שנוצר בפוליפלואידיזציה.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c111", "k": "cz", "x": "שני מיני צפרדעים: אחד מתרבה בינואר–מרץ והשני במרץ–מאי. זהו {{c1::בידוד זמנים}}.", "e": "בידוד זמנים הוא מחסום פרה-זיגוטי, כלומר מונע את ההזדווגות עוד לפני שנוצרת ביצית מופרית. המינים חיים באותו מקום, אבל לא מתרבים באותו זמן.", "t": "הרצאה_3_מינים_והתמיינות", "img": "frogs"}, {"id": "c112", "k": "cz", "x": "הצרצרים G. pennsylvanicus ו-G. firmus מבודדים בגלל העדפת {{c1::סוג קרקע}} (חולית או חרסית).", "e": "בידוד בית גידול (מחסום פרה-זיגוטי): שני המינים יכולים לחיות קרוב, אבל כל אחד מעדיף קרקע אחרת, ולכן הם כמעט לא נפגשים להזדווגות.", "t": "הרצאה_3_מינים_והתמיינות", "img": "crickets"}, {"id": "c113", "k": "cz", "x": "דוגמה לבידוד התנהגותי: {{c1::גחליליות}} עם דפוסי אור ייחודיים לכל מין.", "e": "בידוד התנהגותי (מחסום פרה-זיגוטי): הנקבה מזהה רק את דפוס האור של זכר מהמין שלה, ולא תזדווג עם זכר שמהבהב בדפוס אחר.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c114", "k": "cz", "x": "דוגמה לאי-התאמה של איברי רבייה: זכרי {{c1::שפיריות}} ממינים שונים.", "e": "בידוד מכני (מחסום פרה-זיגוטי): לכל מין צורה שונה של איבר הרבייה, שמתאימה רק לנקבה מאותו מין.", "t": "הרצאה_3_מינים_והתמיינות", "img": "damselfly"}, {"id": "c115", "k": "cz", "x": "בצמחים, מבנה הפרח (למשל מנהרת הצוף) מותאם ל{{c1::מאביק מסוים}}.", "e": "דוגמאות: פרח האצבעונית בצורת פעמון מותאם לדבורים, ופרח החצוצרה הארוך מותאם ליונקי דבש. כך האבקה הוא לא מגיע למין צמח אחר.", "t": "הרצאה_3_מינים_והתמיינות", "img": "pollinators"}, {"id": "c118", "k": "cz", "x": "דוגמה להתמיינות סימפטרית בלי פוליפלואידיה: דגים שמנצלים {{c1::מקור מזון בעומק אחר}} באגם.", "e": "התמיינות סימפטרית (\"אותה מולדת\") = היווצרות מין חדש בלי הפרדה גיאוגרפית. הדגים שאוכלים בעומק אחר מזדווגים בעיקר זה עם זה, ובהדרגה נפרדים מהאוכלוסייה המקורית.", "t": "הרצאה_3_מינים_והתמיינות", "img": "cichlids"}, {"id": "c119", "k": "cz", "x": "באגם {{c1::ויקטוריה}} באפריקה נמצאו מאות אירועי התמיינות סימפטרית בדגי ציקלידים.", "e": "דגי הציקלידים באגם ויקטוריה הם דוגמה להתמיינות סימפטרית מהירה ורבה. דוגמה נוספת היא אגם אפויאק בניקרגואה: שתי אוכלוסיות עם שפתיים ותזונה שונות נוצרו בתוך כ-100 שנה.", "t": "הרצאה_3_מינים_והתמיינות", "img": "cichlids"}, {"id": "c123", "k": "cz", "x": "הכלאה בין מינים מראה ש{{c1::מחסומי הרבייה}} אינם תמיד מוחלטים.", "e": "היברידיזציה = רבייה בין שני מינים קרובים. היא אפשרית רק כשהמחסומים הפרה-זיגוטיים לא מונעים אותה לגמרי, אבל לרוב מחסום פוסט-זיגוטי (צאצא עקר) עדיין שומר על ההפרדה.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c127", "k": "qa", "f": "לסוס 64 כרומוזומים ולחמור 62. כמה כרומוזומים יש לפרד, ולמה זה מנבא שהוא עקר?", "b": "63 (32 מהסוסה + 31 מהחמור). במספר אי-זוגי לפחות כרומוזום אחד נשאר בלי בן זוג, ולכן הכרומוזומים לא מסתדרים בזוגות במיוזה", "t": "הרצאה_3_מינים_והתמיינות", "e": "כל הורה מעביר חצי מהכרומוזומים שלו. גם מעבר למספר, הכרומוזומים של הסוס ושל החמור שונים זה מזה, ולכן במיוזה הם לא מצליחים להתזווג, ולא נוצרים תאי מין תקינים."}, {"id": "c128", "k": "cz", "x": "עקרות הפרד היא דוגמה למחסום {{c1::פוסט-זיגוטי}}.", "e": "מחסום פוסט-זיגוטי = מחסום שפועל אחרי ההפריה. הפרד נולד וגדל, אבל הכרומוזומים שלו אינם הומולוגיים (לא זוגות תואמים), ולכן המיוזה משתבשת ואין לו תאי מין תקינים.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c129", "k": "cz", "x": "יכולת להעמיד צאצא (אפילו עקר) מעידה בדרך כלל על קרבה רבה: לרוב שני המינים שייכים לאותו {{c1::סוג (Genus)}}.", "e": "סוג (Genus) = הדרגה הטקסונומית שמעל מין, שמאגדת מינים עם אב קדמון משותף קרוב. סוס וחמור מהסוג Equus, ואריה ונמר מהסוג Panthera. יש גם מכלואים בין סוגים שונים, אבל הם נדירים יותר.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c132", "k": "cz", "x": "בעץ פילוגנטי, בסיס העץ מייצג {{c1::אב קדמון משותף}}.", "e": "עץ פילוגנטי = תרשים מסתעף של קרבה אבולוציונית. הבסיס הוא האב הקדמון, כל צומת הוא נקודת התפצלות, והקצוות הם המינים של היום.", "t": "הרצאה_3_מינים_והתמיינות", "img": "darwin-tree"}, {"id": "c134", "k": "cz", "x": "ככל שה-MRCA של שני מינים קרוב יותר להווה, המינים {{c1::קרובים יותר}} אבולוציונית.", "e": "MRCA = האב הקדמון המשותף המאוחר ביותר. אם הצומת המשותף לשני מינים קרוב לקצות העץ, הם התפצלו לאחרונה ולכן קרובים.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c137", "k": "cz", "x": "כיום עצים פילוגנטיים נבנים בעיקר על סמך נתונים {{c1::מולקולריים}} (רצפי DNA, RNA או חלבון).", "e": "פעם הסתמכו על נתונים מורפולוגיים (שלד, אנטומיה, מאובנים). היום משווים רצפים: ככל שאחוז הזהות ברצפים גבוה יותר, המינים קרובים יותר.", "t": "הרצאה_3_מינים_והתמיינות"}, {"id": "c139", "k": "cz", "x": "השערת {{c1::המרק הקדמון}}: חיים נוצרו במים רדודים, בעזרת אנרגיה מברקים וקרינת UV.", "e": "אביוגנזה = היווצרות חיים מחומר דומם, לפני כ-4 מיליארד שנה. לפי השערה זו, הברקים והקרינה יצרו מולקולות אורגניות פשוטות (כמו סוכרים) ששימשו מקור אנרגיה.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c140", "k": "cz", "x": "השערת {{c1::הנביעות ההידרותרמיות}}: החיים התפתחו במעמקי האוקיינוס.", "e": "סביב הנביעות יצורים קדומים פיתחו כמוסינתזה: הפקת אנרגיה מתגובות כימיות עם חומרים אנאורגניים (כמו תרכובות גופרית), במקום מאור השמש.", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "vents"}, {"id": "c143", "k": "cz", "x": "{{c1::השערת עולם ה-RNA}}: מולקולות RNA שיכלו לשכפל את עצמן היו שלב מוקדם בהתפתחות החיים.", "e": "RNA יכול גם לשאת מידע תורשתי וגם לזרז תגובות, ולכן ייתכן שהוא קדם ל-DNA ולחלבונים. אחריו נוצרו ממברנות שומניות, ואיתן התאים הראשונים.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c145", "k": "cz", "x": "שלוש העל-ממלכות (Domains): {{c1::חיידקים}}, {{c2::ארכאונים}} ו{{c3::אאוקריוטים}}.", "e": "על-ממלכה (Domain) = הענף הרחב ביותר בעץ החיים. חיידקים וארכאונים הם פרוקריוטים (בלי גרעין), ואאוקריוטים הם בעלי גרעין (צמחים, פטריות, בעלי חיים ועוד).", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "tree-of-life"}, {"id": "c146", "k": "cz", "x": "חיידקים וארכאונים הם {{c1::פרוקריוטים}} (חסרי גרעין תא).", "e": "פרוקריוט = יצור בלי גרעין תא מוגדר. ארכאונים נבדלים מחיידקים במבנה התא ובביוכימיה, ורבים מהם חיים בסביבות קיצוניות.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c149", "k": "cz", "x": "אאוקריוטים = יצורים בעלי {{c1::גרעין תא מוגדר}}.", "e": "גרעין תא = אברון שעטוף בממברנה ומכיל את ה-DNA. לאאוקריוטים שייכים גם חד-תאיים (אמבה, שמרים) וגם פטריות, צמחים ובעלי חיים.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c150", "k": "cz", "x": "האאוקריוטים התפתחו מאירוע {{c1::אנדוסימביוזה}}.", "e": "אנדוסימביוזה = יצור אחד חי בתוך יצור אחר, לטובת שניהם. חיידק קדום נבלע בתוך ארכאון ולא עוכל, אלא הפך לאברון המיטוכונדריה.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c151", "k": "cz", "x": "באנדוסימביוזה, {{c1::חיידק}} קדום נבלע על ידי {{c2::ארכאון}} קדום.", "e": "החיידק הבלוע הפך למיטוכונדריה, האברון שמפיק אנרגיה בתא האאוקריוטי.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c152", "k": "cz", "x": "אירוע החמצון הגדול התרחש לפני כ-{{c1::2.4 מיליארד}} שנה.", "e": "ציאנובקטריה פוטוסינתטיים שחררו כמויות אדירות של חמצן לאטמוספירה.", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "oxygen"}, {"id": "c153", "k": "cz", "x": "החמצן היה רעיל ליצורים {{c1::אנאירוביים}} וגרם להכחדה ההמונית הראשונה.", "e": "אנאירובי = חי בלי חמצן. רוב היצורים אז היו אנאירוביים, ולכן החמצן גרם להכחדה ההמונית הראשונה, \"גיזום\" ענק של עץ החיים.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c154", "k": "cz", "x": "אירוע החמצון הגדול אפשר את התפתחות {{c1::הנשימה האירובית}}.", "e": "נשימה אירובית = הפקת אנרגיה בעזרת חמצן. היא יעילה הרבה יותר מהפקת אנרגיה בלי חמצן, ואיפשרה התפתחות של יצורים מורכבים.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c155", "k": "cz", "x": "הפיצוץ הקמבריוני התרחש לפני כ-{{c1::541}} מיליון שנה.", "e": "\"פיצוץ\" כי בזמן קצר יחסית במונחים גיאולוגיים הופיעו כמעט כל המערכות של בעלי החיים. הסיבות המשוערות: עלייה ברמות החמצן, שינויים אקולוגיים והתפתחות יחסי טורף-נטרף.", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "oxygen"}, {"id": "c156", "k": "cz", "x": "בפיצוץ הקמבריוני הופיעו כמעט כל ה{{c1::מערכות (Phyla)}} של בעלי החיים.", "e": "מערכה (Phylum) = דרגה טקסונומית רחבה מאוד, שמאגדת קבוצות עם תוכנית גוף בסיסית משותפת (למשל פרוקי רגליים או רכיכות).", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c159", "k": "cz", "x": "אחרי הכחדה המונית, {{c1::גומחות אקולוגיות שהתפנו}} מאפשרות לשורדים להתגוון במהירות.", "e": "גומחה אקולוגית = \"התפקיד\" של מין בסביבה: מה הוא אוכל, איפה הוא חי וכו'. אחרי הכחדה (כמו זו של הדינוזאורים לפני 66 מיליון שנה) נוצרים \"מקומות פנויים\", והשורדים מתפצלים כדי למלא אותם.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c160", "k": "cz", "x": "שונות פנוטיפית = {{c1::שונות גנטית}} + {{c2::שונות סביבתית}}.", "e": "דוגמה: עץ אלון אחד גדול מאחר בגלל אללים טובים יותר לקצב גידול (שונות גנטית) ובגלל אדמה עמוקה יותר ופחות שכנים (שונות סביבתית). רק החלק הגנטי עובר לצאצאים.", "t": "הרצאה_4_עץ_החיים_ושונות", "img": "oaks"}, {"id": "c161", "k": "cz", "x": "תכונות נרכשות (כמו שרירים מאימון) בדרך כלל {{c1::אינן עוברות}} בתורשה.", "e": "ספורטאי שבונה שרירים לא מוריש אותם לילדיו. רק תכונות שיש להן בסיס גנטי עוברות. זו הסיבה שהרעיון של למארק (תורשת תכונות נרכשות) נפסל.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c162", "k": "cz", "x": "ככל שהתורשתיות גבוהה יותר, האוכלוסייה {{c1::רגישה יותר}} לכוחות אבולוציוניים.", "e": "תורשתיות = החלק מהשונות הפנוטיפית שנובע מהבדלים גנטיים. אם רוב השונות גנטית, הברירה \"רואה\" אותה ומשנה את הדור הבא. אם רובה סביבתית, לברירה כמעט אין על מה לפעול.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c163", "k": "cz", "x": "עש הפלפל: במהפכה התעשייתית הפיח {{c1::הכהה את העצים}}, והעשים הבהירים נטרפו בקלות.", "e": "דוגמה קלאסית לברירה כיוונית: על עצים כהים העשים הכהים הוסוו טוב יותר, ולכן שרדו והתרבו. שיעור העשים הכהים עלה מכ-2% לכ-95%.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c169", "k": "cz", "x": "עיקרון הברירה הטבעית שלפיו לפרטים באוכלוסייה יש פנוטיפים שונים: {{c1::שונות}}.", "e": "ארבעת העקרונות של הברירה הטבעית: 1. שונות, 2. תורשתיות, 3. מאבק הישרדות, 4. הישרדות והתרבות דיפרנציאליות.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c170", "k": "cz", "x": "עיקרון הברירה הטבעית שלפיו חלק מההבדלים עוברים לצאצאים: {{c1::תורשתיות}}.", "e": "ארבעת העקרונות של הברירה הטבעית: 1. שונות, 2. תורשתיות, 3. מאבק הישרדות, 4. הישרדות והתרבות דיפרנציאליות.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c171", "k": "cz", "x": "עיקרון הברירה הטבעית שלפיו נולדים יותר צאצאים ממה שהמשאבים מאפשרים: {{c1::מאבק הישרדות}}.", "e": "ארבעת העקרונות של הברירה הטבעית: 1. שונות, 2. תורשתיות, 3. מאבק הישרדות, 4. הישרדות והתרבות דיפרנציאליות. את הרעיון של מאבק הישרדות דרווין שאב מתומאס מלתוס.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c173", "k": "cz", "x": "עיקרון הברירה הטבעית שלפיו תכונות תורשתיות גורמות להבדלים בהישרדות וברבייה: {{c1::הישרדות והתרבות דיפרנציאליות}}.", "e": "\"דיפרנציאלי\" = שונה בין פרטים. פרטים עם תכונות מסוימות שורדים ומתרבים יותר מאחרים. ארבעת העקרונות: 1. שונות, 2. תורשתיות, 3. מאבק הישרדות, 4. הישרדות והתרבות דיפרנציאליות.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c174", "k": "cz", "x": "ברמה הגנטית, תוצאת הברירה הטבעית היא שינוי ב{{c1::תדירות האללים}} באוכלוסייה.", "e": "המסר המרכזי: פרטים לא מתפתחים. מה שמשתנה הוא השכיחות של כל אלל באוכלוסייה, מדור לדור.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c177", "k": "cz", "x": "דוגמה לברירה מייצבת: {{c1::משקל לידה של תינוקות}}.", "e": "ברירה מייצבת = הקצוות נבררים לרעה, והממוצע מועדף. תינוקות קלים מדי או כבדים מדי שורדים פחות. להשוואה: בברירה כיוונית קצה אחד מועדף, ובברירה מפצלת שני הקצוות מועדפים על פני הממוצע.", "t": "הרצאה_4_עץ_החיים_ושונות"}, {"id": "c179", "k": "cz", "x": "שתי האסטרטגיות של ברירה מינית: {{c1::משיכת בני המין השני}} ו{{c2::תחרות עם בני אותו מין}}.", "e": "ברירה מינית = ברירה על תכונות שמשפרות את ההצלחה בהשגת בן זוג, גם אם הן לא עוזרות להישרדות. דוגמה למשיכה: זנב הטווס. דוגמה לתחרות: מאבקים בין זכרים, שמעדיפים פרטים גדולים וחזקים.", "t": "הרצאה_4_עץ_החיים_ושונות"}]</script>

const EVO_MAPS={"הרצאה_1_הבנת_האבולוציה": "# מאיפה הרעיון הגיע\n- לייל: כדור הארץ משתנה בהדרגה. דרווין: גם מינים משתנים בהדרגה\n- חוחיות גלפאגוס: נבדלות בצורת המקור, והשתנו ממין יבשתי מקורי\n# ברירה טבעית\n- **תנאים:** שונות גנטית בין פרטים, ובסיס תורשתי להבדלים\n- **תוצאה:** פרטים מותאמים מתרבים יותר, ולכן אללים מועילים נעשים נפוצים\n- פועלת על פרטים, ודרכם מעצבת את המין\n# כשירות ואדפטציה\n- כשירות = הצלחה יחסית לשרוד ולהעמיד צאצאים פוריים. תלויה בסביבה\n- אדפטציה = תכונה תורשתית שמסייעת בסביבה הנוכחית\n# מקורות השונות\n- מוטציה היא המקור היחיד לאללים חדשים; רבייה מינית מערבבת אותם\n- אלל = גרסה של גן. גנוטיפ (אילו אללים יש לפרט) מול פנוטיפ (תכונה נמדדת); מוטציה ניטרלית\n# כיווני אבולוציה\n- מתפצלת: ממוצא משותף לכיוונים שונים\n- מתכנסת: תכונות דומות בלי מוצא משותף קרוב (כנפי עטלף וחרק)\n> כל מושג בהרצאה עונה על אחת משלוש שאלות: מה משתנה, למה, ומאיפה מגיעה השונות.", "הרצאה_2_ראיות_לאבולוציה": "# חמש קבוצות של ראיות\n- **מאובנים:** רצפי צורה (הומינידים, סוסים)\n- **אמבריולוגיה:** עוברי חולייתנים דומים (חריצי זימים וזנב), כי מוטציות בעובר לרוב קטלניות\n- **אנטומיה:** מבנים הומולוגיים (גפה של אדם, כלב, ציפור ולווייתן), מבנים שרידיים (רגליים אחוריות בלווייתן). לעומתם, התכנסות צורה (שועל ארקטי ורוטגן)\n- **ביוגאוגרפיה:** פנגיאה התפרקה ללורסיה וגונדוואנה; חיות הכיס באוסטרליה; מינים אנדמיים באיים\n- **מולקולרית:** DNA וקוד גנטי אוניברסליים; קרבה = דמיון ברצפים; פונקציות חדשות אחרי שכפול גנים\n# מה אבולוציה היא, ומה לא\n- שינוי בהרכב הגנטי של אוכלוסייה לאורך דורות. שינוי של פרט במהלך חייו הוא התפתחות\n- \"תיאוריה\" במדע = הסבר מבוסס ובדוק; ביומיום היא קרובה יותר ל\"השערה\"\n- לא מסבירה את מקור החיים, לא מכוונת מטרה, ומינים לא \"משתפרים\"\n- השונות כבר קיימת והסביבה בוררת (אנטיביוטיקה בוררת עמידים, לא יוצרת מוטציות)\n- סחף גנטי: שינוי בגלל מקריות\n> הבחנה שחוזרת במבחנים: הומולוגיה (מוצא משותף) מול התכנסות צורה (סביבה דומה).", "הרצאה_3_מינים_והתמיינות": "# מהו מין\n- פרטים שמתרבים ומעמידים צאצאים פוריים (כל כלבי הבית הם מין אחד); מאגר גנים\n- רק תכונות תורשתיות, ורק שינויים בגמטות, עוברים לדור הבא\n# איך נוצרים מינים חדשים\n- **אלופטרית:** הפרדה גיאוגרפית, אין זרימת גנים, התבדלות (ינשוף מנוקד צפוני ומקסיקני)\n- **סימפטרית:** באותו מקום, בעזרת פוליפלואידיה או ניצול משאב אחר (ציקלידים באגם ויקטוריה)\n- **התפצלות סתגלנית:** ממין מייסד לגומחות רבות (גומחה = התפקיד של מין בסביבה) (חוחיות דרווין, יונקי הדבש של הוואי)\n# שינויים בכרומוזומים\n- מיוזה: 2n ← n, הכרומוזומים מסתדרים בזוגות תואמים\n- אנופלואידיה: כרומוזומים בודדים חסרים או עודפים (אי-ניתוק)\n- פוליפלואידיה: קבוצות שלמות. אוטו = מהמין עצמו; אלו = מהכלאה של שני מינים, ולכן מכלוא פורה. טטרפלואיד מתרבה רק עם טטרפלואיד, ולכן התמיינות מהירה. נפוצה בצמחים (חיטה, כותנה, טבק)\n# מחסומי רבייה\n- **פרה-זיגוטיים:** זמנים (צפרדעים), בית גידול (צרצרים וסוג קרקע), התנהגותי (גחליליות), מכני (שפיריות), גמטי, מאביקים\n- **פוסט-זיגוטיים:** מכלוא לא שורד או עקר (פרד, 63 כרומוזומים)\n- צאצא פורה = מין אחד (פודל וקוקר); צאצא עקר = שני מינים קרובים (לייגר). הכלאות מראות שהמחסומים לא מוחלטים\n# סיסטמטיקה\n- עץ פילוגנטי, אב קדמון משותף ו-MRCA; היום בעיקר מנתונים מולקולריים\n> שאלה מנחה לכל דוגמה: מה מונע כאן זרימת גנים?", "הרצאה_4_עץ_החיים_ושונות": "# ראשית החיים\n- אביוגנזה. השערות: מרק קדמון, נביעות הידרותרמיות, עולם ה-RNA. האב הקדמון האוניברסלי: LUCA\n- שלוש על-ממלכות: חיידקים וארכאונים (פרוקריוטים), ואאוקריוטים (עם גרעין)\n- אנדוסימביוזה: חיידק נבלע בארכאון והפך למיטוכונדריה\n# אירועי מפתח\n- **החמצון הגדול** (לפני כ-2.4 מיליארד שנה, ציאנובקטריה): הכחדה של אנאירוביים, ואפשר נשימה אירובית\n- **הפיצוץ הקמבריוני** (לפני כ-541 מיליון שנה): כמעט כל מערכות בעלי החיים\n- אחרי הכחדה המונית, גומחות שהתפנו מאפשרות התגוונות מהירה\n# שונות ותורשתיות\n- שונות פנוטיפית = גנטית + סביבתית; תכונות נרכשות לא עוברות בתורשה\n- תורשתיות גבוהה = רגישות גבוהה לכוחות אבולוציוניים; פולימורפיזם\n# ברירה טבעית: עקרונות וסוגים\n- ארבעה עקרונות: שונות, תורשתיות, מאבק הישרדות, הישרדות והתרבות דיפרנציאליות. התוצאה: שינוי בתדירות האללים\n- **כיוונית** (עש הפלפל), **מייצבת** (משקל לידה), **מפצלת**; מלאכותית; מינית (משיכה ותחרות)\n> כדאי לצייר לעצמך את שלוש עקומות הברירה: איזה חלק בהתפלגות מועדף בכל אחת."};

  for(const n0 of [...base,...(Dx.added||[])]){const e=(Dx.edits||{})[n0.id];if(e&&e.del)continue;const n=Object.assign({},n0,e||{});
    if(n.k==='qa'){if(!(n.f||'').trim())continue;out.push(n.id);if(rev&&termOf(n))out.push(n.id+'-r')}
    else for(const k of new Set([...(n.x||'').matchAll(/\{\{c(\d+)::/g)].map(m=>+m[1])))out.push(n.id+'-'+k)}
  return out;
}
function countsFor(Pp,ids){
  const now=Date.now(),end=nextBoundary(now);let n=0,l=0,r=0;
  for(const id of ids){const s=Pp.cards[id];if(!s)n++;else if(s.q==='learn'||s.q==='relearn'){if(s.due<end)l++}else if(s.due<end)r++}
  let per=Pp.settings.newPerDay;const ex=Pp.settings.examDate;
  if(ex&&Pp.settings.autoPace){const [y,m,d]=ex.split('-').map(Number);const t=new Date(Date.now()-ROLL*HOUR);t.setHours(0,0,0,0);const dl=Math.round((new Date(y,m-1,d)-t)/DAY);if(dl>=1)per=Math.max(per,Math.min(Math.ceil(n/Math.max(1,dl-2)),200))}
  const left=Math.max(0,per-(Pp.log[today()]?.n||0));
  return {newAvail:Math.min(n,left),learn:l,review:r,total:Math.min(n,left)+l+r};
}

// ---------- deck model ----------
function rebuild(){
  LECS=[...CUR_LECTURES,...(D.lectures||[]).map(l=>[l.key,l.name])];
  if(!LECS.length)LECS=[['general','כללי']];
  const notes=[];
  for(const b of BASE){const e=D.edits[b.id];if(e&&e.del)continue;notes.push(Object.assign({},b,e||{}))}
  for(const a of D.added||[]){const e=D.edits[a.id];if(e&&e.del)continue;notes.push(Object.assign({},a,e||{}))}
  NOTES=notes;NBYID=Object.fromEntries(notes.map(n=>[n.id,n]));
  const cards=[];
  for(const n of notes){
    if(!LECS.some(l=>l[0]===n.t))n.t=LECS[0][0];
    if(n.k==='qa'){
      if(!(n.f||'').trim())continue;
      cards.push({id:n.id,nid:n.id,k:'qa',t:n.t});
      if(P.settings.reverse&&termOf(n))cards.push({id:n.id+'-r',nid:n.id,k:'rev',t:n.t});
    }else{
      const ns=[...new Set([...(n.x||'').matchAll(/\{\{c(\d+)::/g)].map(m=>+m[1]))].sort((a,b)=>a-b);
      for(const k of ns)cards.push({id:n.id+'-'+k,nid:n.id,k:'cz',n:k,t:n.t});
    }
  }
  CARDS=cards;BYID=Object.fromEntries(cards.map(c=>[c.id,c]));
  indexConcepts();
}

function conceptsAll(){return (COURSE==='evo'?EVO_CONCEPTS:[]).concat(D.concepts||[])}
let CONC=[],CDEF={},NDEF={},NUSE={},NCARDS={};
function indexConcepts(){
  CONC=conceptsAll();CDEF={};NDEF={};NUSE={};NCARDS={};
  for(const c of CARDS)(NCARDS[c.nid]=NCARDS[c.nid]||[]).push(c.id);
  for(const n of NOTES){const head=(n.f||'')+' '+(n.x||'');const txt=noteTxt(n);
    const d=CONC.filter(c=>(c.def||[]).some(x=>head.includes(x))).map(c=>c.n);
    for(const k of d)(CDEF[k]=CDEF[k]||[]).push(n.id);
    NDEF[n.id]=d;NUSE[n.id]=CONC.filter(c=>!d.includes(c.n)&&c.kw.some(w=>txt.includes(w))).map(c=>c.n)}
}
function noteSeen(nid){return (NCARDS[nid]||[]).some(id=>P.cards[id])}
function conceptKnown(k,placed){return (CDEF[k]||[]).some(nid=>noteSeen(nid)||(placed&&placed.has(nid)))}
function needs(nid,placed){return (NUSE[nid]||[]).filter(k=>(CDEF[k]||[]).length&&!conceptKnown(k,placed))}
// keep the lecture's own order, but hold back a card until the cards that teach its concepts came first
function prereqOrder(list){
  const placed=new Set(),done=new Set(),out=[],pend=[];const inList=new Set(list);
  const put=id=>{if(done.has(id))return;done.add(id);out.push(id);placed.add(BYID[id].nid)};
  const drain=()=>{for(let i=0;i<pend.length;i++)if(!needs(BYID[pend[i]].nid,placed).length){put(pend.splice(i,1)[0]);i=-1}};
  // a concept taught in a later lecture is brought forward to just before the first card that needs it
  const place=(id,stack)=>{
    if(done.has(id))return;
    for(const k of needs(BYID[id].nid,placed)){
      const def=list.find(x=>!done.has(x)&&!stack.has(x)&&(CDEF[k]||[]).includes(BYID[x].nid)&&BYID[x].k!=='rev');
      if(def){stack.add(id);place(def,stack);stack.delete(id)}}
    if(needs(BYID[id].nid,placed).length){if(!pend.includes(id))pend.push(id)}else{const i=pend.indexOf(id);if(i>=0)pend.splice(i,1);put(id);drain()}
  };
  for(const id of list)if(inList.has(id))place(id,new Set());
  return out.concat(pend.filter(x=>!done.has(x)));
}
function textReady(txt){for(const c of CONC){const d=CDEF[c.n];if(!d||!d.length)continue;if(c.kw.some(w=>txt.includes(w))&&!d.some(noteSeen))return false}return true}
function lecSeen(t){return CARDS.some(c=>c.t===t&&P.cards[c.id])}
// "only what you learned": text may be shown outside its own lesson card only if every concept it mentions was already taught
function noteTxt(n){return (n.f||'')+' '+(n.b||'')+' '+plain(n.x||'')+' '+(n.e||'')+' '+(n.L||'')}
function mcqReady(m){return lecSeen(m.t)&&textReady(m.f+' '+m.o.join(' '))}
function pairReady(p){
  const all=p.terms.map(t=>t[0]+' '+t[1]).join(' ')+' '+p.items.map(i=>i[0]).join(' ')+' '+(p.tip||'');
  if(!textReady(all))return false;
  const seen=NOTES.filter(n=>noteSeen(n.id));const hit=w=>seen.some(n=>noteTxt(n).includes(w));
  const names=p.terms.map(t=>t[0]+' '+t[1]).join(' ');
  return (p.kw||[]).filter(w=>names.includes(w)).every(hit)&&seen.filter(n=>(p.kw||[]).some(w=>noteTxt(n).includes(w))).length>=2;
}
// every new card is taught (read and understood) before it is ever asked
function teachable(c){return session&&session.mode==='srs'&&c.k!=='rev'&&isNew(c.id)}
function teachDone(){
  const id=session&&session.cur;if(!id||!isNew(id))return;const now=Date.now();
  const lg=logToday();const prevLog=Object.assign({},lg);
  // taught, not yet tested: the first real question is spaced by steps, not by the clock. it waits until at least
  // 2 other steps have passed (lesson A, review, lesson B, check A, ...); a sibling card of the same note waits 2 steps more
  const nid=BYID[id].nid;const ids=[id,...(NCARDS[nid]||[]).filter(x=>x!==id&&isNew(x)&&BYID[x].k!=='rev')];
  session.taughtAt=session.taughtAt||{};
  ids.forEach((x,i)=>{P.cards[x]={q:'learn',step:0,reps:0,lapses:0,due:now+i*1000,taught:today()};session.taughtAt[x]=session.step+2*i});
  lg.n+=ids.length;session.nNew+=ids.length;session.newQueue=session.newQueue.filter(x=>!ids.includes(x));
  session.step++;session.roundNew++;if(!session.taught.includes(nid))session.taught.push(nid);fx.step();
  undoStack.push({id,ids,prev:null,prevLog,day:today(),wasNew:true});if(undoStack.length>20)undoStack.shift();
  persist('progress');nextCard();
}

async function api(body,url){
  if(!LIVE_SITE&&(url||SYNC_URL)===REAL_SYNC)throw new Error('sync with the real account is blocked outside the live site');
  const r=await fetch(url||SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});
  if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();if(j&&j.error)throw new Error(j.error);return j;

async function flush(which){
  if(!SYNC_URL)return;
  if(busy[which]){again[which]=true;return}
  busy[which]=true;pend[which]=false;clearTimeout(timers[which]);
  const data=JSON.parse(JSON.stringify(which==='progress'?P:D));
  const crs=COURSE;const body={action:'put',which:which+sfx(),data};if(which==='progress')body.summary=remindSummary();
  try{
    const j=await api(body);
    if(j.stale&&j.data&&crs===COURSE){ // another device saved something newer
      if(which==='progress'){P=normP(j.data);lsSave(LS_P,P)}else{D=normD(j.data);lsSave(LS_D,D)}
      rebuild();if(view!=='study')render();

}

const STOP=new Set(['של','את','על','עם','או','גם','לא','כי','זה','זו','זהו','זוהי','שלו','שלה','שלהם','כל','בין','אך','אבל','הם','הן','הוא','היא','אשר','רק','עוד','כמו','מתוך','אל','לפי','יש','אין','אחד','אחת','ו','ה','ב','ל','מ','ש']);
function words(s){return norm(s).split(' ').filter(w=>w.length>=2&&!STOP.has(w))}
function stripPre(w){return w.length>=4?w.replace(/^[והבלמשכ]{1,2}/,''):w}
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 2;const m=a.length,n=b.length;let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
function wordMatch(a,b){if(a===b)return true;const a2=stripPre(a),b2=stripPre(b);if(a2===b||a===b2||a2===b2)return true;
  const L=Math.min(a.length,b.length);return L>=4&&(lev(a,b)<=1||lev(a2,b2)<=1)}
function overlap(typedW,ans){const k=words(ans);if(!k.length)return 0;let hit=0;for(const w of k)if(typedW.some(t=>wordMatch(t,w)))hit++;return hit/k.length}
function localCheck(c){
  const q=cardQA(c);const mine=typed.trim();if(!mine||!q.answer){check=null;return}
  const ans=String(q.answer);const tw=words(mine);
  const alts=[ans,ans.replace(/\(.*?\)/g,' '),...(ans.match(/\((.*?)\)/g)||[]).map(s=>s.slice(1,-1)),...ans.split(/\s*\/\s*|\.\s+/)].filter(s=>s&&s.trim());
  if(alts.some(a=>norm(a)===norm(mine))){check={state:'ok',text:'נכון'};return}
  const sc=Math.max(...alts.map(a=>overlap(tw,a)));
  check=sc>=0.75?{state:'ok',text:'נכון'}:sc>=0.4?{state:'part',text:'חלקית. השווה לתשובה המלאה'}:{state:'no',text:'לא תואם לתשובה. שווה לבדוק אם התכוונת לאותו דבר'};
}

    return {ok:true,msg:'ההתקדמות יובאה: '+Object.keys(P.cards).length+' כרטיסים שכבר למדת.'};
  }
  if(o&&o.type==='evo-cards'&&Array.isArray(o.cards)){
    let key=o.lecture&&o.lecture.key;
    if(o.lecture&&o.lecture.name){
      const ex=LECS.find(l=>l[1]===o.lecture.name||l[0]===key);
      if(ex)key=ex[0];else{key=key||('L'+Date.now().toString(36));D.lectures.push({key,name:o.lecture.name})}
    }
    if(!key)key=LECS[LECS.length-1][0];
    if(key==='general'&&!D.lectures.some(l=>l.key==='general'))D.lectures.push({key:'general',name:'כללי'});
    if(o.lecture&&o.lecture.map){const l=D.lectures.find(x=>x.key===key);if(l)l.map=o.lecture.map}
    D.mcq=D.mcq||[];
    const have=new Set([...BASE.map(b=>b.id),...D.added.map(a=>a.id),...D.mcq.map(a=>a.id)]);let n=0,i=0,nm=0;
    for(const x of o.cards){i++;
      const id=x.id||('u'+Date.now().toString(36)+i);if(have.has(id))continue;
      if(x.type==='mc'&&x.front&&Array.isArray(x.options)&&x.options.length>=2){D.mcq.push({id,f:x.front,o:x.options,e:x.extra||'',t:key});nm++}
      else if((x.type==='qa'||x.k==='qa')&&(x.front||x.f)&&(x.back||x.b)){D.added.push({id,k:'qa',f:x.front||x.f,b:x.back||x.b,e:x.extra||x.e||'',t:key,img:x.img,cap:x.cap});n++}
      else if((x.type==='cloze'||x.k==='cz')&&clozeOk(x.text||x.x||'')){D.added.push({id,k:'cz',x:x.text||x.x,e:x.extra||x.e||'',t:key,img:x.img,cap:x.cap});n++}
    }

    let nl=0;if(Array.isArray(o.lessons)){for(const ls of o.lessons){if(!ls||!ls.m||!(ls.L||ls.e))continue;

      for(const n0 of NOTES){const k=n0.k==='qa'?(n0.f||''):(n0.x||'');if(!k.startsWith(ls.m))continue;
        const b=BASE.find(x=>x.id===n0.id);if(b)D.edits[n0.id]=Object.assign({},D.edits[n0.id]||{},ch);else{const a=D.added.find(x=>x.id===n0.id);if(a)Object.assign(a,ch)}nl++}}}
    let nc=0;if(Array.isArray(o.concepts)){D.concepts=D.concepts||[];for(const c of o.concepts){if(!c||!c.n||!Array.isArray(c.kw))continue;const i3=D.concepts.findIndex(x=>x.n===c.n);if(i3>=0)D.concepts[i3]=c;else D.concepts.push(c);nc++}}
    let np=0;if(Array.isArray(o.pairs)){D.pairs=D.pairs||[];for(const pr of o.pairs){if(!pr||!pr.id||!Array.isArray(pr.terms)||!Array.isArray(pr.items))continue;const i2=D.pairs.findIndex(x=>x.id===pr.id);const v=Object.assign({},pr,{t:pr.t||key});if(i2>=0)D.pairs[i2]=v;else D.pairs.push(v);np++}}
    rebuild();persist('deck');lecFilter='all';
    if((np||nc||nl)&&!n&&!nm)return {ok:true,msg:[np?np+' זוגות מושגים להבחנה נוספו.':'',nc?nc+' מושגים נוספו לסדר הלימוד.':'',nl?nl+' כרטיסים קיבלו הסבר מורחב.':''].join(' ').trim()};
    return {ok:true,msg:(n||nm)?(n?n+' כרטיסים חדשים נוספו. ':'')+(nm?nm+' שאלות אמריקאיות נוספו לתרגול.':''):'כל הכרטיסים האלה כבר קיימים.'};
  }

}

function stepBar(){

  else if(s.cur&&BYID[s.cur]){const c=BYID[s.cur],x=st(s.cur);kind=teachable(c)?'teach':!x?'first':x.q==='review'?'review':x.q==='relearn'?'relearn':'first'}
  const K={map:['פתיחת הרצאה','לפני מושגים חדשים: התמונה הגדולה של ההרצאה'],teach:['מושג חדש','קודם קוראים ומבינים. השאלה עליו תגיע בעוד כמה צעדים'],

function answer(g){
  const id=session.cur;if(!id||!revealed)return;const now=Date.now();
  if(session.mode==='cram'){session.queue.shift();session.done++;if(g===1){session.again++;session.queue.splice(Math.min(3,session.queue.length),0,id);maybeDrill(id)}nextCard();return}
  const prev=P.cards[id]?JSON.parse(JSON.stringify(P.cards[id])):null;
  const lg=logToday();const prevLog=Object.assign({},lg);
  const wasNew=!prev, wasReview=prev&&prev.q==='review';
  const stBefore=stagesOf(BYID[id].nid);
  P.cards[id]=schedule(id,g,now,false);
  fx.grade(g);const grew=grewFrom(stBefore);if(grew.length)fx.conceptGrew(grew);
  // review history (card, minute, grade, confidence) kept for tuning the scheduler to this learner later
  P.rl=(P.rl||[]).concat([[id,Math.round(now/60000),g,conf?conf[0]:'']]);if(P.rl.length>1500)P.rl=P.rl.slice(-1500);
  lg.t++;if(wasNew)lg.n++;if(wasReview){lg.r++;if(g>1)lg.ok++}
  if(wasNew)session.newQueue=session.newQueue.filter(x=>x!==id);
  undoStack.push({id,prev,prevLog,day:today(),wasNew});if(undoStack.length>20)undoStack.shift();
  if(g===1&&P.cards[id].q!=='review'&&P.cards[id].due>=nextBoundary(now))toast('שלוש פעמים "שוב" היום. הכרטיס יחזור מחר, אחרי שינה');
  session.done++;if(g===1)session.again++;if(wasNew)session.nNew++;
  session.step++;if(wasReview)session.roundRev++;
  if(g===1)maybeDrill(id);
  persist('progress');nextCard();
}
function undo(){
  const u=undoStack.pop();if(!u)return;
  if(u.ids){for(const x of u.ids)delete P.cards[x];session.newQueue=u.ids.slice(1).concat(session.newQueue)}
  else if(u.prev)P.cards[u.id]=u.prev;else delete P.cards[u.id];
  if(P.rl&&P.rl.length&&P.rl[P.rl.length-1][0]===u.id)P.rl.pop();
  P.log[u.day]=u.prevLog;if(u.wasNew)session.newQueue.unshift(u.id);
  session.done=Math.max(0,session.done-1);
  if(session.size){session.step=Math.max(0,session.step-1);if(u.ids)session.roundNew=Math.max(0,session.roundNew-1);else if(u.prev&&u.prev.q==='review')session.roundRev=Math.max(0,session.roundRev-1)}
  persist('progress');resetCardUI();session.cur=u.id;render();toast('התשובה האחרונה בוטלה');
}

// ---------- stats ----------
function weakCards(){return CARDS.filter(c=>{const s=st(c.id);return s&&((s.lapses||0)>=2||(s.ill||0)>=1||(s.D!=null&&s.D>=8.5))}).sort((a,b)=>((st(b.id).lapses||0)+(st(b.id).ill||0))-((st(a.id).lapses||0)+(st(a.id).ill||0)))}
function advance(ids){let n=0;const now=Date.now();for(const id of new Set(ids)){const s=P.cards[id];if(s&&s.q==='review'&&s.due>now){s.due=now;n++}}if(n)persist('progress');return n}
function streak(){let n=0;const t=new Date(Date.now()-ROLL*HOUR);if(!(P.log[dayKeyOf(t)]?.t))t.setDate(t.getDate()-1);
  for(;;){if(P.log[dayKeyOf(t)]?.t){n++;t.setDate(t.getDate()-1)}else break}return n}
function retention(){let r=0,ok=0;const cut=dayKey(Date.now()-30*DAY);for(const [k,v] of Object.entries(P.log))if(k>=cut){r+=v.r||0;ok+=v.ok||0}return r?Math.round(100*ok/r):null}
function lecStats(L){let n=0,l=0,y=0,m=0;for(const c of CARDS){if(c.t!==L)continue;const s=st(c.id);if(!s)n++;else if(s.q!=='review')l++;else if(s.ivl>=21)m++;else y++}return {n,l,y,m,tot:n+l+y+m}}
function forecast(){const b=nextBoundary(Date.now());const out=Array(7).fill(0);
  for(const c of CARDS){const s=st(c.id);if(!s||s.q!=='review')continue;const i=s.due<b?0:Math.floor((s.due-b)/DAY)+1;if(i<7)out[i]++}return out}

// ---------- text helpers ----------
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const CZ=/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g;
function plain(x){return String(x||'').replace(CZ,'$2')}
function clozeFront(x,n){return esc(x).replace(CZ,(m,k,a,h)=>+k===n?'<span class="blank">'+(h?esc(h):'[ … ]')+'</span>':a)}
function clozeBack(x,n){return esc(x).replace(CZ,(m,k,a)=>+k===n?'<span class="ans">'+a+'</span>':a)}
function clozeAnswer(x,n){const a=[];String(x).replace(CZ,(m,k,v)=>{if(+k===n)a.push(v)});return a.join(' / ')}
function clozeOk(t){return /\{\{c\d+::.+?\}\}/.test(t)&&(t.match(/\{\{/g)||[]).length===(t.match(/\}\}/g)||[]).length}
function norm(s){return String(s).replace(/[֑-ׇ]/g,'').replace(/["'׳״().,;:!?\-–—]/g,' ').replace(/\s+/g,' ').trim().toLowerCase()}
function cardQA(c){ // {promptHtml, backHtml, answer, extra, note}
  const n=NBYID[c.nid];
  if(c.k==='qa')return {ask:'שאלה',front:esc(n.f),back:esc(n.f),answer:n.b,extra:n.e||'',n};
  if(c.k==='rev')return {ask:'איזה מושג מתאים להגדרה?',front:esc(n.b),back:esc(n.b),answer:termOf(n),extra:n.e||'',n};
  return {ask:'השלם את החסר',front:clozeFront(n.x,c.n),back:clozeBack(n.x,c.n),answer:clozeAnswer(n.x,c.n),extra:n.e||'',n};
}
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(k==='on')for(const [ev,fn] of Object.entries(v))e.addEventListener(ev,fn);else if(k==='html')e.innerHTML=v;else if(k==='value')e.value=v;else if(k==='checked')e.checked=!!v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e}
function toast(m){const t=h('div',{class:'toast'+(view!=='study'?' navd-toast':''),role:'status'},m);document.body.append(t);setTimeout(()=>t.remove(),2800)}

// ---------- quiz (multiple choice) ----------
function mcqs(){return (COURSE==='evo'?EVO_MCQ:[]).concat(D.mcq||[]).filter(m=>(lecFilter==='all'||m.t===lecFilter)&&mcqReady(m))}
function buildQuiz(count){
  count=count||10;
  // questions written for the exam format come first; generated ones fill the rest
  const dueIds=new Set(mcqDue().map(m=>m.id));const pool=mcqs();
  const auth=shuffle(pool.filter(m=>dueIds.has(m.id))).concat(shuffle(pool.filter(m=>!dueIds.has(m.id)))).slice(0,Math.round(count*0.7)).map(mcqItem);
  const gen=buildGenQuiz(count-auth.length);
  return {qs:shuffle(auth.concat(gen.qs)),i:0,score:0};
}
function buildGenQuiz(count){
  const pool=[];
  // questions and wrong options come only from material already learned
  const defs=NOTES.filter(n=>n.k==='qa'&&termOf(n)&&noteSeen(n.id));
  const seenCz=CARDS.filter(x=>x.k==='cz'&&P.cards[x.id]);
  if(defs.length>=4)for(const n of defs){if(lecFilter!=='all'&&n.t!==lecFilter)continue;if(!P.cards[n.id]||!textReady(noteTxt(n)))continue;pool.push({kind:'def',n,answer:termOf(n),prompt:n.b,ask:'איזה מושג מתאים להגדרה?'})}
  for(const c of seenCz){if(!inFilter(c))continue;const n=NBYID[c.nid];const a=clozeAnswer(n.x,c.n);if(a.length>40||!textReady(plain(n.x)))continue;pool.push({kind:'cz',n,c,answer:a,promptHtml:clozeFront(n.x,c.n),ask:'השלם את החסר'})}
  const qs=shuffle(pool).map(item=>{
    const same=item.kind==='def'?defs.map(d=>termOf(d)):seenCz.map(x=>clozeAnswer(NBYID[x.nid].x,x.n)).filter(a=>a.length<=40);
    const lecOf=item.kind==='def'?defs.filter(d=>d.t===item.n.t).map(d=>termOf(d)):seenCz.filter(x=>x.t===item.n.t).map(x=>clozeAnswer(NBYID[x.nid].x,x.n));
    // a wrong option may not mention a concept that was not taught yet either (e.g. a basics card added after its users were learned)
    const ok=a=>norm(a)!==norm(item.answer)&&!norm(item.answer).includes(norm(a))&&!norm(a).includes(norm(item.answer))&&textReady(a);
    const byLen=arr=>[...new Set(arr)].filter(ok).sort((a,b)=>Math.abs(a.length-item.answer.length)-Math.abs(b.length-item.answer.length));
    let distract=shuffle(byLen(lecOf).slice(0,6)).slice(0,3);
    if(distract.length<3)distract=distract.concat(byLen(same).filter(a=>!distract.includes(a)).slice(0,3-distract.length));
    return distract.length<2?null:Object.assign(item,{opts:shuffle([item.answer,...distract]),picked:null});
  }).filter(Boolean).slice(0,count||10);
  return {qs,i:0,score:0};
}

// ==== FX ==== (feedback layer: sounds, haptics, animations; owned by the "live feedback" work)
// Called by the study flow: reveal() on showing an answer, grade(g) after a grade 1-4, exResult(ok) after an exercise,
// step() after a lesson card, conceptGrew(names) when concepts reached seedling/tree, roundEnd(session) on the round summary,
// settings() returns a settings row (or null) shown under "הגדרות ואיך זה עובד".
// Keep every method safe to call at any time (no throws), and quiet when the user turned sound/vibration off.
// Most calls happen just before render() replaces the DOM, so visual effects run on the next frame (later()).
const fx=(()=>{
  let ac=null,bus=null;
  const on=()=>{try{return !(P&&P.settings&&P.settings.fx===false)}catch(e){return true}};
  const ctx=()=>{
    if(ac){if(ac.state==='suspended')ac.resume().catch(()=>{});return ac}
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;
    ac=new A();bus=ac.createGain();bus.gain.value=0.16;bus.connect(ac.destination);return ac};
  // one soft note: quick attack, exponential fade
  const tone=(freq,at,dur,vol,type)=>{const c=ctx();if(!c)return;const t=c.currentTime+0.01+(at||0),d=dur||0.18;
    const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.5,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+0.05)};
  const glide=(f1,f2,dur,vol)=>{const c=ctx();if(!c)return;const t=c.currentTime+0.01;
    const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.05)};
  const snd=f=>{try{f()}catch(e){}};
  const buzz=p=>{try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}};
  const calm=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
  const later=f=>{try{(window.requestAnimationFrame||setTimeout)(()=>{try{f()}catch(e){}})}catch(e){}};
  // restart a CSS animation class on an element
  const kick=(el,cls)=>{if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);
    el.addEventListener('animationend',()=>el.classList.remove(cls),{once:true})};
  const q=s=>document.querySelector('#app '+s);
  const safe=f=>(...a)=>{if(!on())return;try{f(...a)}catch(e){}};
  const N={C4:261.63,E4:329.63,G4:392,C5:523.25,D5:587.33,E5:659.25,G5:783.99,C6:1046.5,E6:1318.5};
  return {
    reveal:safe(()=>{snd(()=>tone(N.E5,0,0.12,0.25,'triangle'));buzz(8);later(()=>kick(q('.card'),'fx-flip'))}),
    // a self-grade gets the SAME neutral "step done" feedback whatever it is: a nicer sound for "טוב/קל" than for "שוב"
    // would reward pressing "טוב" and make the grades (and so the schedule) less honest. Celebrate effort, not the grade.
    grade:safe(g=>{
      snd(()=>{tone(N.C5,0,0.1,0.22);tone(N.G5,0.06,0.14,0.2)});
      buzz(10);
      later(()=>kick(q('.card'),'fx-settle'));
      if(g===1)later(()=>toast('טוב שסימנת. הוא יחזור בקרוב, וכך הוא ייזכר בסוף'))}),
    exResult:safe(ok=>{
      if(ok){snd(()=>{tone(N.G5,0,0.12,0.3,'triangle');tone(N.C6,0.08,0.24,0.28,'triangle')});buzz([10,40,10])}
      else{snd(()=>glide(N.G4,N.E4,0.28,0.22));buzz(14)}}),
    step:safe(()=>{snd(()=>tone(N.G5,0,0.08,0.12));later(()=>kick(q('.stepbar .progress i')||q('.progress i'),'fx-pulse'))}),
    conceptGrew:safe(names=>{
      const list=(names||[]).map(String).filter(Boolean);if(!list.length)return;
      snd(()=>{tone(N.C6,0.25,0.3,0.18,'triangle');tone(N.E6,0.33,0.4,0.15,'triangle')});buzz([6,50,6]);
      later(()=>{const b=document.createElement('div');b.className='fx-grew';b.setAttribute('role','status');
        b.textContent='🌱 צמח: '+list.slice(0,3).join(' · ')+(list.length>3?' ועוד '+(list.length-3):'');
        document.body.append(b);setTimeout(()=>b.remove(),2600)})}),
    roundEnd:safe(()=>{
      snd(()=>[N.C5,N.E5,N.G5,N.C6].forEach((f,i)=>tone(f,i*0.09,0.35,0.24,'triangle')));buzz([12,60,12,60,20]);
      if(calm())return;
      later(()=>{const d=q('.done');if(!d)return;const box=document.createElement('div');box.className='fx-confetti';box.setAttribute('aria-hidden','true');
        const cols=['var(--accent)','var(--good)','var(--easy)','var(--hard)'];
        for(let i=0;i<28;i++){const p=document.createElement('i');
          p.style.cssText=`left:${(4+Math.random()*92).toFixed(1)}%;background:${cols[i%cols.length]};animation-delay:${(Math.random()*0.35).toFixed(2)}s;--dx:${(Math.random()*60-30).toFixed(0)}px;--rot:${(Math.random()*540-270).toFixed(0)}deg`;
          box.append(p)}
        d.classList.add('fx-host');d.append(box);setTimeout(()=>box.remove(),1600)})}),
    settings(){try{const S=P.settings;
      return h('label',{for:'fxOn'},'צלילים ורטט',h('input',{type:'checkbox',id:'fxOn',checked:S.fx!==false,on:{change:e=>{S.fx=e.target.checked;persist('progress');
        if(S.fx){snd(()=>{tone(N.C5,0,0.1,0.25);tone(N.G5,0.07,0.16,0.25)});buzz(10)}}}}))}catch(e){return null}}
  };
})();
// ==== /FX ====

// ==== EX:match ==== (exercise: match terms to definitions)
EX.push({kind:'match',name:'התאמה',why:'מחברים כל מושג להגדרה שלו',
  make(){
    const norm=s=>plain(String(s||'')).replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim().toLowerCase();
    const words=s=>new Set(norm(s).split(' ').filter(w=>w.length>1));
    const near=(a,b)=>{const A=norm(a),B=norm(b);if(!A||!B||A===B||A.includes(B)||B.includes(A))return true;
      const x=words(a),y=words(b);if(!x.size||!y.size)return false;let c=0;for(const w of x)if(y.has(w))c++;return c/Math.min(x.size,y.size)>=.7};
    const pick=[];
    for(const t of exTerms()){if(pick.length>=5)break;
      if(pick.some(p=>norm(p.term)===norm(t.term)||near(p.def,t.def)))continue;pick.push(t)}
    if(pick.length<4)return null;
    const pairs=pick.map((t,i)=>({i,term:t.term,def:t.def,ids:t.ids}));
    return {pairs,order:shuffle(pairs.map(p=>p.i)),nids:pick.map(t=>t.id),text:pairs.map(p=>p.term+' '+p.def).join(' ')};
  },
  view(item,done){
    const P_=item.pairs,st={sel:null,matched:new Set(),bad:null,mistakes:0,missed:new Set(),sent:false};
    const root=h('div',{class:'stack'});
    const pick=(side,i)=>{if(st.bad||st.matched.has(i))return;
      if(!st.sel||st.sel.side===side){st.sel=(st.sel&&st.sel.side===side&&st.sel.i===i)?null:{side,i};draw(side,i);return}
      const t=side==='t'?i:st.sel.i,d=side==='d'?i:st.sel.i;
      if(t===d){st.matched.add(t);st.sel=null;draw()}
      else{st.mistakes++;for(const id of P_[t].ids)st.missed.add(id);st.bad={t,d};st.sel=null;draw();
        setTimeout(()=>{st.bad=null;draw()},650)}};
    const btn=(side,i,label)=>{const on=st.matched.has(i),sel=st.sel&&st.sel.side===side&&st.sel.i===i,bad=st.bad&&st.bad[side]===i;
      return h('button',{type:'button',class:'mt-item'+(on?' mt-ok':'')+(sel?' mt-sel':'')+(bad?' mt-bad':''),'data-side':side,'data-i':String(i),
        'aria-pressed':sel?'true':'false',disabled:on,on:{click:()=>pick(side,i)}},label)};
    const draw=(fs,fi)=>{const all=st.matched.size===P_.length;
      root.replaceChildren(h('article',{class:'card'},
        h('div',{class:'meta'},h('span',{},'תרגיל · התאמה'),h('span',{},st.matched.size+'/'+P_.length)),
        h('div',{class:'ask'},'בחר מושג ואז את ההגדרה שלו (או להפך).'),
        h('div',{class:'mt-grid'},
          h('div',{class:'mt-col'},h('div',{class:'mt-h'},'מושגים'),...P_.map(p=>btn('t',p.i,p.term))),
          h('div',{class:'mt-col'},h('div',{class:'mt-h'},'הגדרות'),...item.order.map(i=>btn('d',i,P_[i].def)))),
        all?h('div',{class:'mt-done'},'התאמת הכול · '+(st.mistakes===0?'בלי טעויות':st.mistakes===1?'טעות אחת':st.mistakes+' טעויות')):null),
        all?h('div',{class:'dock'},h('div',{class:'dockin'},h('button',{class:'primary reveal',on:{click:()=>{if(st.sent)return;st.sent=true;done(st.mistakes<=1,[...st.missed])}}},'המשך'))):null);
      if(fs){const b=root.querySelector(`.mt-item[data-side="${fs}"][data-i="${fi}"]`);if(b)b.focus()}
      else if(all){const b=root.querySelector('.dock button');if(b)b.focus()}};
    draw();return root;
  }});
