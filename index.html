  app.append(h('section',{class:'panel stack'},h('h2',{},'הזכרת '+hit.length+' מתוך '+(hit.length+miss.length)+' מושגים ('+pct+'%)'),
    h('p',{class:'sub'},'הבדיקה לפי מילים, אז ייתכן שהזכרת משהו בניסוח אחר. עבור על הרשימה בעצמך.'),
    miss.length?h('div',{class:'stack',style:'gap:8px'},h('b',{},'פספסת:'),...miss.slice(0,40).map(t=>h('div',{class:'item'},h('b',{},t.term),h('div',{class:'sub'},String(t.ctx||'').slice(0,140))))):h('p',{},'הזכרת הכול. מצוין!'),
    hit.length?h('details',{},h('summary',{},'הזכרת ('+hit.length+')'),h('div',{class:'terms'},...hit.map(t=>h('span',{class:'hit'},t.term)))):null,
    h('div',{class:'row'},miss.length?h('button',{class:'primary',on:{click:()=>{const n=advance(missIds);toast(n?n+' כרטיסים הוקדמו לחזרה של היום':'הכרטיסים האלה עוד חדשים או כבר מחכים לחזרה')}}},'הקדם את הפספוסים לחזרה'):null,
      h('button',{on:{click:()=>{recall=null;render()}}},'שליפה חדשה'))));
}
// ---- exam simulation: mixed questions, no feedback until the end ----
function renderExam(){
  if(!exam){
    const last=(P.exams||[]).slice(-3).reverse();
    app.append(h('section',{class:'panel stack'},h('h2',{},'מבחן מסכם'),
      h('p',{},'20 שאלות מעורבות, בלי משוב באמצע, כמו במבחן אמיתי. בסוף תקבל ציון לפי הרצאה, והטעויות יוכלו להיכנס לחזרה.'),
      h('p',{class:'sub'},'מבחן תרגול הוא אחת הדרכים היעילות ביותר להתכונן: הוא מחזק את הזיכרון ומראה איפה אתה עומד באמת. הכי מועיל בשבועיים שלפני המבחן.'),
      lecChips(),last.length?h('p',{class:'sub'},'מבחנים אחרונים: '+last.map(x=>x.s+'/'+x.n+' ('+x.d+')').join(' · ')):null,
      h('div',{},h('button',{class:'primary',on:{click:()=>{exam=buildQuiz(20);exam.exam=true;if(!exam.qs.length){exam=null;toast('אין מספיק כרטיסים');return}render();window.scrollTo(0,0)}}},'התחל מבחן'))));
    return;
  }
  const z=exam;
  if(z.i>=z.qs.length){
    const right=z.qs.filter(x=>x.picked===x.answer).length;
    if(!z.saved){z.saved=true;P.exams=(P.exams||[]).concat([{d:today(),s:right,n:z.qs.length}]).slice(-30);persist('progress')}
    const byL={};for(const x of z.qs){const k=x.n.t;byL[k]=byL[k]||[0,0];byL[k][1]++;if(x.picked===x.answer)byL[k][0]++}
    const wrong=z.qs.filter(x=>x.picked!==x.answer);
    const ids=wrong.flatMap(x=>CARDS.filter(c=>c.nid===x.n.id).map(c=>c.id));
    app.append(h('section',{class:'panel stack'},h('h2',{},'ציון: '+Math.round(100*right/z.qs.length)+' ('+right+' מתוך '+z.qs.length+')'),
      h('div',{class:'stack',style:'gap:4px'},...Object.entries(byL).map(([k,v])=>h('div',{class:'row',style:'justify-content:space-between'},h('span',{},lecName(k)),h('b',{},v[0]+'/'+v[1])))),
      wrong.length?h('div',{class:'stack',style:'gap:8px'},h('b',{},'הטעויות:'),...wrong.map(x=>h('div',{class:'item'},
        h('div',{class:'txt',html:x.kind==='def'?esc(x.prompt):x.promptHtml}),h('div',{},'תשובה: ',h('b',{},x.answer),x.picked?h('span',{class:'sub'},' · בחרת: '+x.picked):null),x.n.e?h('div',{class:'sub'},x.n.e):null))):h('p',{},'מושלם!'),
      h('div',{class:'row'},wrong.length?h('button',{class:'primary',on:{click:()=>{const n=advance(ids);toast(n?n+' כרטיסים הוקדמו לחזרה של היום':'הכרטיסים האלה עוד חדשים או כבר מחכים לחזרה')}}},'הכנס את הטעויות לחזרה'):null,
        h('button',{on:{click:()=>{exam=null;render()}}},'מבחן חדש'))));
    return;
  }
  const x=z.qs[z.i];
  app.append(h('div',{class:'stack'},
    h('div',{class:'progress',role:'progressbar','aria-valuenow':z.i,'aria-valuemax':z.qs.length},h('i',{style:`width:${100*z.i/z.qs.length}%`})),
    h('article',{class:'card'},h('div',{class:'meta'},h('span',{},`שאלה ${z.i+1} מתוך ${z.qs.length}`)),h('div',{class:'ask'},x.ask),
      h('div',{class:'q',html:x.kind==='def'?esc(x.prompt):x.promptHtml}),
      h('div',{class:'opts'},...x.opts.map(o=>h('button',{class:x.picked===o?'sel':'',on:{click:()=>{x.picked=o;render()}}},o)))),
    h('div',{class:'row'},h('button',{class:'primary',disabled:!x.picked,on:{click:()=>{z.i++;render();window.scrollTo(0,0)}}},z.i+1<z.qs.length?'לשאלה הבאה':'סיים והצג תוצאות'),
      z.i>0?h('button',{on:{click:()=>{z.i--;render()}}},'לשאלה הקודמת'):null)));
}
function renderMCQ(){
  if(!quiz)quiz=buildQuiz();
  const z=quiz;
  if(!z.qs.length){app.append(h('section',{class:'panel stack'},lecChips(),h('p',{},'אין מספיק כרטיסים להרצאה הזו.')));return}
  if(z.i>=z.qs.length){
    const wrong=z.qs.filter(x=>x.picked!==x.answer);
    app.append(h('section',{class:'panel stack'},h('h2',{},`ציון: ${z.score} מתוך ${z.qs.length}`),
      wrong.length?h('div',{class:'stack',style:'gap:8px'},h('p',{class:'sub'},'כדאי לחזור על:'),...wrong.map(x=>h('div',{class:'item'},h('div',{class:'txt'},x.kind==='def'?x.prompt:plain(x.n.x)),h('div',{},h('b',{},x.answer),x.picked?h('span',{class:'sub'},' · בחרת: '+x.picked):null)))):h('p',{},'מושלם!'),
      h('div',{class:'row'},h('button',{class:'primary',on:{click:()=>{quiz=null;render()}}},'בוחן חדש'),lecChips())));return}
  const x=z.qs[z.i];
  const opts=h('div',{class:'opts'},...x.opts.map(o=>{const b=h('button',{class:x.picked?(o===x.answer?'right':o===x.picked?'wrong':''):'',disabled:!!x.picked,on:{click:()=>{x.picked=o;if(o===x.answer)z.score++;render()}}},o);return b}));
  app.append(h('div',{class:'stack'},
    h('div',{class:'row'},lecChips()),
    h('div',{class:'progress',role:'progressbar','aria-valuenow':z.i,'aria-valuemax':z.qs.length},h('i',{style:`width:${100*z.i/z.qs.length}%`})),
    h('article',{class:'card'},h('div',{class:'meta'},h('span',{},`שאלה ${z.i+1} מתוך ${z.qs.length}`),h('span',{},lecName(x.n.t))),h('div',{class:'ask'},x.ask),
      h('div',{class:'q',html:x.kind==='def'?esc(x.prompt):x.promptHtml}),opts,
      x.picked&&x.n.e?h('div',{class:'note'},h('b',{},'הסבר'),x.n.e):null),
    x.picked?h('button',{class:'primary reveal',on:{click:()=>{z.i++;render();window.scrollTo(0,0)}}},z.i+1<z.qs.length?'לשאלה הבאה':'לתוצאות'):h('p',{class:'sub'},'הבוחן לא משנה את לוח החזרות.')));
}

function renderBrowse(){
  const search=h('input',{type:'text',id:'browseQ',dir:'auto',placeholder:'חיפוש…',value:browseQ,style:'flex:1;min-width:0',on:{input:e=>{browseQ=e.target.value;drawList()}}});
  const list=h('div',{class:'list'});
  const top=h('div',{class:'stack',style:'gap:10px'},lecChips(),h('div',{class:'row'},search,h('button',{class:'primary',on:{click:()=>{editing='__new';drawList()}}},'+ כרטיס חדש')));
  function drawList(){
    list.innerHTML='';
    if(editing==='__new')list.append(editorEl({k:'qa',t:lecFilter==='all'?LECS[0][0]:lecFilter},res=>{editing=null;if(res==='added')toast('הכרטיס נוסף');render()}));
    const ns=NOTES.filter(n=>(lecFilter==='all'||n.t===lecFilter)&&(!browseQ||(n.f+' '+n.b+' '+plain(n.x)+' '+n.e).includes(browseQ)));
    for(const n of ns.slice(0,300)){
      if(editing===n.id){list.append(editorEl(n,res=>{editing=null;if(res==='saved')toast('השינויים נשמרו');if(res==='deleted')toast('הכרטיס נמחק');render()}));continue}
      const ids=CARDS.filter(c=>c.nid===n.id).map(c=>st(c.id));
      const lbl=ids.length&&ids.every(Boolean)?(ids.every(s=>s.q==='review')?'נלמד':'בלמידה'):'חדש';
      list.append(h('div',{class:'item'},h('div',{class:'line'},h('span',{class:'txt',html:n.k==='qa'?'<b>'+esc(n.f)+'</b> '+esc(n.b):esc(n.x).replace(CZ,'<span class="ans">$2</span>')}),
        h('span',{class:'tag'},lecShort(n.t)+' · '+lbl),h('button',{style:'padding:2px 10px;font-size:.85rem',on:{click:()=>{editing=n.id;drawList()}}},'ערוך'))));
    }
    if(!ns.length)list.append(h('p',{class:'sub'},'אין כרטיסים שמתאימים לחיפוש.'));
  }
  drawList();
  app.append(h('div',{class:'stack'},top,h('div',{class:'sub'},NOTES.length+' רשומות · כרטיס השלמה עם כמה הסתרות נספר כרשומה אחת'),list));
}

document.addEventListener('keydown',e=>{
  if(view!=='study'||!session||!session.cur||editing)return;
  const tag=e.target&&e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(!revealed&&['1','2','3'].includes(e.key)){e.preventDefault();reveal(['sure','unsure','none'][+e.key-1]);return}
  if(!revealed&&(e.key===' '||e.key==='Enter')){e.preventDefault();reveal();return}
  if(revealed&&['1','2','3','4'].includes(e.key)){e.preventDefault();answer(+e.key);return}
  if(revealed&&(e.key===' '||e.key==='Enter')&&e.target===document.body){e.preventDefault();answer(3);return}
  if((e.key==='u'||e.key==='U'||e.key==='ו')&&session.mode==='srs'){e.preventDefault();undo()}
});
window.addEventListener('pagehide',()=>{lsSave(LS_P,P);lsSave(LS_D,D);flushPending()});

applyCourse();rebuild();render();initStore();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
