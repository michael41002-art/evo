// ==== EX:tf ==== (exercise: quick true / false statements)
// Five statements "<term>: <definition>". About half carry the term's own definition, the rest a definition of another
// learned term (from the same lecture when possible, so it is a real confusion). Answer each with נכון / לא נכון.
EX.push({kind:'tf',name:'נכון או לא',why:'החלטות מהירות: האם ההגדרה מתאימה למושג?',
  make(){
    // the statements are about terms that need practice (exTerms); a wrong definition may come from any learned term
    const terms=learnedTerms().filter(a=>a.term&&a.def),subs=exTerms().filter(a=>a.term&&a.def);if(terms.length<4||subs.length<4)return null;
    const N=5,nTrue=Math.random()<.5?2:3;const truth=shuffle([...Array(N)].map((_,i)=>i<nTrue));
    const used=new Set(),st=[];
    for(let i=0;st.length<N&&i<N*3;i++){
      const a=subs[i%subs.length];let want=truth[st.length];
      const key=(d)=>a.term+'\u0001'+d;
      if(want&&used.has(key(a.def)))want=false;
      let def=a.def,from=a;
      if(!want){const others=terms.filter(b=>b!==a&&b.def!==a.def&&b.term!==a.term&&!used.has(key(b.def)));if(!others.length)continue;
        const same=others.filter(b=>b.t===a.t);from=shuffle(same.length?same:others)[0];def=from.def}
      if(used.has(key(def)))continue;used.add(key(def));
      st.push({term:a.term,def,ok:want,real:a.def,nid:a.id,ids:a.ids.concat(want?[]:from.ids)})}
    if(st.length<4)return null;
    return {st,nids:[...new Set(st.map(s=>s.nid))],text:st.map(s=>s.term+': '+s.def+(s.ok?'':' '+s.term+' = '+s.real)).join(' \n ')};
  },
  view(item,done){
    const st=item.st,N=st.length,ans=[],pick=[];let i=0,fin=false;const root=h('div',{class:'tf'});
    const answer=v=>{if(ans[i]!=null||i>=N)return;pick[i]=v;ans[i]=(v===st[i].ok);draw()};
    const next=()=>{if(ans[i]==null)return;i++;draw();window.scrollTo(0,0)};
    const finish=()=>{if(fin)return;fin=true;document.removeEventListener('keydown',key);
      const right=ans.filter(Boolean).length,ids=[...new Set(st.flatMap((s,k)=>ans[k]?[]:s.ids))];done(right>=Math.min(4,N-1),ids)};
    function key(e){if(!root.isConnected){document.removeEventListener('keydown',key);return}
      const tag=e.target&&e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||document.querySelector('.zoom'))return;
      if(i>=N){if(e.key==='Enter'||e.key===' '){e.preventDefault();finish()}return}
      if(ans[i]==null){if(e.key==='ArrowRight'||e.key==='1'){e.preventDefault();answer(true)}else if(e.key==='ArrowLeft'||e.key==='2'){e.preventDefault();answer(false)}}
      else if(e.key==='Enter'||e.key===' '||e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();next()}}
    document.addEventListener('keydown',key);
    const dock=(label,fn)=>h('div',{class:'dock'},h('div',{class:'dockin'},h('button',{class:'primary reveal',on:{click:fn}},label)));
    function draw(){
      root.replaceChildren();
      if(i>=N){const right=ans.filter(Boolean).length;
        root.append(h('article',{class:'card tf-end'},
          h('div',{class:'meta'},h('span',{},'נכון או לא'),h('span',{},'סיכום')),
          h('div',{class:'tf-score'},h('b',{},right+'/'+N),' נכון'),
          h('ul',{class:'tf-list'},...st.map((s,k)=>h('li',{class:ans[k]?'ok':'no'},h('span',{class:'tf-mark'},ans[k]?'✓':'✗'),
            h('span',{},h('b',{},s.term),' = ',s.real))))),
          dock('המשך',finish));return}
      const s=st[i],a=ans[i];
      const card=h('article',{class:'card'+(a==null?'':a?' sw-good':' sw-again')},
        h('div',{class:'meta'},h('span',{},'נכון או לא'),h('span',{class:'tf-count'},(i+1)+'/'+N)),
        h('div',{class:'ask'},'האם ההגדרה מתאימה למושג?'),
        h('div',{class:'q tf-st'},h('b',{},s.term),': ',s.def),
        h('div',{class:'tf-btns'},
          h('button',{class:'tf-yes'+(a!=null&&s.ok?' right':'')+(pick[i]===true&&!s.ok?' wrong':''),disabled:a!=null,on:{click:()=>answer(true)}},'נכון'),
          h('button',{class:'tf-no'+(a!=null&&!s.ok?' right':'')+(pick[i]===false&&s.ok?' wrong':''),disabled:a!=null,on:{click:()=>answer(false)}},'לא נכון')));
      if(a!=null){card.append(h('div',{class:'tf-res '+(a?'ok':'no')},a?'נכון!':'לא בדיוק.',' ',s.ok?'ההגדרה הזאת אכן של המושג.':'ההגדרה הזאת לא שייכת למושג.'));
        if(!s.ok)card.append(h('div',{class:'note tf-fix'},h('b',{},s.term),' = ',s.real))}
      root.append(card);if(a!=null)root.append(dock(i+1<N?'הבא':'לסיכום',next));
    }
    draw();return root;
  }});
// ==== /EX:tf ====

// ==== EX:image ==== (exercise: what does this slide figure show?)
// One learned slide figure, "which concept does it show?", 4 options from other learned terms (images first, same lecture first).
// The caption is hidden until the answer (it often names the concept); caption / explanation are shown only if they use taught concepts.
const exImgOk=t=>!!t&&t.length<=70&&!t.endsWith('…');
// termOf() drops a leading quote mark ("תיאוריה" במדע → תיאוריה" במדע); put it back when the question had it
const exImgTerm=(term,nid)=>{term=(term||'').trim();const n=NBYID[nid];return n&&!term.startsWith('"')&&(n.f||'').includes('"'+term)?'"'+term:term};
EX.push({kind:'image',name:'מה רואים כאן?',why:'מזהים מושג מתוך איור מהשקפים',
  make(){
    const imgs=learnedImages().filter(x=>exImgOk(x.term));if(!imgs.length)return null;
    const pool=[];const seen=new Set();
    const add=(term,t,img,nid)=>{const k=exImgTerm(term,nid);if(!exImgOk(k)||seen.has(k))return;seen.add(k);pool.push({term:k,t,img})};
    for(const x of imgs)add(x.term,x.n.t,1,x.id);
    for(const x of learnedTerms())add(x.term,x.t,0,x.id);
    // the figure asked about is one that needs practice (see exNeedy); the wrong options may be any learned term
    for(const pick of exNeedy(imgs,x=>x.id)){
      const answer=exImgTerm(pick.term,pick.id),others=pool.filter(o=>o.term!==answer);if(others.length<3)continue;
      const rank=o=>(o.t===pick.n.t?0:2)+(o.img?0:1); // same lecture first, then images before plain terms
      const wrong=shuffle(others).sort((a,b)=>rank(a)-rank(b)).slice(0,3).map(o=>o.term);
      const opts=shuffle([answer,...wrong]);
      const cap=pick.cap&&textReady(pick.cap)?pick.cap:'',e=pick.n.e&&textReady(pick.n.e)?pick.n.e:'';
      const ask='איזה מושג או תופעה האיור הזה ממחיש?';
      return {src:pick.src,cap,e,answer,opts,t:pick.n.t,ids:pick.ids,nids:[pick.id],ask,picked:null,
        text:[ask,...opts,cap,e].filter(Boolean).join(' ')};
    }
    return null;
  },
  view(item,done){
    const root=h('div',{class:'stack exi'});let sent=false;
    const draw=()=>{
      const z=item,ok=z.picked===z.answer;
      const img=h('img',{src:z.src,loading:'lazy',alt:z.picked?(z.cap||'איור מהשקפים'):'איור מהשקפים, נסה לזהות מה הוא מראה',
        on:{click:()=>zoomImg(z.src,z.picked?z.cap:'')}});
      const card=h('article',{class:'card'},
        h('div',{class:'meta'},h('span',{},lecName(z.t))),
        h('figure',{class:'exi-fig'},img,h('figcaption',{},z.picked&&z.cap?z.cap+' · הקש להגדלה':'הקש להגדלה')),
        h('div',{class:'ask'},z.ask),
        h('div',{class:'opts'},...z.opts.map(o=>h('button',{class:z.picked?(o===z.answer?'right':o===z.picked?'wrong':''):'',disabled:!!z.picked,
          on:{click:()=>{if(z.picked)return;z.picked=o;draw()}}},o))),
        z.picked?h('div',{class:'exi-res '+(ok?'good':'bad')},ok?'נכון!':'לא בדיוק. התשובה: '+z.answer):null,
        z.picked&&z.e?h('div',{class:'note'},h('b',{},'הסבר'),z.e):null);
      root.replaceChildren(...[card,z.picked?h('div',{class:'dock'},h('div',{class:'dockin'},
        h('button',{class:'primary reveal',on:{click:()=>{if(sent)return;sent=true;done(ok,ok?[]:z.ids)}}},'המשך'))):null].filter(Boolean));
    };
    draw();return root;
  }});
// ==== /EX:image ====

document.addEventListener('keydown',e=>{
  if(view!=='study'||!session||!session.cur||editing||session.drill||session.pendingMap||document.querySelector('.zoom'))return;
  const tag=e.target&&e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(BYID[session.cur]&&teachable(BYID[session.cur])){if(e.key===' '||e.key==='Enter'){e.preventDefault();teachDone()}return}
  // before the reveal: 1 יודע · 2 חושב ש… · 3 אין לי מושג. space / Enter do nothing, so the commitment stays a conscious choice
  if(!revealed&&['1','2','3'].includes(e.key)){e.preventDefault();reveal(CONF[+e.key-1][0]);return}
  if(!revealed&&(e.key===' '||e.key==='Enter')&&e.target===document.body){e.preventDefault();return}
  if(revealed&&['1','2','3','4'].includes(e.key)){e.preventDefault();answer(+e.key);return}
  // grading is a conscious choice: space / Enter never grade (only the keys 1-4 or the buttons)
  if(revealed&&(e.key===' '||e.key==='Enter')&&e.target===document.body){e.preventDefault();return}
  if((e.key==='u'||e.key==='U'||e.key==='ו')&&session.mode==='srs'){e.preventDefault();undo()}
});

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
